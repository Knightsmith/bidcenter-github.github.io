<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shadcn-html 示例页</title>

<!-- ===== 1. 主题（含明暗两套变量）===== -->
<link rel="stylesheet" href="../theme/default-semantic-tokens.css">

<!-- ===== 2. 按需引入组件 CSS ===== -->
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="../components/badge/badge.css">
<link rel="stylesheet" href="../components/card/card.css">
<link rel="stylesheet" href="../components/input/input.css">
<link rel="stylesheet" href="../components/label/label.css">
<link rel="stylesheet" href="../components/tabs/tabs.css">
<link rel="stylesheet" href="../components/dialog/dialog.css">

<!-- ===== 3. 页面自身排版样式（用主题 CSS 变量）===== -->
<style>
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .topbar {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .topbar-title { font-size: 1rem; font-weight: 600; flex: 1; }
  .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 1rem; }
  .section-title { font-size: 1.25rem; font-weight: 600; margin: 2rem 0 0.5rem; }
</style>
</head>
<body>

<div class="topbar">
  <i data-lucide="sparkles"></i>
  <span class="topbar-title">shadcn-html 组件示例</span>
  <span class="badge" data-variant="outline">v0.1.1</span>
  <button class="btn" data-variant="outline" data-size="sm" id="theme-toggle">
    <i data-lucide="moon"></i> 切换主题
  </button>
</div>

<div class="container">

  <h1 class="section-title" style="margin-top:0">统计卡片</h1>
  <div class="stats">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">今日访问</h3>
        <p class="card-description">较昨日 +12.5%</p>
      </div>
      <div class="card-content" style="font-size:1.75rem;font-weight:700">8,846</div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">新增用户</h3>
        <p class="card-description">本周累计</p>
      </div>
      <div class="card-content" style="font-size:1.75rem;font-weight:700">1,204</div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">待处理工单</h3>
        <p class="card-description">需要及时跟进</p>
      </div>
      <div class="card-content" style="font-size:1.75rem;font-weight:700">
        32 <span class="badge" data-variant="default">紧急</span>
      </div>
    </div>
  </div>

  <h2 class="section-title">组件示例</h2>
  <div class="tabs">
    <div class="tab-list" role="tablist" aria-label="组件示例">
      <button class="tab-trigger" role="tab" id="tab-buttons" aria-controls="panel-buttons" aria-selected="true">按钮与徽章</button>
      <button class="tab-trigger" role="tab" id="tab-forms" aria-controls="panel-forms" aria-selected="false" tabindex="-1">表单与弹窗</button>
    </div>

    <div class="tab-content" role="tabpanel" id="panel-buttons" aria-labelledby="tab-buttons" tabindex="0">
      <div class="row" style="margin-bottom:1rem">
        <button class="btn" data-variant="default">默认按钮</button>
        <button class="btn" data-variant="secondary">次要按钮</button>
        <button class="btn" data-variant="outline">描边按钮</button>
        <button class="btn" data-variant="ghost">幽灵按钮</button>
        <button class="btn" data-variant="destructive">危险按钮</button>
        <button class="btn" data-variant="link">链接按钮</button>
      </div>
      <div class="row">
        <span class="badge" data-variant="default">默认</span>
        <span class="badge" data-variant="secondary">次要</span>
        <span class="badge" data-variant="outline">描边</span>
      </div>
    </div>

    <div class="tab-content" role="tabpanel" id="panel-forms" aria-labelledby="tab-forms" tabindex="0" hidden>
      <div style="max-width:420px">
        <div class="field">
          <label class="label" for="demo-name">姓名</label>
          <input class="input" type="text" id="demo-name" placeholder="张三">
        </div>
        <div class="field">
          <label class="label" for="demo-mail">邮箱</label>
          <input class="input" type="email" id="demo-mail" placeholder="you@example.com">
        </div>
        <button class="btn" data-variant="default" data-dialog-trigger="confirm-dialog" aria-haspopup="dialog">
          打开确认弹窗
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<dialog id="confirm-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="dialog-content">
    <div class="dialog-header">
      <h2 class="dialog-title" id="confirm-title">确认提交？</h2>
      <p class="dialog-description">提交后信息将不可修改。</p>
    </div>
    <div class="dialog-body">
      <p style="margin:0">请确认姓名与邮箱填写无误。</p>
    </div>
    <div class="dialog-footer">
      <button class="btn" data-variant="outline" data-dialog-close>取消</button>
      <button class="btn" data-variant="default" data-dialog-close>确认提交</button>
    </div>
  </div>
</dialog>

<!-- ===== 4. 组件 JS（普通脚本，file:// 可直接运行）===== -->
<script src="../components/tabs/tabs.js"></script>
<script src="../components/dialog/dialog.js"></script>

<!-- ===== 5. lucide 图标（本地 UMD，替换 <i data-lucide>）===== -->
<script src="../vendor/lucide.min.js"></script>
<script>
  lucide.createIcons();

  // 明暗主题切换：给 <html> 加/去 class="dark"
  var toggleBtn = document.getElementById('theme-toggle');
  toggleBtn.addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
  });
</script>
</body>
</html>
