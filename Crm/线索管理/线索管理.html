<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线索管理 - 采招CRM系统</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230063FF'/%3E%3Ctext%20x='32'%20y='45'%20text-anchor='middle'%20font-size='36'%20font-weight='700'%20fill='%23ffffff'%20font-family='Microsoft%20YaHei,sans-serif'%3E%E9%87%87%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background: #ffffff;
    --foreground: #262626;
    --border: #e8ebf0;
    --muted-foreground: #8a8f99;
    --accent: #f5f6f8;
    --accent-foreground: #262626;
    --primary: #0063FF;
    --primary-dark: #0052d9;
    --primary-light: #e8f0ff;
    --radius: 6px;

    --sidebar: #ffffff;
    --sidebar-foreground: #3d4350;
    --sidebar-accent: #f2f4f7;
    --sidebar-accent-foreground: #1a1f29;
    --sidebar-border: #e8ebf0;
    --sidebar-active: #e8f0ff;
    --sidebar-width: 16rem;
    --sidebar-width-icon: 3.4rem;

    --topbar-h: 56px;
    --topbar-bg: #ffffff;
    --topbar-fg: #262626;
    --topbar-muted: #8a8f99;
    --topbar-border: #e8ebf0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--background);
    color: var(--foreground);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  a { text-decoration: none; color: inherit; cursor: pointer; }
  button { font-family: inherit; }
  svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ============ 顶部通栏（白底 / 非蓝底） ============ */
  .topbar {
    height: var(--topbar-h);
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--topbar-border);
    display: flex;
    align-items: center;
    gap: 20px;
    padding-right: 20px;
    color: var(--topbar-fg);
    position: relative;
    z-index: 20;
  }
  .topbar-logo {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 16px;
    border-right: 1px solid var(--topbar-border);
    flex-shrink: 0;
    transition: width .2s ease, min-width .2s ease;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--primary);
    color: #ffffff; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; flex-shrink: 0; }
  .logo-text .name { font-size: 16px; font-weight: 700; letter-spacing: .5px; color: #1a1f29; }

  .topbar-search {
    flex: 1 1 auto;
    max-width: 420px;
    display: flex;
    align-items: center;
    height: 34px;
    background: #f4f6f9;
    border: 1px solid var(--topbar-border);
    border-radius: 6px;
    padding: 0 4px 0 10px;
    gap: 6px;
    color: var(--topbar-muted);
  }
  .topbar-search input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--foreground); font-size: 13px; font-family: inherit;
  }
  .topbar-search input::placeholder { color: #9aa0aa; }
  .topbar-search .kbd {
    font-size: 11px; color: #9aa0aa; border: 1px solid #dfe3ea;
    border-radius: 4px; padding: 0 5px; line-height: 18px; background: #ffffff;
  }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border: none; border-radius: 6px;
    background: var(--primary); color: #ffffff; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary svg { width: 14px; height: 14px; }

  .topbar-icons { display: flex; align-items: center; gap: 4px; }
  .topbar-icons button {
    position: relative;
    width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent;
    color: #6b7280; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .topbar-icons button:hover { background: var(--accent); color: var(--accent-foreground); }
  .topbar-icons .dot {
    position: absolute; top: 5px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%; background: #f04438;
    border: 1.5px solid #ffffff;
  }

  .topbar-sep { width: 1px; height: 20px; background: var(--topbar-border); }

  .topbar-user {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: none; color: var(--topbar-fg); font-size: 13px; cursor: pointer;
    padding: 0 2px;
  }
  .topbar-user .ava {
    position: relative;
    width: 28px; height: 28px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, #dbe7ff 0%, #9ec0ff 100%);
    color: #1a4fbf; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .topbar-user .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .topbar-user .ava .ava-fb { display: none; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .topbar-user svg { width: 12px; height: 12px; color: var(--topbar-muted); }

  /* ============ Shell ============ */
  .app-shell { display: flex; height: calc(100vh - var(--topbar-h)); }

  /* ============ Sidebar（独立文件 sidebar.html，iframe 托管） ============ */
  .sidebar-frame {
    flex: 0 0 auto;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    border: 0;
    display: block;
    background: var(--sidebar);
    transition: width .2s ease, min-width .2s ease;
  }
  .app-shell[data-sidebar="collapsed"] .sidebar-frame {
    width: var(--sidebar-width-icon);
    min-width: var(--sidebar-width-icon);
  }

  /* ============ 顶部通栏：快捷菜单 ============ */
  .top-quick {
    display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    padding: 2px; background: #f4f6f9;
    border: 1px solid var(--topbar-border); border-radius: 6px;
  }
  .top-quick-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 10px; border: none; border-radius: 4px;
    background: transparent; color: #5b6270;
    font-size: 12.5px; font-weight: 500; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .top-quick-btn:hover { background: #ffffff; color: var(--primary); box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  .top-quick-btn:active { background: #f0f4ff; }
  .top-quick-btn svg { width: 14px; height: 14px; flex-shrink: 0; color: #7b8391; }
  .top-quick-btn:hover svg { color: var(--primary); }
  .top-quick-btn .tag-new {
    margin-left: 1px; font-size: 10px; line-height: 15px; font-weight: 600;
    color: #b25e00; background: #fff3e0; border-radius: 4px; padding: 0 4px;
  }
  @media (max-width: 1240px) { .top-quick-btn span:not(.tag-new) { display: none; } .top-quick-btn { padding: 0 8px; } }

  .sidebar-empty {
    display: none;
    padding: 20px 12px;
    text-align: center;
    font-size: 13.5px;
    color: #a6adba;
  }


  /* ============ Main ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background); }

  .main-header {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .sidebar-trigger {
    width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius);
    background: transparent; color: #6b7280; cursor: pointer;
  }
  .sidebar-trigger:hover { background: var(--accent); color: var(--accent-foreground); }
  .sidebar-trigger svg { width: 16px; height: 16px; }
  .header-separator { width: 1px; height: 15px; background: var(--border); flex-shrink: 0; }

  .breadcrumb {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted-foreground);
    min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .breadcrumb-current { color: var(--foreground); font-weight: 600; }

  .header-actions { margin-left: 8px; display: flex; align-items: center; gap: 6px; }
  .header-actions button {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--radius);
    background: #ffffff; color: #5b6270; font-size: 12.5px; cursor: pointer;
  }
  .header-actions button:hover { border-color: #cfd6e0; color: var(--accent-foreground); background: #fafbfc; }
  .header-actions svg { width: 14px; height: 14px; }

  /* ============ 顶部：身份类型切换（两个按钮） ============ */
  .role-switch {
    margin-left: auto; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px;
    background: #f4f6f9;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .role-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; padding: 0 13px;
    border: none; border-radius: 4px; background: transparent;
    color: #5b6270; font-size: 12.5px; font-weight: 500; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .role-btn:hover { color: var(--foreground); }
  .role-btn.active {
    background: #ffffff; color: var(--primary); font-weight: 600;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .10);
  }

  .content { flex: 1; display: flex; flex-direction: column; padding: 14px; min-height: 0; background: #fafbfc; }
  .content-body {
    flex: 1; min-height: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #ffffff;
    overflow: hidden;
    position: relative;
  }
  .content-frame { width: 100%; height: 100%; border: none; display: block; background: #ffffff; }

  .placeholder-view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #ffffff; color: var(--muted-foreground); text-align: center;
  }
  .placeholder-view svg { width: 52px; height: 52px; stroke-width: 1.2; color: #dfe3ea; }
  .placeholder-view h3 { font-size: 16px; font-weight: 600; color: var(--foreground); }
  .placeholder-view p { font-size: 13px; }

  .nav-toast {
    position: fixed; left: 50%; top: 72px; transform: translate(-50%, -8px);
    background: rgba(0, 0, 0, .78); color: #fff; font-size: 13px; line-height: 1.4;
    padding: 9px 16px; border-radius: 6px; max-width: 70vw;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 9999;
  }
  .nav-toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1400px) {
    .topbar-right { gap: 10px; }
    .topbar-search { max-width: 320px; }
  }
</style>
</head>
<body>

<!-- ============ 顶部通栏（白底，非蓝底） ============ -->
<div class="topbar">
  <div class="topbar-logo">
    <span class="logo-mark">采</span>
    <span class="logo-text">
      <span class="name">采招CRM系统</span>
    </span>
  </div>

  <div class="topbar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" placeholder="搜索线索 / 客户 / 企业名称" aria-label="全局搜索">

  <!-- 顶部通栏：快捷菜单 -->
  <div class="top-quick" id="topQuick" role="group" aria-label="快捷菜单">
    <button class="top-quick-btn" type="button" data-quick="我的客户库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>客户库</span>
    </button>
    <button class="top-quick-btn" type="button" data-quick="验重">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/><path d="m9 11 1.8 1.8L14.5 9"/></svg>
      <span>客户查重</span>
    </button>
    <button class="top-quick-btn" type="button" data-quick="捡新注册客户">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
      <span>新注册客户</span>

  </div>

  <div class="topbar-right">
    <button class="btn-primary" type="button" id="btnNewLead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建线索
    </button>

    <div class="topbar-icons">
      <button type="button" aria-label="待办">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button type="button" aria-label="通知">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button type="button" aria-label="帮助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </button>
    </div>

    <div class="topbar-sep"></div>

    <button class="topbar-user" type="button">
      <span class="ava">
        <img id="topbarAvatar" src="https://ui.shadcn.com/avatars/shadcn.jpg" alt="罗屿">
        <span class="ava-fb" id="topbarAvatarFb">罗</span>
      </span>
      罗屿
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>

</div>

<div class="app-shell">

  <!-- ============ Sidebar ============ -->
  <!-- 侧栏已拆分为独立文件 sidebar.html，通过 iframe 托管 -->
  <iframe class="sidebar-frame" id="sidebarFrame" src="sidebar.html" title="侧边栏"></iframe>

  <!-- ============ 主区域 ============ -->
  <main class="main">
    <header class="main-header">
      <button class="sidebar-trigger" id="sidebarTrigger" type="button" aria-label="切换侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="header-separator"></div>
      <nav class="breadcrumb" aria-label="面包屑">
        <span id="breadcrumbParent">线索管理</span>
        <span>/</span>
        <span class="breadcrumb-current" id="breadcrumbCurrent">线索列表</span>
      </nav>

      <!-- 身份类型切换：两个按钮 -->
      <div class="role-switch" id="roleSwitch" role="group" aria-label="身份切换">
        <button class="role-btn active" type="button" data-role="sales" aria-pressed="true">销售</button>
        <button class="role-btn" type="button" data-role="service" aria-pressed="false">客服</button>
      </div>

      <div class="header-actions">
        <button type="button" id="btnRefresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          刷新
        </button>
        <button type="button" id="btnFullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          全屏
        </button>
      </div>
    </header>

    <div class="content">
      <div class="content-body">
        <iframe id="contentFrame" class="content-frame" title="内容区"></iframe>
        <div class="placeholder-view" id="placeholderView" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>页面尚未生成</h3>
          <p>该模块页面正在设计中，敬请期待</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>


  /* ================= 内容区 / 路由 ================= */
  var iframe = document.getElementById('contentFrame');
  var placeholderView = document.getElementById('placeholderView');
  var breadcrumbParent = document.getElementById('breadcrumbParent');
  var breadcrumbCurrent = document.getElementById('breadcrumbCurrent');

  /* ================= 独立侧栏：sidebar.html（iframe 托管 + postMessage 联动） ================= */
  var sidebarFrame = document.getElementById('sidebarFrame');
  var appShell = document.querySelector('.app-shell');
  var lastNav = null;

  function postSidebar(msg) {
    if (!sidebarFrame || !sidebarFrame.contentWindow) return;
    msg.source = 'crm-main';
    try { sidebarFrame.contentWindow.postMessage(msg, '*'); } catch (err) { /* file:// 下忽略 */ }
  }

  function isSidebarCollapsed() {
    return appShell.getAttribute('data-sidebar') === 'collapsed';
  }

  // persist=false 时只改当前显示，不写入偏好（如进入工作台时的临时展开）
  function setSidebarCollapsed(on, persist) {
    if (on) appShell.setAttribute('data-sidebar', 'collapsed');
    else appShell.removeAttribute('data-sidebar');
    postSidebar({ type: 'collapsed', value: !!on });
    if (persist === false) return;
    try { localStorage.setItem('crm-sidebar-collapsed', on ? '1' : '0'); } catch (err) { /* 忽略 */ }
  }

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.source && d.source !== 'crm-sidebar') return;
    if (d.type === 'nav') {
      showPageData(d);
    } else if (d.type === 'collapsed') {
      setSidebarCollapsed(!!d.value);
    } else if (d.type === 'toast') {
      showToast(d.text || '');
    }
  });

  function buildLeadListDoc() {
    var rows = [
      ['L20261110001', '某市人民医院智慧医疗设备采购', '某市人民医院', '王院长', '138****6621', '招标公告', 'A', '待跟进', '张销售', '2026-11-10 09:20'],
      ['L20261110002', '省交投集团信息化平台建设项目', '省交通投资集团', '李经理', '139****3382', '中标结果', 'A', '已联系', '张销售', '2026-11-09 17:40'],
      ['L20261110003', '市政道路养护服务采购', '市城市管理局', '赵主任', '137****9904', '关键词订阅', 'B', '待跟进', '李顾问', '2026-11-09 14:05'],
      ['L20261110004', '高校实验室检测设备采购', '某某大学', '陈老师', '135****7712', '企业监控', 'B', '已报价', '张销售', '2026-11-08 10:32'],
      ['L20261110005', '园区物业管理服务外包', '某产业园管委会', '刘主管', '136****2048', '招标公告', 'C', '已转客户', '王经理', '2026-11-07 16:18'],
      ['L20261110006', '县级医院耗材集中采购', '某县中心医院', '周科长', '188****5566', '中标结果', 'A', '待跟进', '李顾问', '2026-11-07 09:10'],

    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>' +

      'table{width:100%;border-collapse:collapse;min-width:1320px}' +
      'th{position:sticky;top:0;background:#fafbfc;text-align:left;font-weight:600;font-size:12.5px;color:#5b6270;padding:9px 10px;border-bottom:1px solid #e8ebf0;white-space:nowrap}' +
      'td{padding:10px;border-bottom:1px solid #f0f2f5;color:#3d4350;white-space:nowrap}' +
      'tbody tr:hover{background:#fafcff}' +
      '.col-ck{width:36px}' +

      '.muted{color:#8a8f99;font-size:12.5px}' +

      '.pager .right{margin-left:auto;display:flex;align-items:center;gap:6px}' +

      '.pager .pg.active{background:#0063FF;border-color:#0063FF;color:#fff}' +
      '</style></head><body><div class="page">' +
      '<div class="tabs">' +
      '<div class="tab active">全部线索<span class="cnt">1,284</span></div>' +

      '<select><option>线索来源：全部</option><option>招标公告</option><option>中标结果</option><option>关键词订阅</option><option>企业监控</option><option>标讯推荐</option></select>' +
      '<select><option>意向等级：全部</option><option>A</option><option>B</option><option>C</option></select>' +
      '<select><option>负责人：全部</option><option>张销售</option><option>李顾问</option><option>王经理</option></select>' +
      '<input type="text" placeholder="最后跟进时间" style="width:150px">' +

      '<th>线索来源</th><th>意向等级</th><th>状态</th><th>负责人</th><th>最后跟进时间</th><th>操作</th>' +

      '</div></div></body></html>';
  }

  /* ================= 身份类型（工作台接入） ================= */
  var ROLES = {
    sales: {
      label: '销售身份',
      workbenchTitle: '销售工作台',
      workbenchSrc: '../销售首页/销售首页-工作台-版本7.html'
    },
    service: {
      label: '客服身份',
      workbenchTitle: '客服工作台',
      workbenchSrc: '../客服首页/客服工作台-4.0.html'
    }
  };
  var currentRole = 'sales';
  var currentPage = '';
  var currentItem = null;

  function loadWorkbench() {
    // 进入工作台时临时展开侧栏（不改写折叠偏好）
    if (isSidebarCollapsed()) setSidebarCollapsed(false, false);
    var role = ROLES[currentRole] || ROLES.sales;
    iframe.removeAttribute('srcdoc');
    iframe.src = encodeURI(role.workbenchSrc);
    iframe.style.display = 'block';
    placeholderView.style.display = 'none';
  }

  function showPageData(d) {
    var page = d.page || 'placeholder';
    var title = d.title || '';
    var parent = d.parent || title;
    currentPage = page;
    currentItem = d;
    lastNav = { key: d.key || '', page: page, title: title, parent: parent };
    breadcrumbParent.textContent = parent;
    breadcrumbCurrent.textContent = title;
    if (page === 'lead-list') {
      iframe.removeAttribute('src');
      iframe.srcdoc = buildLeadListDoc();
      iframe.style.display = 'block';
      placeholderView.style.display = 'none';
    } else if (page === 'workbench') {
      breadcrumbCurrent.textContent = (ROLES[currentRole] || ROLES.sales).workbenchTitle;
      loadWorkbench();
    } else {
      iframe.removeAttribute('src');
      iframe.removeAttribute('srcdoc');
      iframe.style.display = 'none';
      placeholderView.style.display = 'flex';
    }
    syncUrl(d.key || '');
  }

  /* ================= 侧栏折叠（顶栏按钮 → iframe 联动） ================= */
  document.getElementById('sidebarTrigger').addEventListener('click', function () {
    setSidebarCollapsed(!isSidebarCollapsed());
  });


  document.getElementById('btnRefresh').addEventListener('click', function () {
    if (lastNav) showPageData(lastNav);
    showToast('内容区已刷新');
  });

  document.getElementById('btnFullscreen').addEventListener('click', function () {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    } else {
      document.exitFullscreen();
    }
  });

  document.getElementById('btnNewLead').addEventListener('click', function () {
    showToast('新建线索面板待接入');
  });

  /* ================= 头像兜底 ================= */
  (function () {
    var avaImg = document.getElementById('topbarAvatar');
    var avaFb = document.getElementById('topbarAvatarFb');
    if (!avaImg || !avaFb) return;
    avaImg.addEventListener('error', function () {
      avaImg.style.display = 'none';
      avaFb.style.display = 'flex';
    });
    if (avaImg.complete && avaImg.naturalWidth === 0) {
      avaImg.style.display = 'none';
      avaFb.style.display = 'flex';
    }
  })();

  /* ================= 身份类型切换交互（两个按钮） ================= */
  (function () {
    var roleBtns = document.querySelectorAll('.role-btn');
    if (!roleBtns.length) return;

    function applyRole(role, silent) {
      if (!ROLES[role]) return;
      currentRole = role;
      Array.prototype.forEach.call(roleBtns, function (n) {
        var on = n.getAttribute('data-role') === role;
        n.classList.toggle('active', on);
        n.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      try { localStorage.setItem('crm-role', role); } catch (err) { /* file:// 下忽略 */ }
      if (currentPage === 'workbench') {
        breadcrumbCurrent.textContent = ROLES[role].workbenchTitle;
        loadWorkbench();
      }
      if (!silent) showToast('已切换为' + ROLES[role].label);
    }

    // 供快捷菜单等处调用
    window.__crmSetRole = applyRole;

    // 恢复上次身份
    var saved = '';
    try { saved = localStorage.getItem('crm-role') || ''; } catch (err) { saved = ''; }
    if (saved && ROLES[saved]) applyRole(saved, true);

    Array.prototype.forEach.call(roleBtns, function (n) {
      n.addEventListener('click', function () {
        applyRole(n.getAttribute('data-role'));
      });
    });
  })();

  /* ================= 顶部通栏：快捷菜单 ================= */
  (function () {
    var quick = document.getElementById('topQuick');
    if (!quick) return;

    // 轮询等待工作台 iframe 加载到当前身份对应页面，再触发其中的同名业务入口
    function clickInWorkbench(target) {
      var tries = 0;
      var expect = (ROLES[currentRole] || ROLES.sales).workbenchSrc.split('/').pop();
      (function attempt() {
        var doc = null, href = '';
        try {
          doc = iframe.contentDocument;
          href = decodeURIComponent(iframe.contentWindow.location.href);
        } catch (err) { doc = null; }
        if (doc && doc.readyState === 'complete' && href.indexOf(expect) !== -1 &&
            doc.querySelector('.subnav')) {
          var btn = doc.querySelector('[data-demo="' + target + '"]');
          if (btn) { btn.click(); return; }
        }
        if (++tries < 50) setTimeout(attempt, 200);
      })();
    }

    quick.addEventListener('click', function (e) {
      var btn = e.target.closest('.top-quick-btn');
      if (!btn) return;
      var target = btn.getAttribute('data-quick') || '';
      if (isSidebarCollapsed()) setSidebarCollapsed(false);

      // 快捷入口全部属于销售工作台，身份不符时先切回销售
      var needSwitch = currentRole !== 'sales';
      if (needSwitch && window.__crmSetRole) window.__crmSetRole('sales', true);
      if (currentPage !== 'workbench') {
        postSidebar({ type: 'navigate', key: 'workbench' });
      }

      clickInWorkbench(target);
      showToast('已打开工作台 · ' + btn.querySelector('span').textContent);
    });
  })();

  /* ================= 地址栏同步 ================= */
  function syncUrl(key) {
    if (!key) return;
    try {
      var u = new URL(location.href);
      if (u.searchParams.get('page') === key) return;
      u.searchParams.set('page', key);
      history.replaceState(null, '', u.toString());
    } catch (err) { /* file:// 下忽略 */ }
  }

  /* ================= 轻提示 ================= */
  var navToast = document.createElement('div');
  navToast.className = 'nav-toast';
  document.body.appendChild(navToast);
  var navToastTimer;
  function showToast(msg) {
    navToast.textContent = msg;
    navToast.classList.add('show');
    clearTimeout(navToastTimer);
    navToastTimer = setTimeout(function () { navToast.classList.remove('show'); }, 2000);
  }

  /* ================= 初始页：默认 线索管理 > 线索列表 ================= */
  (function initSidebar() {
    var initialKey = new URLSearchParams(location.search).get('page') || 'lead-list';
    var saved = '';
    try { saved = localStorage.getItem('crm-sidebar-collapsed') || ''; } catch (err) { /* 忽略 */ }
    var collapse = saved ? saved === '1' : (window.innerWidth < 1400);
    if (collapse) appShell.setAttribute('data-sidebar', 'collapsed');

    var initSent = false;
    function pushInit() {
      if (initSent) return;
      initSent = true;
      postSidebar({ type: 'collapsed', value: collapse });
      postSidebar({ type: 'init', key: initialKey });
    }
    if (sidebarFrame) {
      sidebarFrame.addEventListener('load', pushInit);
      setTimeout(pushInit, 400);   // 兜底：iframe 已被缓存、load 事件早于监听
    }
  })();
</script>
