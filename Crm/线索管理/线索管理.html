<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线索管理 - 采招CRM系统</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230063FF'/%3E%3Ctext%20x='32'%20y='45'%20text-anchor='middle'%20font-size='36'%20font-weight='700'%20fill='%23ffffff'%20font-family='Microsoft%20YaHei,sans-serif'%3E%E9%87%87%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background: #ffffff;
    --foreground: #262626;
    --border: #e8ebf0;
    --muted-foreground: #8a8f99;
    --accent: #f5f6f8;
    --accent-foreground: #262626;
    --primary: #0063FF;
    --primary-dark: #0052d9;
    --primary-light: #e8f0ff;
    --radius: 6px;

    --sidebar: #ffffff;
    --sidebar-foreground: #3d4350;
    --sidebar-accent: #f2f4f7;
    --sidebar-accent-foreground: #1a1f29;
    --sidebar-border: #e8ebf0;
    --sidebar-active: #e8f0ff;
    --sidebar-width: 16rem;
    --sidebar-width-icon: 3.4rem;

    --topbar-h: 56px;
    --topbar-bg: #ffffff;
    --topbar-fg: #262626;
    --topbar-muted: #8a8f99;
    --topbar-border: #e8ebf0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--background);
    color: var(--foreground);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  a { text-decoration: none; color: inherit; cursor: pointer; }
  button { font-family: inherit; }
  svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ============ 顶部通栏（白底 / 非蓝底） ============ */
  .topbar {
    height: var(--topbar-h);
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--topbar-border);
    display: flex;
    align-items: center;
    gap: 20px;
    padding-right: 20px;
    color: var(--topbar-fg);
    position: relative;
    z-index: 20;
  }
  .topbar-logo {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 16px;
    border-right: 1px solid var(--topbar-border);
    flex-shrink: 0;
    transition: width .2s ease, min-width .2s ease;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--primary);
    color: #ffffff; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; flex-shrink: 0; }
  .logo-text .name { font-size: 16px; font-weight: 700; letter-spacing: .5px; color: #1a1f29; }

  .topbar-search {
    flex: 1 1 auto;
    max-width: 420px;
    display: flex;
    align-items: center;
    height: 34px;
    background: #f4f6f9;
    border: 1px solid var(--topbar-border);
    border-radius: 6px;
    padding: 0 4px 0 10px;
    gap: 6px;
    color: var(--topbar-muted);
  }
  .topbar-search input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--foreground); font-size: 13px; font-family: inherit;
  }
  .topbar-search input::placeholder { color: #9aa0aa; }
  .topbar-search .kbd {
    font-size: 11px; color: #9aa0aa; border: 1px solid #dfe3ea;
    border-radius: 4px; padding: 0 5px; line-height: 18px; background: #ffffff;
  }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border: none; border-radius: 6px;
    background: var(--primary); color: #ffffff; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary svg { width: 14px; height: 14px; }

  .topbar-icons { display: flex; align-items: center; gap: 4px; }
  .topbar-icons button {
    position: relative;
    width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent;
    color: #6b7280; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .topbar-icons button:hover { background: var(--accent); color: var(--accent-foreground); }
  .topbar-icons .dot {
    position: absolute; top: 5px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%; background: #f04438;
    border: 1.5px solid #ffffff;
  }

  .topbar-sep { width: 1px; height: 20px; background: var(--topbar-border); }

  .topbar-user {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: none; color: var(--topbar-fg); font-size: 13px; cursor: pointer;
    padding: 0 2px;
  }
  .topbar-user .ava {
    position: relative;
    width: 28px; height: 28px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, #dbe7ff 0%, #9ec0ff 100%);
    color: #1a4fbf; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .topbar-user .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .topbar-user .ava .ava-fb { display: none; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .topbar-user svg { width: 12px; height: 12px; color: var(--topbar-muted); }

  /* ============ Shell ============ */
  .app-shell { display: flex; height: calc(100vh - var(--topbar-h)); }

  /* ============ Sidebar ============ */
  .sidebar {
    position: relative;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    transition: width .2s ease, min-width .2s ease;
  }
  .sidebar[data-state="collapsed"] { width: var(--sidebar-width-icon); min-width: var(--sidebar-width-icon); }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px;
    scrollbar-width: thin;
    scrollbar-color: #d8dce3 transparent;
  }
  .sidebar-content::-webkit-scrollbar { width: 6px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: #d8dce3; border-radius: 3px; }

  .sidebar-menu { display: flex; flex-direction: column; gap: 3px; }

  .sidebar-menu-button {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    min-height: 44px;
    padding: 0 10px;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--sidebar-foreground);
    font-size: 15px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-menu-button:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-button.active { color: var(--primary); font-weight: 600; }
  .sidebar-menu-button svg { width: 18px; height: 18px; flex-shrink: 0; color: #7b8391; }
  .sidebar-menu-button:hover svg,
  .sidebar-menu-button.active svg { color: var(--primary); }

  .sidebar-menu-button-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-menu-button-chevron {
    margin-left: auto;
    width: 15px; height: 15px; flex-shrink: 0;
    color: #a6adba;
    transition: transform .2s ease;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-button > .sidebar-menu-button-chevron { transform: rotate(180deg); }

  .sidebar-menu-sub {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 2.7rem;
    margin: 3px 0 8px;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-sub { display: flex; }

  .sidebar-menu-sub-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 38px;
    padding: 0 10px;
    border-radius: var(--radius);
    color: #5b6270;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-menu-sub-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-sub-item.active { background: var(--sidebar-active); color: var(--primary); font-weight: 600; }
  .sidebar-menu-sub-item.active::before {
    content: "";
    position: absolute;
    left: -2.7rem;
    top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
    background: var(--primary);
  }
  .sidebar-menu-sub-item .tag-new {
    margin-left: auto; font-size: 10.5px; line-height: 17px; font-weight: 600;
    color: #b25e00; background: #fff3e0; border-radius: 4px; padding: 0 5px;
  }

  /* ============ 侧栏顶部：菜单搜索 ============ */
  .sidebar-head {
    flex-shrink: 0;
    padding: 10px 10px 9px;
    border-bottom: 1px solid var(--sidebar-border);
  }
  .sidebar-search {
    display: flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 10px;
    background: #f4f6f9; border: 1px solid #e8ebf0; border-radius: 6px;
    color: #9aa0aa;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .sidebar-search:focus-within { background: #ffffff; border-color: #b9cffe; box-shadow: 0 0 0 2px rgba(0,99,255,.09); }
  .sidebar-search svg { width: 16px; height: 16px; }
  .sidebar-search input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--foreground); font-family: inherit;
  }
  .sidebar-search input::placeholder { color: #9aa0aa; }
  .sidebar-search .clear {
    display: none; border: none; background: transparent; color: #9aa0aa;
    cursor: pointer; padding: 0; font-size: 16px; line-height: 1;
  }
  .sidebar-search.has-value .clear { display: block; }
  .sidebar-search .clear:hover { color: #5b6270; }

  .sidebar-empty {
    display: none;
    padding: 20px 12px;
    text-align: center;
    font-size: 13.5px;
    color: #a6adba;
  }

  /* ============ 侧栏底部：设置 ============ */
  .sidebar-foot {
    flex-shrink: 0;
    padding: 8px 10px;
    border-top: 1px solid var(--sidebar-border);
    background: var(--sidebar);
  }
  .sidebar-foot-btn {
    display: flex; align-items: center; gap: 11px;
    width: 100%; min-height: 44px; padding: 0 10px;
    border: none; border-radius: var(--radius); background: transparent;
    color: var(--sidebar-foreground); font-size: 15px; font-weight: 500;
    text-align: left; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-foot-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-foot-btn.active { color: var(--primary); font-weight: 600; }
  .sidebar-foot-btn svg { width: 18px; height: 18px; flex-shrink: 0; color: #7b8391; }
  .sidebar-foot-btn:hover svg,
  .sidebar-foot-btn.active svg { color: var(--primary); }

  .sidebar-settings-wrap { position: relative; }
  .sidebar-settings-panel {
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 8px);
    padding: 6px;
    background: #ffffff;
    border: 1px solid var(--sidebar-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, .12), 0 2px 6px rgba(16, 24, 40, .06);
    z-index: 50;
  }
  .sidebar-settings-panel.open { display: block; }
  .sidebar-settings-title {
    padding: 6px 10px 8px;
    font-size: 12px;
    font-weight: 600;
    color: #98a0ad;
    letter-spacing: .04em;
  }
  .sidebar-settings-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 38px; padding: 0 10px;
    border: none; border-radius: 6px; background: transparent;
    color: var(--sidebar-foreground); font-size: 14px; font-family: inherit;
    text-align: left; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-settings-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-settings-item svg { width: 16px; height: 16px; flex-shrink: 0; color: #7b8391; }
  .sidebar-settings-item:hover svg { color: var(--primary); }
  .sidebar-settings-split { height: 1px; margin: 5px 6px; background: var(--sidebar-border); }

  /* 折叠态：只留图标 */
  .sidebar[data-state="collapsed"] .sidebar-head { display: none; }
  .sidebar[data-state="collapsed"] .sidebar-settings-panel { display: none !important; }
  .sidebar[data-state="collapsed"] .sidebar-menu-button { justify-content: center; padding: 0 8px; }
  .sidebar[data-state="collapsed"] .sidebar-menu-button-label,
  .sidebar[data-state="collapsed"] .sidebar-menu-button-chevron,
  .sidebar[data-state="collapsed"] .sidebar-menu-sub { display: none; }
  .sidebar[data-state="collapsed"] .sidebar-menu-sub-item,
  .sidebar[data-state="collapsed"] .sidebar-empty { display: none; }
  .sidebar[data-state="collapsed"] .sidebar-foot-btn { justify-content: center; padding: 0 8px; }
  .sidebar[data-state="collapsed"] .sidebar-foot-btn span { display: none; }

  /* ============ Main ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background); }

  .main-header {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .sidebar-trigger {
    width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius);
    background: transparent; color: #6b7280; cursor: pointer;
  }
  .sidebar-trigger:hover { background: var(--accent); color: var(--accent-foreground); }
  .sidebar-trigger svg { width: 16px; height: 16px; }
  .header-separator { width: 1px; height: 15px; background: var(--border); flex-shrink: 0; }

  .breadcrumb {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted-foreground);
    min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .breadcrumb-current { color: var(--foreground); font-weight: 600; }

  .header-actions { margin-left: 8px; display: flex; align-items: center; gap: 6px; }
  .header-actions button {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--radius);
    background: #ffffff; color: #5b6270; font-size: 12.5px; cursor: pointer;
  }
  .header-actions button:hover { border-color: #cfd6e0; color: var(--accent-foreground); background: #fafbfc; }
  .header-actions svg { width: 14px; height: 14px; }

  /* ============ 顶部：身份类型切换 ============ */
  .role-switch { position: relative; margin-left: auto; flex-shrink: 0; }
  .role-switch-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 9px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #ffffff; color: #3d4553;
    font-size: 12.5px; font-family: inherit; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .role-switch-btn:hover { border-color: #cfd6e0; background: #fafbfc; }
  .role-switch-btn svg { width: 13px; height: 13px; color: #98a0ad; transition: transform .2s ease; }
  .role-switch.open .role-switch-btn { border-color: #b9cffe; background: #f5f9ff; }
  .role-switch.open .role-switch-btn svg { transform: rotate(180deg); }
  .role-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }

  .role-switch-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px); left: 0;
    min-width: 168px; padding: 6px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, .12), 0 2px 6px rgba(16, 24, 40, .06);
    z-index: 80;
  }
  .role-switch.open .role-switch-panel { display: block; }
  .role-switch-title { padding: 5px 9px 7px; font-size: 11.5px; font-weight: 600; color: #98a0ad; letter-spacing: .04em; }
  .role-switch-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; height: 36px; padding: 0 9px;
    border: none; border-radius: 6px; background: transparent;
    color: #3d4553; font-size: 13px; font-family: inherit;
    text-align: left; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .role-switch-item:hover { background: var(--accent); }
  .role-switch-item svg { width: 15px; height: 15px; color: #7b8391; flex-shrink: 0; }
  .role-switch-item .role-item-text { flex: 1; }
  .role-switch-item .role-item-sub { display: block; font-size: 11px; color: #98a0ad; margin-top: 1px; }
  .role-switch-item .role-check { width: 14px; height: 14px; color: var(--primary); opacity: 0; }
  .role-switch-item.active { background: var(--sidebar-active); color: var(--primary); font-weight: 600; }
  .role-switch-item.active svg { color: var(--primary); }
  .role-switch-item.active .role-check { opacity: 1; }

  .content { flex: 1; display: flex; flex-direction: column; padding: 14px; min-height: 0; background: #fafbfc; }
  .content-body {
    flex: 1; min-height: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #ffffff;
    overflow: hidden;
    position: relative;
  }
  .content-frame { width: 100%; height: 100%; border: none; display: block; background: #ffffff; }

  .placeholder-view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #ffffff; color: var(--muted-foreground); text-align: center;
  }
  .placeholder-view svg { width: 52px; height: 52px; stroke-width: 1.2; color: #dfe3ea; }
  .placeholder-view h3 { font-size: 16px; font-weight: 600; color: var(--foreground); }
  .placeholder-view p { font-size: 13px; }

  .nav-toast {
    position: fixed; left: 50%; top: 72px; transform: translate(-50%, -8px);
    background: rgba(0, 0, 0, .78); color: #fff; font-size: 13px; line-height: 1.4;
    padding: 9px 16px; border-radius: 6px; max-width: 70vw;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 9999;
  }
  .nav-toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1400px) {
    .topbar-right { gap: 10px; }
    .topbar-search { max-width: 320px; }
  }
</style>
</head>
<body>

<!-- ============ 顶部通栏（白底，非蓝底） ============ -->
<div class="topbar">
  <div class="topbar-logo">
    <span class="logo-mark">采</span>
    <span class="logo-text">
      <span class="name">采招CRM系统</span>
    </span>
  </div>

  <div class="topbar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" placeholder="搜索线索 / 客户 / 企业名称" aria-label="全局搜索">
    <span class="kbd">Ctrl K</span>
  </div>

  <div class="topbar-right">
    <button class="btn-primary" type="button" id="btnNewLead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建线索
    </button>

    <div class="topbar-icons">
      <button type="button" aria-label="待办">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button type="button" aria-label="通知">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button type="button" aria-label="帮助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </button>
    </div>

    <div class="topbar-sep"></div>

    <button class="topbar-user" type="button">
      <span class="ava">
        <img id="topbarAvatar" src="https://ui.shadcn.com/avatars/shadcn.jpg" alt="罗屿">
        <span class="ava-fb" id="topbarAvatarFb">罗</span>
      </span>
      罗屿
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
</div>

<div class="app-shell">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar" data-state="expanded">

        '<td class="mono">' + r[0] + '</td>' +
        '<td class="strong">' + r[1] + '</td>' +
        '<td>' + r[2] + '</td>' +
        '<td>' + r[3] + '</td>' +
        '<td class="mono">' + r[4] + '</td>' +
        '<td>' + r[5] + '</td>' +
        '<td><span class="lv lv-' + r[6] + '">' + r[6] + '</span></td>' +
        '<td><span class="bd ' + (badge[r[7]] || 'bd-gray') + '">' + r[7] + '</span></td>' +
        '<td>' + r[8] + '</td>' +
        '<td class="muted">' + r[9] + '</td>' +
        '<td class="ops"><a>跟进</a><a>转客户</a><a>更多</a></td>' +
        '</tr>';
    }).join('');

    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>' +
      '*{margin:0;padding:0;box-sizing:border-box}' +
      'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#262626;background:#fff;-webkit-font-smoothing:antialiased}' +
      '.page{padding:14px;display:flex;flex-direction:column;gap:12px;height:100vh}' +
      '.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid #e8ebf0;padding-bottom:0}' +
      '.tab{height:34px;display:inline-flex;align-items:center;padding:0 12px;font-size:13px;color:#5b6270;cursor:pointer;border-bottom:2px solid transparent}' +
      '.tab.active{color:#0063FF;font-weight:600;border-bottom-color:#0063FF}' +
      '.tab .cnt{font-size:11px;color:#8a8f99;margin-left:4px}' +
      '.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fafbfc;border:1px solid #e8ebf0;border-radius:6px;padding:10px 12px}' +
      '.filters input[type=text],.filters select{height:30px;border:1px solid #dfe3ea;border-radius:6px;padding:0 8px;font-size:12.5px;color:#262626;background:#fff;outline:none;font-family:inherit}' +
      '.filters input[type=text]{width:190px}' +
      '.filters select{min-width:104px;color:#5b6270}' +
      '.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #dfe3ea;background:#fff;font-size:12.5px;color:#40474f;cursor:pointer;font-family:inherit}' +
      '.btn:hover{border-color:#c9d2de;background:#fafbfc}' +
      '.btn.primary{background:#0063FF;border-color:#0063FF;color:#fff}' +
      '.btn.primary:hover{background:#0052d9}' +
      '.toolbar{display:flex;align-items:center;gap:8px}' +
      '.toolbar .right{margin-left:auto;display:flex;gap:8px}' +
      '.table-wrap{border:1px solid #e8ebf0;border-radius:6px;overflow:auto;flex:1;min-height:0}' +
      'table{width:100%;border-collapse:collapse;min-width:1320px}' +
      'th{position:sticky;top:0;background:#fafbfc;text-align:left;font-weight:600;font-size:12.5px;color:#5b6270;padding:9px 10px;border-bottom:1px solid #e8ebf0;white-space:nowrap}' +
      'td{padding:10px;border-bottom:1px solid #f0f2f5;color:#3d4350;white-space:nowrap}' +
      'tbody tr:hover{background:#fafcff}' +
      '.col-ck{width:36px}' +
      '.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#6b7280}' +
      '.strong{font-weight:600;color:#1a1f29}' +
      '.muted{color:#8a8f99;font-size:12.5px}' +
      '.bd{display:inline-block;height:20px;line-height:20px;padding:0 8px;border-radius:10px;font-size:11.5px}' +
      '.bd-gray{background:#f2f4f7;color:#5b6270}.bd-blue{background:#e8f0ff;color:#0052d9}' +
      '.bd-orange{background:#fff3e0;color:#b25e00}.bd-green{background:#e7f7ef;color:#0b7a4b}' +
      '.bd-red{background:#fdeaea;color:#b3261e}' +
      '.lv{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-size:11.5px;font-weight:600}' +
      '.lv-A{background:#fdeaea;color:#b3261e}.lv-B{background:#fff3e0;color:#b25e00}.lv-C{background:#f2f4f7;color:#5b6270}' +
      '.ops a{color:#0063FF;cursor:pointer;margin-right:10px}' +
      '.ops a:last-child{color:#8a8f99;margin-right:0}' +
      '.pager{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#6b7280;padding-bottom:2px}' +
      '.pager .right{margin-left:auto;display:flex;align-items:center;gap:6px}' +
      '.pager .pg{min-width:28px;height:28px;line-height:26px;text-align:center;border:1px solid #dfe3ea;border-radius:6px;background:#fff;cursor:pointer;padding:0 6px}' +
      '.pager .pg.active{background:#0063FF;border-color:#0063FF;color:#fff}' +
      '</style></head><body><div class="page">' +
      '<div class="tabs">' +
      '<div class="tab active">全部线索<span class="cnt">1,284</span></div>' +
      '<div class="tab">我的线索<span class="cnt">86</span></div>' +
      '<div class="tab">待跟进<span class="cnt">32</span></div>' +
      '<div class="tab">已转客户<span class="cnt">19</span></div>' +
      '<div class="tab">已废弃<span class="cnt">7</span></div>' +
      '</div>' +
      '<div class="filters">' +
      '<input type="text" placeholder="线索名称 / 企业名称 / 联系人">' +
      '<select><option>线索状态：全部</option><option>待跟进</option><option>已联系</option><option>已报价</option><option>已转客户</option><option>已废弃</option></select>' +
      '<select><option>线索来源：全部</option><option>招标公告</option><option>中标结果</option><option>关键词订阅</option><option>企业监控</option><option>标讯推荐</option></select>' +
      '<select><option>意向等级：全部</option><option>A</option><option>B</option><option>C</option></select>' +
      '<select><option>负责人：全部</option><option>张销售</option><option>李顾问</option><option>王经理</option></select>' +
      '<input type="text" placeholder="最后跟进时间" style="width:150px">' +
      '<button class="btn primary">查询</button><button class="btn">重置</button>' +
      '</div>' +
      '<div class="toolbar">' +
      '<button class="btn primary">+ 新建线索</button>' +
      '<button class="btn">批量分配</button>' +
      '<button class="btn">导入线索</button>' +
      '<div class="right"><button class="btn">列设置</button><button class="btn">导出</button></div>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr>' +
      '<th class="col-ck"><input type="checkbox"></th><th>线索编号</th><th>线索名称</th><th>企业名称</th><th>联系人</th><th>手机号</th>' +
      '<th>线索来源</th><th>意向等级</th><th>状态</th><th>负责人</th><th>最后跟进时间</th><th>操作</th>' +
      '</tr></thead><tbody>' + trs + '</tbody></table></div>' +
      '<div class="pager"><span>共 1,284 条线索，已选 0 条</span>' +
      '<div class="right"><span>10 条/页</span><span class="pg">‹</span><span class="pg active">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">…</span><span class="pg">129</span><span class="pg">›</span></div>' +
      '</div></div></body></html>';
  }

  /* ================= 身份类型（工作台接入） ================= */
  var ROLES = {
    sales: {
      label: '销售身份',
      workbenchTitle: '销售工作台',
      workbenchSrc: '../销售首页/销售首页-工作台-版本6-兼容版1110.html'
    },
    service: {
      label: '客服身份',
      workbenchTitle: '客服工作台',
      workbenchSrc: '../客服首页/客服工作台-3.0-兼容版1110.html'
    }
  };
  var currentRole = 'sales';
  var currentPage = '';
  var currentItem = null;

  function loadWorkbench() {
    var role = ROLES[currentRole] || ROLES.sales;
    iframe.removeAttribute('srcdoc');
    iframe.src = encodeURI(role.workbenchSrc);
    iframe.style.display = 'block';
    placeholderView.style.display = 'none';
  }

  function showPage(item) {
    var page = item.getAttribute('data-page') || 'placeholder';
    var title = item.getAttribute('data-title') || '';
    var parent = item.getAttribute('data-parent') || title;
    currentPage = page;
    currentItem = item;
    breadcrumbParent.textContent = parent;
    breadcrumbCurrent.textContent = title;
    if (page === 'lead-list') {
      iframe.removeAttribute('src');
      iframe.srcdoc = buildLeadListDoc();
      iframe.style.display = 'block';
      placeholderView.style.display = 'none';
    } else if (page === 'workbench') {
      breadcrumbCurrent.textContent = (ROLES[currentRole] || ROLES.sales).workbenchTitle;
      loadWorkbench();
    } else {
      iframe.removeAttribute('src');
      iframe.removeAttribute('srcdoc');
      iframe.style.display = 'none';
      placeholderView.style.display = 'flex';
    }
    setActive(item);
    syncUrl(item.getAttribute('data-key') || '');
  }

  function setActive(el) {
    document.querySelectorAll('.sidebar-menu-button.active, .sidebar-menu-sub-item.active').forEach(function (n) { n.classList.remove('active'); });
    el.classList.add('active');
    if (el.classList.contains('sidebar-menu-sub-item')) {
      var wrapper = el.closest('.sidebar-group-item');
      if (wrapper) {
        var parentBtn = wrapper.querySelector(':scope > .sidebar-menu-button');
        if (parentBtn) parentBtn.classList.add('active');
      }
    }
  }

  /* ================= 侧栏交互 ================= */
  document.getElementById('sidebarMenu').addEventListener('click', function (e) {
    var sub = e.target.closest('.sidebar-menu-sub-item');
    if (sub) {
      e.preventDefault();
      if (sidebarEl.getAttribute('data-state') === 'collapsed') sidebarEl.setAttribute('data-state', 'expanded');
      if (searchInput.value) { searchInput.value = ''; applyMenuFilter(); }
      showPage(sub);
      return;
    }
    var btn = e.target.closest('.sidebar-menu-button');
    if (!btn) return;
    e.preventDefault();
    var wrapper = btn.closest('.sidebar-group-item');
    if (wrapper) {
      // 有子菜单的一级项：点击只做展开/收起，不切内容区
      if (sidebarEl.getAttribute('data-state') === 'collapsed') {
        sidebarEl.setAttribute('data-state', 'expanded');
        wrapper.setAttribute('data-state', 'open');
      } else {
        wrapper.setAttribute('data-state', wrapper.getAttribute('data-state') === 'open' ? 'closed' : 'open');
      }
      return;
    }
    if (sidebarEl.getAttribute('data-state') === 'collapsed') sidebarEl.setAttribute('data-state', 'expanded');
    showPage(btn);
  });

  document.getElementById('sidebarTrigger').addEventListener('click', function () {
    var collapsed = sidebarEl.getAttribute('data-state') === 'collapsed';
    sidebarEl.setAttribute('data-state', collapsed ? 'expanded' : 'collapsed');
    if (collapsed) closeSettings();
  });

  /* ================= 侧栏顶部：菜单搜索 ================= */
  var searchBox = document.getElementById('sidebarSearch');
  var searchInput = document.getElementById('menuSearchInput');
  var searchClear = document.getElementById('menuSearchClear');
  var emptyEl = document.getElementById('sidebarEmpty');
  var menuEl = document.getElementById('sidebarMenu');
  var openStateSaved = null;

  function snapshotOpenState() {
    openStateSaved = {};
    Array.prototype.forEach.call(menuEl.children, function (n) {
      if (n.classList.contains('sidebar-group-item')) {
        openStateSaved[n.getAttribute('data-idx')] = n.getAttribute('data-state');
      }
    });
  }

  function restoreOpenState() {
    if (!openStateSaved) return;
    Array.prototype.forEach.call(menuEl.children, function (n) {
      if (n.classList.contains('sidebar-group-item')) {
        n.setAttribute('data-state', openStateSaved[n.getAttribute('data-idx')] || 'closed');
      }
    });
    openStateSaved = null;
  }

  function applyMenuFilter() {
    var q = searchInput.value.trim().toLowerCase();
    searchBox.classList.toggle('has-value', !!q);
    var visible = 0;

    if (!q) {
      Array.prototype.forEach.call(menuEl.children, function (n) {
        n.style.display = '';
        Array.prototype.forEach.call(n.querySelectorAll('.sidebar-menu-sub-item'), function (s) { s.style.display = ''; });
      });
      emptyEl.style.display = 'none';
      restoreOpenState();
      return;
    }

    if (!openStateSaved) snapshotOpenState();

    Array.prototype.forEach.call(menuEl.children, function (n) {
      if (!n.classList.contains('sidebar-group-item')) {
        var hit = n.textContent.toLowerCase().indexOf(q) !== -1;
        n.style.display = hit ? '' : 'none';
        if (hit) visible++;
        return;
      }
      var labelEl = n.querySelector('.sidebar-menu-button-label');
      var titleHit = labelEl && labelEl.textContent.toLowerCase().indexOf(q) !== -1;
      var subHit = 0;
      Array.prototype.forEach.call(n.querySelectorAll('.sidebar-menu-sub-item'), function (s) {
        var h = titleHit || s.textContent.toLowerCase().indexOf(q) !== -1;
        s.style.display = h ? '' : 'none';
        if (h) subHit++;
      });
      var show = titleHit || subHit > 0;
      n.style.display = show ? '' : 'none';
      if (show) {
        visible++;
        n.setAttribute('data-state', 'open');
      }
    });

    emptyEl.style.display = visible ? 'none' : 'block';
  }

  searchInput.addEventListener('input', applyMenuFilter);
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    applyMenuFilter();
    searchInput.focus();
  });
  searchBox.addEventListener('click', function () { searchInput.focus(); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchInput.value = ''; applyMenuFilter(); searchInput.blur(); }
  });

  /* ================= 侧栏底部：设置 ================= */
  var settingsBtn = document.getElementById('btnSidebarSetting');
  var settingsPanel = document.getElementById('sidebarSettingsPanel');

  function closeSettings() {
    settingsPanel.classList.remove('open');
    settingsBtn.classList.remove('active');
  }

  settingsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (sidebarEl.getAttribute('data-state') === 'collapsed') {
      sidebarEl.setAttribute('data-state', 'expanded');
      settingsPanel.classList.add('open');
      settingsBtn.classList.add('active');
      return;
    }
    var open = settingsPanel.classList.contains('open');
    settingsPanel.classList.toggle('open', !open);
    settingsBtn.classList.toggle('active', !open);
  });

  settingsPanel.addEventListener('click', function (e) {
    var item = e.target.closest('.sidebar-settings-item');
    if (!item) return;
    e.stopPropagation();
    var name = item.textContent.trim();
    closeSettings();
    showToast(name + '（示例入口）');
  });

  document.addEventListener('click', function (e) {
    if (!settingsPanel.classList.contains('open')) return;
    if (e.target.closest('.sidebar-settings-wrap')) return;
    closeSettings();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSettings();
  });
  // 焦点进入内容区 iframe 时，同样收起设置面板
  window.addEventListener('blur', closeSettings);

  document.getElementById('btnRefresh').addEventListener('click', function () {
    var active = document.querySelector('.sidebar-menu-sub-item.active, .sidebar-menu-button.active');
    if (active) showPage(active);
    showToast('内容区已刷新');
  });

  document.getElementById('btnFullscreen').addEventListener('click', function () {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    } else {
      document.exitFullscreen();
    }
  });

  document.getElementById('btnNewLead').addEventListener('click', function () {
    showToast('新建线索面板待接入');
  });

  /* ================= 头像兜底 ================= */
  (function () {
    var avaImg = document.getElementById('topbarAvatar');
    var avaFb = document.getElementById('topbarAvatarFb');
    if (!avaImg || !avaFb) return;
    avaImg.addEventListener('error', function () {
      avaImg.style.display = 'none';
      avaFb.style.display = 'flex';
    });
    if (avaImg.complete && avaImg.naturalWidth === 0) {
      avaImg.style.display = 'none';
      avaFb.style.display = 'flex';
    }
  })();

  /* ================= 身份类型切换交互 ================= */
  (function () {
    var roleSwitch = document.getElementById('roleSwitch');
    var roleBtn = document.getElementById('roleSwitchBtn');
    var roleLabel = document.getElementById('roleSwitchLabel');
    var roleItems = document.querySelectorAll('.role-switch-item');
    if (!roleSwitch || !roleBtn) return;

    function applyRole(role, silent) {
      if (!ROLES[role]) return;
      currentRole = role;
      roleLabel.textContent = ROLES[role].label;
      roleItems.forEach(function (n) {
        n.classList.toggle('active', n.getAttribute('data-role') === role);
      });
      try { localStorage.setItem('crm-role', role); } catch (err) { /* file:// 下忽略 */ }
      if (currentPage === 'workbench') {
        breadcrumbCurrent.textContent = ROLES[role].workbenchTitle;
        loadWorkbench();
      }
      if (!silent) showToast('已切换为' + ROLES[role].label);
    }

    // 恢复上次身份
    var saved = '';
    try { saved = localStorage.getItem('crm-role') || ''; } catch (err) { saved = ''; }
    if (saved && ROLES[saved]) applyRole(saved, true);

    roleBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      roleSwitch.classList.toggle('open');
    });

    roleItems.forEach(function (n) {
      n.addEventListener('click', function (e) {
        e.stopPropagation();
        applyRole(n.getAttribute('data-role'));
        roleSwitch.classList.remove('open');
      });
    });

    document.addEventListener('click', function (e) {
      if (!roleSwitch.contains(e.target)) roleSwitch.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') roleSwitch.classList.remove('open');
    });
  })();

  /* ================= 地址栏同步 ================= */
  function syncUrl(key) {
    if (!key) return;
    try {
      var u = new URL(location.href);
      if (u.searchParams.get('page') === key) return;
      u.searchParams.set('page', key);
      history.replaceState(null, '', u.toString());
    } catch (err) { /* file:// 下忽略 */ }
  }

  /* ================= 轻提示 ================= */
  var navToast = document.createElement('div');
  navToast.className = 'nav-toast';
  document.body.appendChild(navToast);
  var navToastTimer;
  function showToast(msg) {
    navToast.textContent = msg;
    navToast.classList.add('show');
    clearTimeout(navToastTimer);
    navToastTimer = setTimeout(function () { navToast.classList.remove('show'); }, 2000);
  }

  /* ================= 初始页：默认 线索管理 > 线索列表 ================= */
  var initialKey = new URLSearchParams(location.search).get('page') || 'lead-list';
  var target = document.querySelector('.sidebar-menu [data-key="' + initialKey + '"]');
  if (!target) target = document.querySelector('.sidebar-menu [data-key="lead-list"]');
  if (target) {
    var wrap = target.closest('.sidebar-group-item');
    if (wrap) wrap.setAttribute('data-state', 'open');
    showPage(target);
  }
</script>
