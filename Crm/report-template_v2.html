<title>招投标分析报告</title>
<!-- ECharts 动态图表引擎（本地文件，离线可用） -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --primary:#1a3c6e;      /* 主色 深蓝 */
    --primary-2:#2b6cb0;    /* 次蓝 */
    --accent:#e8453c;       /* 强调 红 */
    --gold:#f0a500;
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#222a35;
    --text-2:#5a6b80;
    --line:#e4e9f2;
    --radius:14px;
    --shadow:0 4px 18px rgba(26,60,110,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    padding:12px;
  }
  .page{max-width:1080px;margin:0 auto}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:14px;
  }
  .card-title{
    font-size:17px;font-weight:700;color:var(--primary);
    display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;
  }
  .card-title::before{
    content:"";width:4px;height:18px;border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--primary-2));flex-shrink:0;
  }
  .sub-title{font-size:12.5px;color:var(--text-2);font-weight:400;margin-left:auto}

  /* ============ ECharts 容器 ============ */
  .echart{width:100%;height:320px}
  @media(max-width:520px){.echart{height:260px}}

  /* ============ 封面 ============ */
  .cover{
    background:linear-gradient(135deg,#16325c 0%,#1a3c6e 45%,#2b6cb0 100%);
    border-radius:var(--radius);color:#fff;padding:34px 24px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .cover::after{
    content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.06);
  }
  .cover::before{
    content:"";position:absolute;right:40px;bottom:-80px;width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.05);
  }
  .cover .en{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.65);text-transform:uppercase}
  .cover h1{font-size:26px;margin:6px 0 10px;font-weight:800;letter-spacing:1px}
  .cover .desc{font-size:13px;color:rgba(255,255,255,.8);max-width:640px}
  .cover .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .meta-item{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:6px 14px;font-size:13px;
  }
  .meta-item b{font-size:15px;margin-left:4px;color:#ffd76a}

  /* ============ 统计卡片 ============ */
  .stat-total{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(90deg,#fff5f4,#fff);border:1px solid #fbe0de;
    border-radius:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;
  }
  .stat-total .num{font-size:30px;font-weight:800;color:var(--accent);line-height:1.1}
  .stat-total .num small{font-size:13px;font-weight:400;color:var(--text-2);margin-left:6px}
  .stat-total .tip{font-size:13px;color:#c0392b}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat-box{
    background:linear-gradient(180deg,#f8fafd,#fff);border:1px solid var(--line);
    border-radius:10px;padding:12px;text-align:center;
  }
  .stat-box .label{font-size:12px;color:var(--text-2)}
  .stat-box .value{font-size:20px;font-weight:700;color:var(--primary);margin-top:4px}
  .stat-box .unit{font-size:11px;color:var(--text-2);margin-left:2px}

  /* ============ 表格 ============ */
  .table-box{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f2f6fc;color:var(--primary);font-weight:600;position:sticky;top:0}
  tr:nth-child(even) td{background:#fafcff}
  td .title-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .amount{color:var(--accent);font-weight:600}
  .table-tip{font-size:12px;color:var(--text-2);margin-top:8px}

  /* 地区占比 */
  .region-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:center}
  .region-table td:first-child{font-weight:600;color:var(--primary)}
  .ratio-cell{display:flex;align-items:center;gap:6px}
  .ratio-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--primary-2),var(--accent));flex:1;min-width:40px}
  @media(max-width:760px){.region-grid{grid-template-columns:1fr}}

  /* 引流区 */
  .cta{
    background:linear-gradient(160deg,#16325c,#1a3c6e 60%,#2b6cb0);
    border-radius:var(--radius);color:#fff;padding:28px 22px;margin-top:6px;
  }
  .cta h2{font-size:18px;margin-bottom:16px;text-align:center}
  .cta-ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
  .cta-way{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:16px;text-align:center;
  }
  .cta-way .step{
    width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a3c6e;
    font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;
  }
  .cta-way .qrcode{
    width:120px;height:120px;background:#fff;border-radius:8px;margin:8px auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .cta-way .qrcode img{width:100%;height:100%;object-fit:contain}
  .cta-way .qr-placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:#999;font-size:11px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/10px 10px;
  }
  .cta-way .desc{font-size:13px}
  .cta-way .url{font-size:12px;color:#ffd76a;word-break:break-all;margin-top:6px}
  .cta-services{
    background:rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:18px;
  }
  .cta-services .s-title{font-size:14px;font-weight:700;margin-bottom:10px}
  .cta-services .tags{display:flex;flex-wrap:wrap;gap:8px}
  .cta-services .tag{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    border-radius:20px;padding:5px 14px;font-size:12px;
  }
  .cta-slogan{text-align:center;font-size:14px;letter-spacing:1px;color:rgba(255,255,255,.85)}
  .cta-slogan b{color:var(--gold)}
  .footer-note{text-align:center;font-size:11px;color:var(--text-2);padding:10px 0 20px}

  @media(max-width:520px){
    body{padding:8px}
    .card{padding:14px}
    .cover{padding:24px 16px}
    .cover h1{font-size:21px}
    .stat-total .num{font-size:24px}
  }
</style>
</head>

const $ = s => document.querySelector(s);
const fmt = n => (n==null?"":Number(n).toLocaleString("zh-CN", {maximumFractionDigits:2}));
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---- 根据 key 解析图表配置 ---- */
function resolveChart(key){
  const D = REPORT_DATA;
  const map = {
    tenderTrend:     D.charts.tenderTrend,
    shareAnalysis:   D.charts.shareAnalysis,
    agencyAnalysis:  D.charts.agencyAnalysis,
    winTrend:        D.charts.winTrend,
    winShare:        D.charts.winShare,
    regionPie: {
      type: "pie",
      title: "地区分布占比",
      data: D.regionShare.data.map(d=>({ name:d.region, value:d.ratio }))
    },
    industry:   D.industryDistribution,
    ownerCount: D.topOwners.tenderCount,
    ownerBudget:D.topOwners.tenderBudget,
    winCount:   D.topWinners.winCount,
    winAmount:  D.topWinners.winAmount
  };
  return map[key];
}

/* ---- 构建 ECharts option ---- */
function buildOption(cfg){
  const lineC = cfg.theme==="red" ? "#e8453c" : "#2b6cb0";
  const pal   = cfg.theme==="red" ? ["#f08a4b","#e8453c"] : ["#2b6cb0","#1a3c6e"];
  const tooltip = {
    trigger: cfg.type==="hbar" ? "axis" : "axis",
    axisPointer: { type: cfg.type==="hbar" ? "shadow" : "line" },
    backgroundColor: "#fff", borderColor: "#dbe3f0",
    textStyle: { color: "#222a35", fontSize: 12 }
  };

  /* 折线图 */
  if (cfg.type === "line") {
    return {
      tooltip,
      grid: { left: 52, right: 22, top: 40, bottom: 30 },
      xAxis: {
        type: "category", boundaryGap: false, data: cfg.xAxis,
        axisLine: { lineStyle: { color: "#c9d8ee" } }, axisTick: { show: false },
        axisLabel: { color: "#5a6b80", fontSize: 10, interval: 0 }
      },
      yAxis: {
        type: "value", name: cfg.yAxis,
        nameTextStyle: { color: "#5a6b80", fontSize: 10 },
        axisLabel: { color: "#5a6b80", fontSize: 10 },
        splitLine: { lineStyle: { color: "#eef2f8" } }
      },
      series: [{
        name: cfg.title, type: "line", data: cfg.data, smooth: true,
        symbol: "circle", symbolSize: 7,
        lineStyle: { color: lineC, width: 3 },
        itemStyle: { color: "#fff", borderColor: lineC, borderWidth: 2 },
        areaStyle: {
          color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: lineC + "55" },
              { offset: 1, color: lineC + "05" }
            ] }
        }
      }]
    };
  }

  /* 垂直柱状图 */
  if (cfg.type === "bar") {
    return {
      tooltip,
      grid: { left: 52, right: 22, top: 40, bottom: 30 },
      xAxis: {
        type: "category", data: cfg.xAxis,
        axisLine: { lineStyle: { color: "#c9d8ee" } }, axisTick: { show: false },
        axisLabel: { color: "#5a6b80", fontSize: 10, interval: 0, rotate: cfg.xAxis.length > 8 ? 30 : 0 }
      },
      yAxis: {
        type: "value", name: cfg.yAxis,
        nameTextStyle: { color: "#5a6b80", fontSize: 10 },
        axisLabel: { color: "#5a6b80", fontSize: 10 },
        splitLine: { lineStyle: { color: "#eef2f8" } }
      },
      series: [{
        type: "bar", data: cfg.data, barMaxWidth: 36,
        itemStyle: {
          color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: pal[0] },
              { offset: 1, color: pal[1] }
            ] },
          borderRadius: [6, 6, 0, 0]
        }
      }]
    };
  }

  /* 横向条形图 */
  if (cfg.type === "hbar") {
    const names = cfg.data.map(d=>d.name).reverse();
    const vals  = cfg.data.map(d=>d.value).reverse();
    return {
      tooltip: {
        trigger: "axis", axisPointer: { type: "shadow" },
        backgroundColor: "#fff", borderColor: "#dbe3f0",
        textStyle: { color: "#222a35", fontSize: 12 },
        formatter: p => p[0].name + "：<b>" + fmt(p[0].value) + (cfg.unit ? " " + cfg.unit : "") + "</b>"
      },
      grid: { left: 8, right: 78, top: 8, bottom: 8, containLabel: true },
      xAxis: { type: "value", show: false },
      yAxis: {
        type: "category", data: names,
        axisLine: { show: false }, axisTick: { show: false },
        axisLabel: { color: "#222a35", fontSize: 11, width: 150, overflow: "truncate" }
      },
      series: [{
        type: "bar", data: vals, barWidth: 14,
        itemStyle: {
          color: { type: "linear", x: 0, y: 0, x2: 1, y2: 0,
            colorStops: [
              { offset: 0, color: pal[0] },
              { offset: 1, color: pal[1] }
            ] },
          borderRadius: [0, 7, 7, 0]
        },
        label: {
          show: true, position: "right", color: "#222a35", fontSize: 11,
          formatter: p => fmt(p.value) + (cfg.unit ? " " + cfg.unit : "")
        }
      }]
    };
  }

  /* 环形图 */
  if (cfg.type === "pie") {
    return {
      tooltip: { trigger: "item", formatter: "{b}: {c}%", backgroundColor: "#fff", borderColor: "#dbe3f0", textStyle: { color: "#222a35", fontSize: 12 } },
      legend: { bottom: 0, icon: "circle", itemWidth: 8, itemHeight: 8, textStyle: { color: "#5a6b80", fontSize: 11 } },
      series: [{
        type: "pie", radius: ["42%", "68%"], center: ["50%", "44%"],
        data: cfg.data,
        label: { color: "#5a6b80", fontSize: 11, formatter: "{b} {c}%" },
        itemStyle: { borderColor: "#fff", borderWidth: 2 },
        color: ["#1a3c6e", "#2b6cb0", "#e8453c", "#f0a500", "#27ae60", "#8e44ad"]
      }]
    };
  }
  return {};
}

/* ---- 页面组装 ---- */

  const chartCard = (key, title, unit) => `

      <div class="echart" data-chart="${key}"></div>
    </div>`;

  const html = `
  <!-- 封面 -->
  <div class="cover">
    <div class="en">${esc(D.report.enTitle)}</div>
    <h1>${esc(D.report.title)}</h1>
    <div class="desc">${esc(D.report.desc)}</div>
    <div class="meta">
      <div class="meta-item">分析周期<b>${esc(D.report.period)}</b></div>
      <div class="meta-item">关键词<b>${esc(D.report.keyword)}</b></div>
      <div class="meta-item">区域<b>${esc(D.report.region)}</b></div>
      <div class="meta-item">生成日期<b>${esc(D.report.generateDate)}</b></div>
    </div>
  </div>

  <!-- 市场概况 -->
  <div class="card">
    <div class="card-title">市场概况</div>
    <div class="stat-total">
      <div><div style="font-size:12px;color:var(--text-2)">${esc(D.marketOverview.totalLabel)}</div>
      <div class="num">${fmt(D.marketOverview.totalInfo)}<small>条</small></div></div>
      <div class="tip">⚠ ${esc(D.marketOverview.tip)}</div>
    </div>
    <div class="stat-grid">
      ${D.marketOverview.infoTypes.map(t=>`
        <div class="stat-box"><div class="label">${esc(t.label)}</div><div class="value">${fmt(t.value)}</div></div>
      `).join("")}
    </div>
    <div style="height:10px"></div>
    <div class="stat-grid">
      ${D.marketOverview.metrics.map(m=>`
        <div class="stat-box"><div class="label">${esc(m.label)}</div><div class="value">${fmt(m.value)}<span class="unit">${esc(m.unit)}</span></div></div>
      `).join("")}
    </div>
  </div>

  <!-- 招标趋势 & 份额分析 -->
  ${chartCard("tenderTrend", C.tenderTrend.title, C.tenderTrend.yAxis)}
  ${chartCard("shareAnalysis", C.shareAnalysis.title, C.shareAnalysis.yAxis)}

  <!-- 市场份额-全国/地区 -->
  <div class="card">
    <div class="card-title">${esc(D.regionShare.title)}<span class="sub-title">${esc(D.regionShare.note)}</span></div>
    <div class="region-grid">
      <div class="table-box" style="min-width:0">
        <table style="min-width:0">
          <thead><tr>${D.regionShare.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
          <tbody>
            ${D.regionShare.data.map(r=>`<tr>
              <td>${esc(r.region)}</td>
              <td>${fmt(r.count)}</td>
              <td><div class="ratio-cell"><div class="ratio-bar" style="width:${r.ratio*2.4}px"></div>${r.ratio}%</div></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="echart" data-chart="regionPie" style="height:280px"></div>
    </div>
  </div>

  <!-- 行业分布 -->
  ${chartCard("industry", D.industryDistribution.title, D.industryDistribution.unit)}

  <!-- TOP 业主单位 -->
  ${chartCard("ownerCount", D.topOwners.tenderCount.title, D.topOwners.tenderCount.unit)}
  ${chartCard("ownerBudget", D.topOwners.tenderBudget.title, D.topOwners.tenderBudget.unit)}

  <!-- 招标代理机构 -->
  ${chartCard("agencyAnalysis", C.agencyAnalysis.title, C.agencyAnalysis.unit)}

  <!-- 招标数据列表 -->
  <div class="card">
    <div class="card-title">${esc(D.tenderList.title)}
      <span class="sub-title">共计 <b style="color:var(--accent)">${fmt(D.tenderList.total)}</b> 条，${esc(D.tenderList.tip)}</span>
    </div>
    <div class="table-box">
      <table>
        <thead><tr>${D.tenderList.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${D.tenderList.data.map(r=>`<tr>
            <td>${esc(r.time)}</td>
            <td>${esc(r.region)}</td>
            <td><span class="title-cell" title="${esc(r.title)}">${esc(r.title)}</span></td>
            <td>${esc(r.company)}</td>
            <td class="amount">${fmt(r.amount)} 元</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="table-tip">※ 数据来源：采招网（bidcenter.com.cn），仅供参考</div>
  </div>

  <!-- 中标趋势 & 份额 -->
  ${chartCard("winTrend", C.winTrend.title, C.winTrend.yAxis)}
  ${chartCard("winShare", C.winShare.title, C.winShare.yAxis)}

  <!-- TOP 中标单位 -->
  ${chartCard("winCount", D.topWinners.winCount.title, D.topWinners.winCount.unit)}
  ${chartCard("winAmount", D.topWinners.winAmount.title, D.topWinners.winAmount.unit)}

  <!-- 引流区 -->
  <div class="cta">
    <h2>${esc(D.cta.title)}</h2>
    <div class="cta-ways">
      ${D.cta.methods.map(m=>`
        <div class="cta-way">
          <div class="step">${esc(m.step)}</div>
          <div class="desc">${esc(m.label)}</div>
          ${m.qr
            ? `<div class="qrcode"><img src="${esc(m.qr)}" alt="二维码"></div>`
            : `<div class="qrcode"><div class="qr-placeholder">二维码占位<br>替换 qr 字段</div></div>`}
          ${m.desc?`<div class="desc" style="color:rgba(255,255,255,.75);font-size:12px">${esc(m.desc)}</div>`:""}
          ${m.url?`<div class="url">${esc(m.url)}</div>`:""}
        </div>`).join("")}
    </div>
    <div class="cta-services">
      <div class="s-title">${esc(D.cta.services.title)}</div>
      <div class="tags">
        ${D.cta.services.items.map(i=>`<span class="tag">${esc(i)}</span>`).join("")}
      </div>
    </div>
    <div class="cta-slogan"><b>${esc(D.cta.sloganHighlight)}</b>${esc(D.cta.slogan.replace(D.cta.sloganHighlight,""))}</div>
  </div>

  <div class="footer-note">本报告由采招网数据服务生成 · 数据仅供参考 · 最终解释权归平台所有</div>
  `;

  $("#app").innerHTML = html;
}

/* ---- ECharts 初始化绑定 ---- */
const _charts = [];
function initCharts(){
  document.querySelectorAll("[data-chart]").forEach(el=>{
    const cfg = resolveChart(el.getAttribute("data-chart"));
    if(!cfg) return;
    const inst = echarts.init(el);
    inst.setOption(buildOption(cfg));
    _charts.push(inst);
  });
  window.addEventListener("resize", ()=>{ _charts.forEach(c=>c.resize()); });
}

render();
initCharts();
</script>
</body>
</html>
