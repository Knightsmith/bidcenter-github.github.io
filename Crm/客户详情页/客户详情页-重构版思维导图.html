<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户详情页 · 重构版思维导图（公司 × 个体）</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --bd:#e3e8ef; --tx:#1a1f29; --mut:#667085;
    --ln:#d4dae3; --primary:#2563eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}

  /* ---------- 顶栏 ---------- */
  .hd{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hd h1{font-size:17px;font-weight:700}
  .hd .sub{font-size:12px;color:var(--mut)}
  .hd .sp{flex:1}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tools button{height:30px;padding:0 12px;border:1px solid var(--bd);background:#fff;border-radius:7px;font-size:13px;color:#3f4756;cursor:pointer;font-family:inherit}
  .tools button:hover{border-color:#cfe0ff;color:var(--primary);background:#f7faff}
  .tools button.on{border-color:var(--primary);color:var(--primary);background:#eff4ff}
  .search{position:relative}
  .search input{height:30px;width:220px;padding:0 10px 0 30px;border:1px solid var(--bd);border-radius:7px;font-size:13px;font-family:inherit;outline:none}
  .search input:focus{border-color:var(--primary)}
  .search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:#98a2b3}
  .stat{font-size:12px;color:var(--mut);white-space:nowrap}

  /* ---------- 分支导航 ---------- */
  .nav{flex-shrink:0;display:flex;gap:6px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--bd);overflow-x:auto}
  .nav button{flex-shrink:0;height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-size:12px;color:#3f4756;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .nav button i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .nav button:hover{border-color:#cfe0ff;background:#f7faff}

  /* ---------- 画布 ---------- */
  .canvas{flex:1;overflow:auto;padding:26px 30px 60px}
  .mm{display:inline-block;min-width:100%}
  .mm ul{list-style:none;margin:0;padding:0 0 0 26px}
  .mm li{position:relative;padding:3px 0 3px 22px}
  .mm li::before{content:"";position:absolute;left:0;top:0;height:100%;border-left:2px solid var(--ln)}
  .mm li::after{content:"";position:absolute;left:0;top:18px;width:22px;border-top:2px solid var(--ln)}
  .mm li:last-child::before{height:20px}
  .mm li.root{padding-left:0}
  .mm li.root::before,.mm li.root::after{display:none}
  .mm li.collapsed>ul{display:none}

  /* ---------- 节点 ---------- */
  .nd{display:inline-flex;align-items:flex-start;gap:7px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--bc,#98a2b3);border-radius:8px;padding:5px 10px;cursor:default;max-width:640px;transition:box-shadow .15s,border-color .15s}
  .nd.has-k{cursor:pointer}
  .nd.has-k:hover{border-color:var(--bc);box-shadow:0 1px 6px rgba(16,24,40,.08)}
  .tw{flex-shrink:0;width:17px;height:17px;margin-top:1px;border-radius:50%;border:1.5px solid var(--bc,#98a2b3);background:#fff;color:var(--bc,#98a2b3);font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0}
  .tw:hover{background:var(--bc);color:#fff}
  .lb{font-size:13.5px;line-height:1.5;font-weight:500;word-break:break-all}
  .nt{font-size:12px;color:var(--mut);line-height:1.5;font-weight:400}
  .nt::before{content:"·";margin:0 5px;color:#c3cad4}
  .bdg{flex-shrink:0;font-size:11px;font-weight:600;color:var(--bc);background:color-mix(in srgb,var(--bc) 10%,#fff);border-radius:999px;padding:1px 7px;margin-top:2px;white-space:nowrap}
  .bdg.new{color:#0e8074;background:#e6f4f1}
  .cnt{flex-shrink:0;font-size:11px;color:#98a2b3;background:#f0f2f5;border-radius:999px;padding:1px 7px;margin-top:2px;display:none}
  li.collapsed>.nd .cnt{display:inline-block}

  /* 根节点 */
  li.root>.nd{background:#111827;border:none;border-radius:12px;padding:12px 18px;max-width:none}
  li.root>.nd .lb{color:#fff;font-size:17px;font-weight:700}
  li.root>.nd .nt{color:#9ca3af}
  li.root>.nd .nt::before{color:#4b5563}
  li.root>.nd .tw{border-color:#fff;color:#fff;background:transparent}
  li.root>.nd .tw:hover{background:#fff;color:#111827}

  /* 一级分支 */
  li.d1>.nd{background:color-mix(in srgb,var(--bc) 8%,#fff);border-color:color-mix(in srgb,var(--bc) 30%,#fff);border-left-width:4px}
  li.d1>.nd .lb{font-size:14.5px;font-weight:700;color:color-mix(in srgb,var(--bc) 80%,#111)}

  /* 搜索状态 */
  li.dim>.nd{opacity:.32}
  li.hit>.nd{border-color:var(--bc);box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 35%,#fff)}
  li.hit>.nd .lb{color:var(--bc)}
  li.flash>.nd{animation:flash 1.2s ease}
  @keyframes flash{0%,60%{box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 45%,#fff)}100%{box-shadow:none}}

  .ft{flex-shrink:0;padding:7px 20px;background:var(--panel);border-top:1px solid var(--bd);font-size:12px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>

      <input id="kw" type="text" placeholder="搜索节点，如：轨迹 / 商机 / 个体">

/* ================= 渲染与交互 ================= */
var PALETTE=["#7c3aed","#2563eb","#0e8074","#d97706","#dc2626","#db2777","#0891b2","#65a30d","#4f46e5","#b45309","#0f766e","#be123c","#6d28d9"];
var total=0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function build(node,depth,color){
  var li=document.createElement("li");
  li.className=depth===0?"root":"d"+depth;
  li.dataset.depth=depth;
  if(color)li.style.setProperty("--bc",color);
  var kids=node.c&&node.c.length;
  var nd=document.createElement("div");
  nd.className="nd"+(kids?" has-k":"");
  var html="";
  if(kids)html+='<button class="tw" type="button" aria-label="折叠展开">−</button>';
  html+='<span class="lb">'+esc(node.t)+'</span>';
  if(node.n)html+='<span class="nt">'+esc(node.n)+'</span>';
  if(node.b)html+='<span class="bdg'+(node.b==="新增"||node.b==="增强"?" new":"")+'">'+esc(node.b)+'</span>';
  if(kids)html+='<span class="cnt">'+node.c.length+'</span>';
  nd.innerHTML=html;
  li.appendChild(nd);
  total++;
  if(kids){
    var ul=document.createElement("ul");
    node.c.forEach(function(k,i){
      var c=depth===0?PALETTE[i%PALETTE.length]:color;
      ul.appendChild(build(k,depth+1,c));
    });
    li.appendChild(ul);
    if(depth>=3)li.classList.add("collapsed");
    nd.addEventListener("click",function(e){
      if(e.target.closest(".tw")||e.currentTarget===nd||e.target.closest(".lb")||e.target.closest(".nt")){
        toggle(li);
      }
    });
  }
  return li;
}
function toggle(li){
  var col=li.classList.toggle("collapsed");
  var tw=li.querySelector(":scope>.nd .tw");
  if(tw)tw.textContent=col?"+":"−";
}
function expandTo(n){
  document.querySelectorAll(".mm li").forEach(function(li){
    if(!li.querySelector(":scope>ul"))return;
    var d=+li.dataset.depth;
    var col=d>=n;
    li.classList.toggle("collapsed",col);
    var tw=li.querySelector(":scope>.nd .tw");
    if(tw)tw.textContent=col?"+":"−";
  });
}
var rootUl=document.createElement("ul");
rootUl.appendChild(build(DATA,0,null));
document.getElementById("mm").appendChild(rootUl);
document.getElementById("stat").textContent="共 "+total+" 个节点";

/* 分支导航 */
var nav=document.getElementById("nav");
DATA.c.forEach(function(b,i){
  var btn=document.createElement("button");
  btn.innerHTML='<i style="background:'+PALETTE[i%PALETTE.length]+'"></i>'+esc(b.t);
  btn.addEventListener("click",function(){
    var li=document.querySelectorAll(".mm>ul>li>ul>li")[i];
    if(!li)return;
    var p=li.parentElement.closest("li");
    while(p){p.classList.remove("collapsed");var tw=p.querySelector(":scope>.nd .tw");if(tw)tw.textContent="−";p=p.parentElement.closest("li");}
    li.scrollIntoView({behavior:"smooth",block:"center",inline:"start"});
    li.classList.remove("flash");void li.offsetWidth;li.classList.add("flash");
  });
  nav.appendChild(btn);
});

/* 层级按钮 */
document.querySelectorAll(".tools button[data-lv]").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".tools button[data-lv]").forEach(function(b){b.classList.remove("on");});
    btn.classList.add("on");
    expandTo(+btn.dataset.lv);
  });
});

/* 搜索 */
var kw=document.getElementById("kw");
kw.addEventListener("input",function(){
  var q=kw.value.trim().toLowerCase();
  var lis=document.querySelectorAll(".mm li");
  lis.forEach(function(li){li.classList.remove("hit","dim","path");});
  if(!q)return;
  lis.forEach(function(li){
    var nd=li.querySelector(":scope>.nd");
    var txt=(nd.querySelector(".lb").textContent+" "+(nd.querySelector(".nt")?nd.querySelector(".nt").textContent:"")+" "+(nd.querySelector(".bdg")?nd.querySelector(".bdg").textContent:"")).toLowerCase();
    if(txt.indexOf(q)>=0){
      li.classList.add("hit");
      var p=li.parentElement.closest("li");
      while(p){p.classList.add("path");p.classList.remove("collapsed");var tw=p.querySelector(":scope>.nd .tw");if(tw)tw.textContent="−";p=p.parentElement.closest("li");}
    }
  });
  lis.forEach(function(li){if(!li.classList.contains("hit")&&!li.classList.contains("path"))li.classList.add("dim");});
  var first=document.querySelector(".mm li.hit");
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
});
</script>
</body>
</html>
