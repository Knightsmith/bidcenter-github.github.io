/* ===== 逾期规则 ===== */
function remindDate(t) { return t.remind.slice(0, 10); }
function remindHour(t) { return parseInt(t.remind.slice(11, 13), 10); }
function isAfter18(t) { return remindHour(t) >= 18; }
function overdueDeadline(t) {
  if (isAfter18(t)) return null;
  var p = remindDate(t).split('-');
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + 1, 0, 0, 0);
}
function effStatus(t) {
  if (t.status !== '待处理') return t.status;
  var dl = overdueDeadline(t);
  if (dl && NOW.getTime() >= dl.getTime()) return '已逾期';
  return '待处理';
}
function isUnfinished(t) { return effStatus(t) !== '已处理'; }

/* ===== 通用工具 ===== */
function customerById(id) { for (var i = 0; i < CUSTOMERS.length; i++) { if (CUSTOMERS[i].id === id) return CUSTOMERS[i]; } return null; }
function ownerOfCustomer(id) { var c = customerById(id); return c ? c.owner : ''; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ===== 详情项渲染 ===== */
function briefItem(k, v, full, raw) {
  return '<span class="muted">' + k + '</span><span' + (full ? ' style="grid-column:2;"' : '') + '>' + (raw ? v : esc(v)) + '</span>';
}

/* ===== 查看处理详情 ===== */
function showResultDetail(taskId) {
  var t = TASKS.filter(function (x) { return x.id === taskId; })[0];
  if (!t) return;
  var c = customerById(t.customerId);
  var m = TYPE_META[t.type];
  var phone = contactPhone(t.customerId, t.relatedContact);
  var contactDisplay = t.relatedContact + (phone ? ' ' + phone : '');
  var actualPhone = t.actualContact ? contactPhone(t.customerId, t.actualContact) : '';
  var actualDisplay = t.actualContact ? t.actualContact + (actualPhone ? ' ' + actualPhone : '') : '-';
  var memberBadge = '';
  if (c.memberType === '高级会员') memberBadge = ' ' + badgeHtml('高级', 'subtle');
  else if (c.memberType === '标准会员') memberBadge = ' ' + badgeHtml('标准', 'subtle-secondary');
  else memberBadge = ' ' + badgeHtml('免费', 'subtle-outline');
  var html = '<div style="display:grid;grid-template-columns:6rem 1fr;gap:0.5rem 1rem;">' +
    briefItem('客户名称', c.name) +
    briefItem('账号名称', (c.accountName || '-') + memberBadge, false, true) +
    briefItem('任务类型', m.category + ' · ' + t.type) +
    briefItem('提醒时间', t.remind) +
    briefItem('相关联系人', contactDisplay) +
    briefItem('实际联系人', actualDisplay) +
    briefItem('任务状态', effStatus(t)) +
    briefItem('处理结果', t.result || '-') +
    briefItem('下次联系', t.contactTime || '-') +
    briefItem('关闭时间', t.closedAt || '-') +
    briefItem('备注', t.remark || '-') +
    briefItem('任务说明', t.desc, true) +
  '</div>';
  document.getElementById('resultDetailContent').innerHTML = html;
  document.getElementById('resultDetailDialog').showModal();
}

/* ===== 联系人电话查询 ===== */
function contactPhone(customerId, contactName) {
  var c = customerById(customerId);
  if (!c || !c.contacts) return '';
  for (var i = 0; i < c.contacts.length; i++) {
    if (c.contacts[i].name === contactName) return c.contacts[i].phone;
  }
  return '';
}

/* ===== Badge 语义映射 ===== */
var BADGE_VARIANTS = { 'default': 1, 'secondary': 1, 'outline': 1, 'primary': 1, 'destructive': 1 };
var STATUS_VARIANT = { '待处理': 'secondary', '待跟进': 'outline', '已逾期': 'default' };
var PRIORITY_VARIANT = { '高': 'destructive', '中': 'primary', '低': 'secondary' };

function badgeHtml(text, variant) {
  var v = BADGE_VARIANTS[variant] ? variant : 'outline';
  return '<span class="badge" data-variant="' + v + '">' + esc(text) + '</span>';
}
function statusBadge(s) { return badgeHtml(s, STATUS_VARIANT[s]); }
function typeCell(t) {
  var m = TYPE_META[t.type];
  return badgeHtml(t.type, PRIORITY_VARIANT[m.priority]);
}
function remindCell(t) {
  var html = '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:0.25rem;">' +
               '<span>' + esc(t.remind) + '</span>';
  if (isAfter18(t)) html += '<span class="muted">18:00后发起</span>';
  return html + '</div>';
}

  return TASKS.filter(function (t) {
    /* 已处理任务不显示 */
    if (effStatus(t) === '已处理') return false;
    var m = TYPE_META[t.type];
    var owner = ownerOfCustomer(t.customerId);
    if (f.owner && owner !== f.owner) return false;
    if (f.category && m.category !== f.category) return false;
    if (f.status && effStatus(t) !== f.status) return false;
    return true;
  });
}

/* ===== 按负责人分组 ===== */
function groupByOwner(list) {
  var groups = {};
  list.forEach(function (t) {
    var owner = ownerOfCustomer(t.customerId);
    if (!owner) return;
    if (!groups[owner]) groups[owner] = [];
    groups[owner].push(t);
  });
  /* 排序：按负责人名排序 */
  var keys = Object.keys(groups).sort();
  var result = [];
  keys.forEach(function (k) {
    result.push({ owner: k, tasks: groups[k].slice().sort(function (a, b) { return a.remind < b.remind ? -1 : 1; }) });
  });
  return result;
}

/* ===== 统计卡渲染 ===== */
function renderStats(baseTasks) {
  var counts = { total: baseTasks.length, '待处理': 0, '待跟进': 0, '已逾期': 0 };
  baseTasks.forEach(function (t) { var s = effStatus(t); if (counts[s] !== undefined) counts[s]++; });
  var cards = [
    { title: '今日任务总数', value: counts.total },
    { title: '待处理',       value: counts['待处理'] },
    { title: '待跟进',       value: counts['待跟进'] },
    { title: '已逾期',       value: counts['已逾期'] }
  ];
  var html = '';
  cards.forEach(function (c) {
    html += '<div class="card"><div class="card-content" style="padding:1rem 1.25rem;">' +
      '<div style="display:flex;flex-direction:column;gap:0.125rem;">' +
      '<div class="muted" style="font-size:0.8125rem;">' + esc(c.title) + '</div>' +
      '<div style="font-size:1.875rem;font-weight:700;letter-spacing:-0.025em;line-height:1.2;">' + c.value + '</div>' +
      '</div></div></div>';
  });
  document.getElementById('statGrid').innerHTML = html;
}

/* ===== 负责人列表渲染 ===== */
function renderOwnerList() {
  var list = getFilteredTasks();
  var groups = groupByOwner(list);
  var rows = '';

  groups.forEach(function (g) {
    var totalCount = g.tasks.length;
    var unfinishedCount = g.tasks.filter(isUnfinished).length;
    var expanded = state.expandedOwners[g.owner] === true;
    var arrow = expanded ? 'm6 9 6 6 6-6' : 'm9 18 6-6-6-6';

    /* 负责人行：muted背景 + 加粗字体，与任务行视觉区分 */
    rows += '<tr class="table-row" style="cursor:pointer;background:var(--muted);" onclick="toggleOwner(\'' + esc(g.owner) + '\')">' +
      '<td class="table-cell" style="border-bottom:1px solid var(--border);">' +
        '<div class="flex items-center gap-2">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="' + arrow + '"/></svg>' +
          '<span style="font-weight:600;">' + esc(g.owner) + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="table-cell" style="border-bottom:1px solid var(--border);">' + totalCount + ' 条</td>' +
      '<td class="table-cell" style="border-bottom:1px solid var(--border);">' +
        (unfinishedCount > 0
          ? badgeHtml(unfinishedCount + ' 条未完成', 'secondary')
          : '<span class="muted">全部已处理</span>') +
      '</td>' +
    '</tr>';
  });

  document.getElementById('ownerBody').innerHTML = rows;
  document.getElementById('emptyTip').hidden = groups.length > 0;
  document.getElementById('listSummary').textContent =
    '共 ' + OWNERS.length + ' 位负责人，筛选后 ' + groups.length + ' 位有任务';

  /* 渲染已展开负责人的任务明细 */
  renderTaskDetail(groups);
}

/* ===== 任务明细渲染（公司→联系人→任务 两级折叠） ===== */
function renderTaskDetail(groups) {
  var expandedOwner = null;
  var expandedTasks = [];
  groups.forEach(function (g) {
    if (state.expandedOwners[g.owner]) {
      expandedOwner = g.owner;
      expandedTasks = g.tasks;
    }
  });

  var wrap = document.getElementById('taskDetailWrap');
  if (!expandedOwner || expandedTasks.length === 0) {
    wrap.hidden = true;
    return;
  }

  wrap.hidden = false;
  document.getElementById('detailOwnerName').textContent = expandedOwner;
  document.getElementById('detailSubtitle').textContent =
    '共 ' + expandedTasks.length + ' 条未完成任务';

  /* 按 customerId 分组 */
  var companyMap = {};
  var companyOrder = [];
  expandedTasks.forEach(function (t) {
    if (!companyMap[t.customerId]) {
      companyMap[t.customerId] = {};
      companyOrder.push(t.customerId);
    }
    if (!companyMap[t.customerId][t.relatedContact]) {
      companyMap[t.customerId][t.relatedContact] = [];
    }
    companyMap[t.customerId][t.relatedContact].push(t);
  });

  var html = '';

  companyOrder.forEach(function (customerId) {
    var c = customerById(customerId);
    var contacts = companyMap[customerId];
    var contactNames = Object.keys(contacts);
    var companyTaskCount = 0;
    contactNames.forEach(function (cn) { companyTaskCount += contacts[cn].length; });

    /* 会员 badge */
    var memberBadge = '';
    if (c.memberType === '高级会员') {
      memberBadge = badgeHtml('高级', 'subtle');
    } else if (c.memberType === '标准会员') {
      memberBadge = badgeHtml('标准', 'subtle-secondary');
    } else {
      memberBadge = badgeHtml('免费', 'subtle-outline');
    }

    var companyExpanded = state.expandedCompanies[customerId] === true;
    var companyArrow = companyExpanded ? 'm6 9 6 6 6-6' : 'm9 18 6-6-6-6';

    /* 公司行 */
    html += '<div style="background:var(--muted);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-lg);margin-bottom:0.5rem;overflow:hidden;">';
    html += '<div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;cursor:pointer;font-weight:700;font-size:0.9375rem;" onclick="toggleCompany(\'' + esc(customerId) + '\')">';
    html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="' + companyArrow + '"/></svg>';
    html += '<span>' + esc(c.name) + '</span>';
    html += '<span class="muted" style="font-weight:400;">' + esc(c.accountName) + '</span>';
    html += memberBadge;
    html += '<span class="muted" style="font-weight:400;margin-left:auto;">' + companyTaskCount + ' 条任务</span>';
    html += '</div>';

    /* 联系人二级折叠 */
    if (companyExpanded) {
      contactNames.forEach(function (contactName) {
        var tasks = contacts[contactName];
        var phone = contactPhone(customerId, contactName);
        var contactKey = customerId + '::' + contactName;
        var contactExpanded = state.expandedContacts[contactKey] === true;
        var contactArrow = contactExpanded ? 'm6 9 6 6 6-6' : 'm9 18 6-6-6-6';

        /* 联系人行 */
        html += '<div style="padding-left:2rem;border-top:1px solid var(--border);background:rgba(0,0,0,0.02);border-left:3px solid var(--muted);">';
        html += '<div style="display:flex;align-items:center;gap:0.5rem;padding:0.625rem 1rem;cursor:pointer;font-weight:500;" onclick="toggleContact(\'' + esc(customerId) + '\', \'' + esc(contactName) + '\')">';
        html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="' + contactArrow + '"/></svg>';
        html += '<span>' + esc(contactName) + '</span>';
        if (phone) html += '<span class="muted">' + esc(phone) + '</span>';
        html += '<span class="muted" style="margin-left:auto;">' + tasks.length + ' 条任务</span>';
        html += '</div>';

        /* 任务三级折叠 */
        if (contactExpanded) {
          tasks.forEach(function (t) {
            var resultHtml = '<span class="muted">-</span>';
            if (t.result) {
              resultHtml = '<button class="btn" data-variant="ghost" data-size="xs" type="button" style="color:var(--primary);text-decoration:underline;text-underline-offset:3px;" onclick="event.stopPropagation();showResultDetail(\'' + t.id + '\')">查看详情</button>';
            }
            html += '<div style="padding-left:3.5rem;border-top:1px solid var(--border);border-left:3px solid transparent;display:grid;grid-template-columns:11rem 8rem 1fr 10rem 8rem;align-items:center;gap:0.75rem;padding-top:0.625rem;padding-bottom:0.625rem;padding-right:1rem;">';
            html += '<div style="font-size:0.875rem;">' + remindCell(t) + '</div>';
            html += '<div>' + typeCell(t) + '</div>';
            html += '<div style="font-size:0.875rem;color:var(--foreground);">' + esc(t.desc) + '</div>';
            html += '<div style="font-size:0.875rem;">' + resultHtml + '</div>';
            html += '<div>' + statusBadge(effStatus(t)) + '</div>';
            html += '</div>';
          });
        }

        html += '</div>';
      });
    }

    html += '</div>';
  });

  document.getElementById('taskDetailBody').innerHTML = html;
}

/* ===== 展开/折叠公司 ===== */
function toggleCompany(customerId) {
  state.expandedCompanies[customerId] = !state.expandedCompanies[customerId];
  /* 折叠公司时，同时折叠其下所有联系人 */
  if (!state.expandedCompanies[customerId]) {
    var prefix = customerId + '::';
    Object.keys(state.expandedContacts).forEach(function (k) {
      if (k.indexOf(prefix) === 0) delete state.expandedContacts[k];
    });
  }
  renderOwnerList();
}

/* ===== 展开/折叠联系人 ===== */
function toggleContact(customerId, contactName) {
  var key = customerId + '::' + contactName;
  state.expandedContacts[key] = !state.expandedContacts[key];
  renderOwnerList();
}

/* ===== 展开/折叠负责人 ===== */
function toggleOwner(owner) {
  /* 先重置公司和联系人展开状态 */
  state.expandedCompanies = {};
  state.expandedContacts = {};
  state.expandedOwners[owner] = !state.expandedOwners[owner];
  renderOwnerList();
}

/* ===== 筛选事件 ===== */
function onFilterChange() {
  state.filters.owner = document.getElementById('fOwner').value;
  state.filters.category = document.getElementById('fCategory').value;
  state.filters.status = document.getElementById('fStatus').value;
  state.expandedOwners = {};
  state.expandedCompanies = {};
  state.expandedContacts = {};
  renderOwnerList();
}
function resetFilters() {
  document.getElementById('fOwner').value = '';
  document.getElementById('fCategory').value = '';
  document.getElementById('fStatus').value = '';
  state.filters = { owner: '', category: '', status: '' };
  state.expandedOwners = {};
  state.expandedCompanies = {};
  state.expandedContacts = {};
  renderOwnerList();
}

/* ===== 渲染入口 ===== */
function render() {
  /* 统计卡使用「全部未处理」任务（不含状态筛选） */
  var baseTasks = TASKS.filter(function (t) {
    if (effStatus(t) === '已处理') return false;
    var f = state.filters;
    var owner = ownerOfCustomer(t.customerId);
    var m = TYPE_META[t.type];
    if (f.owner && owner !== f.owner) return false;
    if (f.category && m.category !== f.category) return false;
    return true;
  });
  renderStats(baseTasks);
  renderOwnerList();
}

/* ===== 初始化 ===== */
function init() {
  /* 填充负责人下拉 */
  var opts = '<option value="">全部负责人</option>';
  OWNERS.forEach(function (o) {
    var n = TASKS.filter(function (t) { return ownerOfCustomer(t.customerId) === o && effStatus(t) !== '已处理'; }).length;
    opts += '<option value="' + o + '">' + o + '（' + n + ' 条未处理）</option>';
  });
  document.getElementById('fOwner').innerHTML = opts;
  render();
}
init();
</script>
</body>
</html>
