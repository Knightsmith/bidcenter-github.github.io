    <script>
        var id = parseInt('28'),
            copyid = parseInt('0');
        var tankArray = [null, null];//弹框数组
        var tankIndex = 0;//当前弹框索引
        var yhqArr = [], prizeArr = [];
        function next() {
            if ($("#tam_name").val().trim() == "") {
                layer.msg('请输入活动名称');
            } else if ($("input[name=tam_status]:checked").val() == "") {
                layer.msg('请选择活动状态');
            } else if ($("#tam_stime").val().trim() == "") {
                layer.msg('请选择活动开始时间');
            } else if ($("#tam_etime").val().trim() == "") {
                layer.msg('请选择活动截止时间');
            } else if ($("#tam_weight").val().trim() == "") {
                layer.msg('请输入权重');
            } else if (checkConType()) {
                if (id > 0 && copyid <= 0) {
                    layer.confirm("是否保存当前活动设置", function () {
                        $("#Button1").click();
                    });
                }
                else {
                    $("#Button1").click();
                }
            }
        }
        function cacel() {
            layer.confirm("退出后不保存已设置内容", function () {
                window.close();
            });
        }
        //验证活动类型
        function checkConType() {
            var obj = $("input[name='tam_type']:checked");
            if (obj.val() == "1") {
                if (yhqArr.length <= 0)
                    layer.msg("请选择优惠券");
                else {
                    $("#yhqData").val(yhqArr.map(e=> { return JSON.parse(e).id; }).join(','));
                    return true;
                }
            } else if (checkPrize())
                return true;
            return false;
        }
        //验证奖品信息是否有效
        function checkPrize() {
            prizeArr = [];
            $(".swTp2 .table tbody tr").each(function (i, e) {
                var nameObj = $(e).find("input[name='prizeName']"),
                    probObj = $(e).find("input[name='prizeProb']");
                prizeArr.push({ name: nameObj.val(), prob: probObj.val() == "" ? 0 : parseFloat(probObj.val()) });
            });
            if (prizeArr.length <= 0)
                layer.msg("请填写奖品信息");
            else if (prizeArr.filter(function (e) { return e.name == ""; }).length > 0)
                layer.msg("奖品名称不可为空");
            else if (prizeArr.filter(function (e) { return e.prob <= 0; }).length > 0)
                layer.msg("奖品概率不可为空");
            else if (sum(prizeArr, 'prob') != 100)
                layer.msg("总概率必须为100%");
            else {
                $("#prizeData").val(JSON.stringify(prizeArr));
                return true;
            }
            return false;
        }
        //对象数组内数值属性求和
        function sum(array, propertyName) {
            // 初始化总和为 0
            let total = 0;
            // 遍历数组
            array.forEach(e => {
                let value = $(e).data(propertyName) || e[propertyName];
                if (typeof value === 'number' && !isNaN(value)) {
                    total += value;
                }
            });
            return parseFloat(total.toFixed(2));
        }
        //切换活动类型
        function chgConType() {
            var obj = $("input[name='tam_type']:checked");
            $(".switchType").hide();
            $(".swTp" + obj.val()).show();
            getCmsCode(obj.val());
        }
        //获取cms广告code
        function getCmsCode(type) {
            $.ajax({
                type: "POST",
                url: "/JsonHandler/bid/huodong/GetCmsCodeHandler.aspx",
                data: { adid: type == 1 ? 162 : 161 },
                dataType: "json",
                success: function (res) {
                    if (res) {
                        if (res.ret) {
                            var data = res.result;
                            if (data) {
                                if (data.adUrl)
                                    $("#img_ad").attr("src", data.adUrl).show();
                                if (data.code)
                                    $("#upload_ad").attr("href", "http://cms.bidcenter.com.cn:1834/sys_createtxt/ImProject.aspx?code=" + data.code).attr("target", "_blank");
                            }
                        } else {
                            layer.msg(res.msg);
                        }
                    }
                },
                error: function (e) {
                    console.log(e)
                }
            });
        }
        function addYhq() {
            var prizeIdArr = [];
            $(".swTp1 .table tbody tr").each(function (i, e) {
                prizeIdArr.push($(e).find(".index").attr("yhqid"));
            });
            layer.open({
                type: 2,
                title: ['选择优惠券', 'background-color: #3497DA;color: #fff;font-weight: bold;font-size: 16px'],
                closeBtn: 1,
                shade: false,
                area: ['850px', '400px'],
                content: '/bid/tanchu/huodong/YhqSelector.aspx?ids=' + prizeIdArr.join(','),
                end: function () {
                    if (yhqArr.length > 0) {
                        var html = [];
                        $.each(yhqArr, function (i, e) {
                            var obj = JSON.parse(e);
                            html.push('<tr>');
                            html.push(`<td class="index" yhqid="${obj.id}">${obj.id}</td>`);
                            html.push(`<td>${obj.name}</td>`);
                            html.push(`<td>${obj.limitDes}</td>`);
                            html.push(`<td>${obj.indate}</td>`);
                            html.push('</tr>');
                        });
                        $(".swTp1 .table tbody").html(html.join(''));
                    }
                }
            });
        }
        //添加奖品
        function addPrize() {
            var html = [];
            html.push('<tr>');
            html.push(`<td class="index"></td>`);
            html.push('<td><input type="text" class="inp" name="prizeName" placeholder="请填写奖品名称" /></td>');
            html.push('<td><input type="number" class="inp" name="prizeProb" placeholder="请填写奖品概率" />%</td>');
            html.push('<td class="button"><input type="button" class="remove" value="-" onclick="removePrize(this);" /></td>');
            html.push('</tr>');
            $(".swTp2 .table tbody").append(html.join(''));
            loadPrizeIndex();
        }
        //移除奖品
        function removePrize(obj) {
            console.log(obj);
            $(obj).parents("tr").remove();
            loadPrizeIndex();
        }
        //加载奖品索引
        function loadPrizeIndex() {
            $(".swTp2 .table tbody tr").each(function (i, e) {
                console.log(i, e);
                $(e).find('.index').text(i + 1);
            });
        }
        //打开弹框
        function openTank(selecter, title, width, height, fn, callback) {
            if (!width) width = 'auto';
            if (!height) height = 'auto';
            if (!title) title = false;
            tankArray[tankIndex] = layer.open({
                type: 1,
                title: title,
                closeBtn: 1,
                shade: false,
                area: [width, height],
                content: $(selecter),
                success: function () {
                    if (fn) fn();
                },
                end: function () {
                    if (callback) callback();
                }
            });
            tankIndex++;
        }
        //关闭弹框
        function closeTank() {
            tankIndex--;
            layer.close(tankArray[tankIndex]);
        }
        $(function () {
            if (id <= 0 || copyid > 0)
                $("#tam_name").removeAttr("disabled");
            else
                $("#tam_name").attr("disabled", true);
            chgConType();
            $("#tam_type").on('change', function () {
                chgConType();
            });
            //时间插件初始化
            laydate.render({
                elem: '#tam_stime',
                type: 'datetime',
                trigger: 'click'
            });
            laydate.render({
                elem: '#tam_etime',
                type: 'datetime',
                trigger: 'click'
            });
        })
    </script>
