<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分管理</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%231890ff'/%3E%3Ctext%20x='32'%20y='45'%20text-anchor='middle'%20font-size='34'%20font-weight='700'%20fill='%23ffffff'%20font-family='Microsoft%20YaHei,sans-serif'%3E%E7%A7%AF%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px; line-height: 1.6; color: #1a1a1a;
    background: #f5f6f8; min-width: 1400px;
  }

  /* ===== 顶栏 ===== */
  .header {
    position: sticky; top: 0; z-index: 150; background: #fff;
    height: 52px; display: flex; align-items: center; padding: 0 24px;
    border-bottom: 1px solid #ebedf0; box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .crumb { font-size: 13px; color: #b8b8b8; }
  .crumb b { color: #1a1a1a; font-weight: 500; }
  .header-right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .badge {
    background: #fff7e6; border: 1px solid #ffe58f;
    color: #d48806; font-size: 12px; padding: 2px 8px; border-radius: 4px;
  }

  .content { padding: 18px 24px 48px; }

  /* ===== 数值基元（单公司统计复用） ===== */
  .stat-label { font-size: 12px; color: #8c8c8c; }
  .stat-value {
    font-size: 26px; font-weight: 700; color: #1a1a1a; line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .stat-value small { font-size: 13px; font-weight: 400; color: #8c8c8c; margin-left: 3px; }
  .stat-value.accent { color: #f5222d; }
  .stat-value.sm { font-size: 16px; font-weight: 600; }
  .stat-value.plus { color: #52c41a; }
  .stat-value.blue { color: #1890ff; }

  /* ===== 顶部常驻统计（总消耗 / 总充值 / 总赠送） ===== */
  .stat-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 16px;
  }
  .stat-card {
    background: #fff; border: 1px solid #f0f0f0; border-radius: 6px;
    padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  .stat-sub { font-size: 11px; color: #bfbfbf; margin-top: 2px; }

  /* ===== 单公司积分统计（仅选中单家公司时出现） ===== */
  .co-stat {
    background: #fff; border: 1px solid #f0f0f0; border-left: 3px solid #1890ff;
    border-radius: 6px; padding: 16px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  .co-stat[hidden] { display: none; }
  .co-stat-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .co-tt { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .co-id {
    font-size: 12px; color: #8c8c8c; font-variant-numeric: tabular-nums;
    background: #fafafa; border: 1px solid #f0f0f0; border-radius: 3px; padding: 1px 6px;
  }
  .co-tag {
    margin-left: auto; font-size: 12px; color: #1890ff;
    background: #e6f4ff; border: 1px solid #bae0ff; border-radius: 10px; padding: 1px 9px;
  }
  .co-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .co-item { border-left: 1px solid #f0f0f0; padding-left: 16px; }
  .co-item:first-child { border-left: 0; padding-left: 0; }
  .co-types {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px; padding-top: 12px; border-top: 1px dashed #f0f0f0;
  }
  .co-type {
    font-size: 12px; color: #595959; background: #fafafa;
    border: 1px solid #f0f0f0; border-radius: 4px; padding: 3px 10px;
  }
  .co-type b { color: #f5222d; font-weight: 600; }
  .co-type i { font-style: normal; color: #bfbfbf; }
  .co-types:empty { display: none; }

  /* ===== 卡片 ===== */
  .card {
    background: #fff; border-radius: 6px; padding: 20px 24px;
    margin-bottom: 16px; border: 1px solid #f0f0f0;
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  .card-hd { display: flex; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .card-tt {
    font-size: 15px; font-weight: 600; color: #1a1a1a;
    padding-left: 10px; position: relative;
  }
  .card-tt::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px;
    width: 3px; background: #1890ff; border-radius: 2px;
  }
  .card-desc { font-size: 12px; color: #b8b8b8; margin-left: 10px; }
  .card-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* ===== 查询区 ===== */
  .query-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px 20px; align-items: center;
  }
  .q-item { display: flex; align-items: center; gap: 10px; }
  .q-span2 { grid-column: span 2; }
  .query-actions { display: flex; justify-content: flex-start; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #f0f1f5; }
  .q-label { font-size: 13px; color: #8c8c8c; flex: 0 0 auto; min-width: 56px; }
  .txt {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px;
    border: 1px solid #d9d9d9; border-radius: 4px; background: #fff;
    font-size: 13px; color: #1a1a1a; outline: none;
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .txt::placeholder { color: #bfbfbf; }
  .txt:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,.08); }
  .txt.err { border-color: #f5222d; }
  select.txt { cursor: pointer; }

  .quick-pills { display: inline-flex; background: #f5f5f5; border-radius: 4px; overflow: hidden; }
  .pill {
    padding: 5px 14px; font-size: 13px; color: #595959; background: transparent;
    border: none; cursor: pointer; white-space: nowrap; transition: .15s; font-family: inherit;
  }
  .pill:hover { color: #1890ff; }
  .pill.active { color: #fff; background: #1890ff; border-radius: 4px; box-shadow: 0 2px 4px rgba(24,144,255,.25); }

  .btn {
    height: 32px; padding: 0 16px; background: #fff; border: 1px solid #d9d9d9;
    border-radius: 4px; font-size: 13px; color: #595959; cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  .btn:hover { color: #1890ff; border-color: #1890ff; }
  .btn-primary { background: #1890ff; color: #fff; border-color: #1890ff; }
  .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }

  /* ===== 表格 ===== */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    text-align: left; font-weight: 500; color: #8c8c8c; font-size: 12.5px;
    padding: 10px 12px; background: #fafafa; border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  .tbl td { padding: 11px 12px; border-bottom: 1px solid #f5f5f5; color: #1a1a1a; white-space: nowrap; }
  .tbl tbody tr:hover { background: #fafbfc; }
  .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl .time { color: #595959; font-variant-numeric: tabular-nums; }
  .tbl .acc-id { color: #595959; font-variant-numeric: tabular-nums; }
  .tbl .acc-id-link {
    color: #1890ff; text-decoration: none; cursor: pointer;
    border-bottom: 1px dashed #91d5ff;
  }
  .tbl .acc-id-link:hover { color: #40a9ff; border-bottom-style: solid; }
  .tbl .acc-name { color: #1890ff; cursor: pointer; }
  .tbl .acc-name:hover { text-decoration: underline; }
  .tbl .account { color: #595959; font-variant-numeric: tabular-nums; }
  .tbl .cost { color: #f5222d; font-weight: 600; }
  .tbl .plus { color: #52c41a; font-weight: 600; }
  .tbl .remain { color: #8c8c8c; }
  .tbl .ent { color: #1a1a1a; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .tbl .ip { color: #8c8c8c; font-variant-numeric: tabular-nums; }

  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 3px;
    font-size: 12px; line-height: 18px; white-space: nowrap;
  }
  .tag-contact { background: #e6f7ff; color: #1890ff; border: 1px solid #bae7ff; }
  .tag-biz { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
  .tag-chain { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
  .tag-recharge { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .tag-gift { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; }

  .empty { padding: 56px 0; text-align: center; color: #bfbfbf; font-size: 13px; }

  /* ===== 分页 ===== */
  .pager { display: flex; align-items: center; gap: 8px; padding-top: 16px; }
  .pager-info { font-size: 12.5px; color: #8c8c8c; }
  .pager-btns { margin-left: auto; display: flex; gap: 6px; }
  .pg {
    min-width: 32px; height: 30px; padding: 0 9px; background: #fff;
    border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12.5px; color: #595959;
    cursor: pointer; font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .pg:hover:not(:disabled) { color: #1890ff; border-color: #1890ff; }
  .pg:disabled { color: #d9d9d9; cursor: not-allowed; }
  .pg.on { background: #1890ff; border-color: #1890ff; color: #fff; }

  /* ===== toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 48px; transform: translate(-50%, 12px);
    background: rgba(0,0,0,.82); color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 4px; opacity: 0; z-index: 400;
    pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="header">
  <div class="crumb">CRM &nbsp;/&nbsp; <b>积分管理</b></div>
  <div class="header-right">
    <span class="badge">内网后台 · 仅内部可见</span>
  </div>
</header>

<div class="content">

  <!-- 查询 -->
  <div class="card">
    <div class="card-hd">
      <div class="card-tt">积分查询</div>
      <div class="card-desc">按时间、账户、积分类型筛选积分流水（消耗及单项消耗功能 / 充值 / 赠送）</div>
    </div>
    <div class="query-grid">
      <div class="q-item q-span2">
        <span class="q-label">时间</span>
        <div class="quick-pills" id="quickTabs">
          <button class="pill" data-days="0">今日</button>
          <button class="pill" data-days="7">近 7 天</button>
          <button class="pill active" data-days="30">近 30 天</button>
          <button class="pill" data-days="90">近 3 个月</button>
          <button class="pill" data-days="all">全部</button>
        </div>
      </div>
      <div class="q-item">
        <span class="q-label">开始日期</span>
        <input class="txt" id="dateStart" placeholder="YYYY-MM-DD" autocomplete="off">
      </div>
      <div class="q-item">
        <span class="q-label">结束日期</span>
        <input class="txt" id="dateEnd" placeholder="YYYY-MM-DD" autocomplete="off">
      </div>
      <div class="q-item">
        <span class="q-label">账户 ID</span>
        <input class="txt" id="accId" placeholder="如 ACC20231108" autocomplete="off">
      </div>
      <div class="q-item">
        <span class="q-label">公司名称</span>
        <input class="txt" id="corpName" placeholder="支持关键字" autocomplete="off">
      </div>
      <div class="q-item">
        <span class="q-label">账户名称</span>
        <input class="txt" id="account" placeholder="手机号 / 字母数字账号" autocomplete="off">
      </div>
      <div class="q-item">
        <span class="q-label">积分类型</span>
        <select class="txt" id="catSel">
          <option value="">全部</option>
          <option value="consume">消耗</option>
          <option value="recharge">充值</option>
          <option value="gift">赠送</option>
          <option value="contact">联系方式</option>
          <option value="工商">全维度工商信息</option>
          <option value="脉络">商机脉络</option>
        </select>
      </div>
    </div>
    <div class="query-actions">
      <button class="btn btn-primary" id="queryBtn">查询</button>
      <button class="btn" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- 顶部常驻统计：跟随当前筛选范围汇总 -->
  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label">总消耗</div>
      <div class="stat-value accent" id="tsCost">0</div>
      <div class="stat-sub" id="tsCostCnt">消耗 0 次</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">总充值</div>
      <div class="stat-value plus" id="tsRecharge">0</div>
      <div class="stat-sub" id="tsRechargeCnt">充值 0 次</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">总赠送</div>
      <div class="stat-value blue" id="tsGift">0</div>
      <div class="stat-sub" id="tsGiftCnt">赠送 0 次</div>
    </div>
  </div>

  <!-- 单公司积分统计（仅当筛选结果只涉及一家公司时显示） -->
  <div class="co-stat" id="coStat" hidden>
    <div class="co-stat-hd">
      <span class="co-tt" id="csName">—</span>
      <span class="co-id" id="csAccId">—</span>
      <span class="co-tag">单公司视角 · 当前筛选仅涉及该账户</span>
    </div>
    <div class="co-grid">
      <div class="co-item">
        <div class="stat-label">累计消耗</div>
        <div class="stat-value accent" id="csCost">0</div>
      </div>
      <div class="co-item">
        <div class="stat-label">累计充值</div>
        <div class="stat-value plus" id="csRecharge">0</div>
      </div>
      <div class="co-item">
        <div class="stat-label">累计赠送</div>
        <div class="stat-value blue" id="csGift">0</div>
      </div>
      <div class="co-item">
        <div class="stat-label">当前余额</div>
        <div class="stat-value" id="csRemain">0</div>
      </div>
    </div>
    <div class="co-types" id="csTypes"></div>
  </div>

  <!-- 明细 -->
  <div class="card">
    <div class="card-hd">
      <div class="card-tt">积分流水明细</div>
      <div class="card-desc" id="resultDesc">—</div>
      <div class="card-actions">
        <select class="txt" id="pageSize" style="width:96px;flex:0 0 auto;">
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
          <option value="100">100 条/页</option>
        </select>
        <button class="btn" id="exportBtn">导出</button>
      </div>
    </div>
    <table class="tbl">
      <thead>
        <tr>
          <th style="width:170px;">时间</th>
          <th style="width:132px;">账户 ID</th>
          <th style="width:210px;">公司名称</th>
          <th style="width:140px;">账户名称</th>
          <th style="width:132px;">类型</th>
          <th class="r" style="width:104px;">变动积分</th>
          <th class="r" style="width:104px;">剩余积分</th>
          <th>关联企业</th>
          <th style="width:130px;">操作 IP</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyBox" hidden>暂无符合条件的积分流水记录</div>
    <div class="pager">
      <span class="pager-info" id="pagerInfo"></span>
      <div class="pager-btns" id="pagerBtns"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

var TYPE_CLS = { 'contact': 'tag-contact', '工商': 'tag-biz', '脉络': 'tag-chain', 'recharge': 'tag-recharge', 'gift': 'tag-gift' };
var CAT_NAME = { consume: '消耗', recharge: '充值', gift: '赠送' };

/* 账户 ID 点击跳转的客户详情页 */
var CUSTOMER_DETAIL = '../客户详情页/客户详情页-新增销售回访日程V1.2.html';
var PAGE_MAX_BTNS = 7;

/* 演示数据基准日：取数据中最新的日期，保证「今日/近7天」等快捷筛选始终可用 */
var BASE_DAY = (function () {
  var list = RAW.map(function (r) { return r.time.slice(0, 10); }).sort();
  return list[list.length - 1] || '';
})();

var state = {
  days: 30,
  start: '',
  end: '',
  accId: '',
  corpName: '',
  account: '',
  cat: '',
  page: 1,
  size: 20
};

var $ = function (id) { return document.getElementById(id); };

function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* 基准日往前推 N 天，返回 YYYY-MM-DD */
function shiftDay(base, days) {
  var p = base.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() - days);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function isValidDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p = s.split('-');
  var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  if (m < 1 || m > 12 || d < 1 || d > 31) return false;
  var dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function showToast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function () { t.classList.remove('show'); }, 2000);
}

/* 读取界面条件写入 state */
function syncStateFromUI() {
  state.accId = $('accId').value.trim().toUpperCase();
  state.corpName = $('corpName').value.trim();
  state.account = $('account').value.trim();
  state.cat = $('catSel').value;
  state.size = parseInt($('pageSize').value, 10) || 20;
}

/* 快捷时间 → 回填日期框 */
function applyQuickDays(days) {
  state.days = days;
  if (days === 'all') {
    $('dateStart').value = '';
    $('dateEnd').value = '';
  } else if (days === 0) {
    $('dateStart').value = BASE_DAY;
    $('dateEnd').value = BASE_DAY;
  } else {
    $('dateStart').value = shiftDay(BASE_DAY, days - 1);
    $('dateEnd').value = BASE_DAY;
  }
}

function filterRows() {
  var start = state.start, end = state.end;
  return RAW.filter(function (r) {
    var day = r.time.slice(0, 10);
    if (start && day < start) return false;
    if (end && day > end) return false;
    if (state.accId && r.accId.indexOf(state.accId) === -1) return false;
    if (state.corpName && r.corpName.indexOf(state.corpName) === -1) return false;
    if (state.account && r.account.indexOf(state.account) === -1) return false;
    if (state.cat) {
      if (FN_CATS.indexOf(state.cat) !== -1) {
        /* 具体消耗功能：限定在消耗类流水内按功能名称匹配 */
        if (r.cat !== 'consume' || r.type !== state.cat) return false;
      } else if (r.cat !== state.cat) {
        return false;
      }
    }
    return true;
  });
}

/* 积分类型里按功能名称细分的三项（均属消耗类） */
var FN_CATS = ['contact', '工商', '脉络'];

/* 顶部三格：总消耗 / 总充值 / 总赠送（跟随当前筛选范围） */
function renderTopStat(rows) {
  var cost = 0, costCnt = 0, rech = 0, rechCnt = 0, gift = 0, giftCnt = 0;
  rows.forEach(function (r) {
    if (r.cat === 'consume') { cost += Math.abs(r.delta); costCnt += 1; }
    else if (r.cat === 'recharge') { rech += r.delta; rechCnt += 1; }
    else if (r.cat === 'gift') { gift += r.delta; giftCnt += 1; }
  });
  $('tsCost').textContent = fmtCost(cost);
  $('tsCostCnt').textContent = '消耗 ' + costCnt + ' 次';
  $('tsRecharge').textContent = fmtPlus(rech);
  $('tsRechargeCnt').textContent = '充值 ' + rechCnt + ' 次';
  $('tsGift').textContent = fmtPlus(gift);
  $('tsGiftCnt').textContent = '赠送 ' + giftCnt + ' 次';
}

/* 数值为 0 时不带正负号 */
function fmtCost(v) { return v > 0 ? '-' + v : '0'; }
function fmtPlus(v) { return v > 0 ? '+' + v : '0'; }

function renderCompanyStat(rows) {
  var box = $('coStat');
  var idMap = {};
  rows.forEach(function (r) { idMap[r.accId] = 1; });
  var keys = Object.keys(idMap);
  if (keys.length !== 1) { box.hidden = true; return; }

  var accId = keys[0];
  var cost = 0, costCnt = 0, rech = 0, gift = 0, last = '';
  var byType = {};
  rows.forEach(function (r) {
    if (r.time > last) last = r.time;
    var amt = Math.abs(r.delta);
    if (r.cat === 'consume') { cost += amt; costCnt += 1; }
    else if (r.cat === 'recharge') rech += amt;
    else if (r.cat === 'gift') gift += amt;
    if (!byType[r.type]) byType[r.type] = { name: r.typeName, cat: r.cat, cnt: 0, amt: 0 };
    byType[r.type].cnt += 1;
    byType[r.type].amt += amt;
  });

  /* 当前余额取该账户全量数据里最近一条的余额，不受时间筛选影响 */
  var latest = RAW.filter(function (r) { return r.accId === accId; })
    .sort(function (a, b) { return a.time < b.time ? 1 : -1; })[0];

  $('csName').textContent = rows[0].corpName;
  $('csAccId').textContent = accId + ' · ' + rows[0].account;
  $('csCost').textContent = fmtCost(cost);
  $('csRecharge').textContent = fmtPlus(rech);
  $('csGift').textContent = fmtPlus(gift);
  $('csRemain').textContent = latest ? latest.balance : '—';
  box.querySelector('.co-tag').textContent =
    '单公司视角 · 筛选范围内 ' + rows.length + ' 次变动 · 最近变动 ' + (last || '—');

  /* 按类型汇总展示：消耗功能在前，充值 / 赠送在后，同类按积分多少降序 */
  var CAT_ORDER = { consume: 0, recharge: 1, gift: 2 };
  var order = Object.keys(byType).sort(function (a, b) {
    var d = (CAT_ORDER[byType[a].cat] || 0) - (CAT_ORDER[byType[b].cat] || 0);
    return d !== 0 ? d : byType[b].amt - byType[a].amt;
  });
  $('csTypes').innerHTML = order.map(function (k) {
    var t = byType[k];
    var sign = t.cat === 'consume' ? '-' : '+';
    return '<span class="co-type">' + t.name + ' <i>·</i> ' + t.cnt + ' 次 <i>·</i> <b>' + sign + t.amt + '</b> 积分</span>';
  }).join('');

  box.hidden = false;
}

function renderTable(rows) {
  var size = state.size;
  var totalPage = Math.max(1, Math.ceil(rows.length / size));
  if (state.page > totalPage) state.page = totalPage;
  if (state.page < 1) state.page = 1;

  var begin = (state.page - 1) * size;
  var pageRows = rows.slice(begin, begin + size);

  var tb = $('tbody');
  if (!rows.length) {
    tb.innerHTML = '';
    $('emptyBox').hidden = false;
  } else {
    $('emptyBox').hidden = true;
    tb.innerHTML = pageRows.map(function (r) {
      var detail = CUSTOMER_DETAIL + '?accId=' + encodeURIComponent(r.accId);
      var sign = r.delta > 0 ? '+' : '';
      return '<tr>' +
        '<td class="time">' + r.time + '</td>' +
        '<td class="acc-id"><a class="acc-id-link" href="' + detail + '" target="_blank" rel="noopener" title="查看该账户客户详情">' + r.accId + '</a></td>' +
        '<td><span class="acc-name" data-acc="' + r.accId + '">' + r.corpName + '</span></td>' +
        '<td class="account">' + r.account + '</td>' +
        '<td><span class="tag ' + (TYPE_CLS[r.type] || '') + '">' + r.typeName + '</span></td>' +
        '<td class="r ' + (r.delta > 0 ? 'plus' : 'cost') + '">' + sign + r.delta + '</td>' +
        '<td class="r remain">' + r.balance + '</td>' +
        '<td class="ent" title="' + r.ent + '">' + r.ent + '</td>' +
        '<td class="ip">' + r.ip + '</td>' +
      '</tr>';
    }).join('');
  }

  $('pagerInfo').textContent = rows.length
    ? ('共 ' + rows.length + ' 条，第 ' + state.page + ' / ' + totalPage + ' 页')
    : '共 0 条';

  renderPager(totalPage);
}

function renderPager(totalPage) {
  var box = $('pagerBtns');
  var html = '';
  html += '<button class="pg" data-pg="prev"' + (state.page <= 1 ? ' disabled' : '') + '>上一页</button>';

  var pages = [];
  var startP = Math.max(1, state.page - 3);
  var endP = Math.min(totalPage, startP + PAGE_MAX_BTNS - 1);
  startP = Math.max(1, endP - PAGE_MAX_BTNS + 1);
  for (var i = startP; i <= endP; i++) pages.push(i);

  pages.forEach(function (p) {
    html += '<button class="pg' + (p === state.page ? ' on' : '') + '" data-pg="' + p + '">' + p + '</button>';
  });

  html += '<button class="pg" data-pg="next"' + (state.page >= totalPage ? ' disabled' : '') + '>下一页</button>';
  box.innerHTML = html;
}

var currentRows = [];

function refresh() {
  currentRows = filterRows();
  renderTopStat(currentRows);
  renderCompanyStat(currentRows);
  renderTable(currentRows);
  var s = state.start ? state.start : '不限';
  var e = state.end ? state.end : '不限';
  $('resultDesc').textContent = '时间 ' + s + ' 至 ' + e + '，共 ' + currentRows.length + ' 条';
}

/* ===== 事件 ===== */
$('quickTabs').addEventListener('click', function (e) {
  var b = e.target.closest('.pill');
  if (!b) return;
  this.querySelectorAll('.pill').forEach(function (x) { x.classList.remove('active'); });
  b.classList.add('active');
  var days = b.dataset.days;
  applyQuickDays(days === 'all' ? 'all' : parseInt(days, 10));
  state.start = $('dateStart').value;
  state.end = $('dateEnd').value;
  state.page = 1;
  refresh();
});

$('queryBtn').addEventListener('click', function () {
  var s = $('dateStart').value.trim();
  var e = $('dateEnd').value.trim();
  $('dateStart').classList.remove('err');
  $('dateEnd').classList.remove('err');

  if (s && !isValidDate(s)) { $('dateStart').classList.add('err'); showToast('开始日期请按 YYYY-MM-DD 填写'); return; }
  if (e && !isValidDate(e)) { $('dateEnd').classList.add('err'); showToast('结束日期请按 YYYY-MM-DD 填写'); return; }
  if (s && e && s > e) { $('dateEnd').classList.add('err'); showToast('开始日期不能晚于结束日期'); return; }

  state.start = s;
  state.end = e;
  syncStateFromUI();
  state.page = 1;
  refresh();
});

$('resetBtn').addEventListener('click', function () {
  $('dateStart').value = '';
  $('dateEnd').value = '';
  $('accId').value = '';
  $('corpName').value = '';
  $('account').value = '';
  $('catSel').value = '';
  $('pageSize').value = '20';
  $('quickTabs').querySelectorAll('.pill').forEach(function (x) {
    x.classList.toggle('active', x.dataset.days === '30');
  });
  state.start = '';
  state.end = '';
  state.page = 1;
  syncStateFromUI();
  applyQuickDays(30);
  state.start = $('dateStart').value;
  state.end = $('dateEnd').value;
  refresh();
});

$('corpName').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('queryBtn').click();
});
$('account').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('queryBtn').click();
});
$('accId').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('queryBtn').click();
});

$('pageSize').addEventListener('change', function () {
  syncStateFromUI();
  state.page = 1;
  refresh();
});

$('pagerBtns').addEventListener('click', function (e) {
  var b = e.target.closest('.pg');
  if (!b || b.disabled) return;
  var v = b.dataset.pg;
  if (v === 'prev') state.page -= 1;
  else if (v === 'next') state.page += 1;
  else state.page = parseInt(v, 10);
  renderTable(currentRows);
  document.querySelector('.tbl').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* 点公司名称 → 按该账户再筛一次；点账户 ID → 新窗口跳转客户详情页（不拦截） */
$('tbody').addEventListener('click', function (e) {
  if (e.target.closest('.acc-id-link')) return;
  var s = e.target.closest('.acc-name');
  if (!s) return;
  var id = s.dataset.acc;
  $('accId').value = id;
  $('corpName').value = '';
  $('account').value = '';
  state.accId = id;
  state.corpName = '';
  state.account = '';
  state.page = 1;
  refresh();
  showToast('已按账户 ' + id + ' 筛选');
});

/* 导出当前筛选结果 */
$('exportBtn').addEventListener('click', function () {
  if (!currentRows.length) { showToast('当前无数据可导出'); return; }
  var head = ['时间', '账户ID', '公司名称', '账户名称', '积分类型', '类型', '变动积分', '剩余积分', '关联企业', '操作IP'];
  var lines = [head.join(',')];
  currentRows.forEach(function (r) {
    lines.push([r.time, r.accId, r.corpName, r.account, CAT_NAME[r.cat] || '', r.typeName,
      (r.delta > 0 ? '+' : '') + r.delta, r.balance, r.ent, r.ip]
      .map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '积分流水明细_' + BASE_DAY + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  showToast('已导出 ' + currentRows.length + ' 条记录');
});

/* 初始化 */
applyQuickDays(30);
state.start = $('dateStart').value;
state.end = $('dateEnd').value;
refresh();
</script>
