<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企情分析-企业信息-中标分析</title>
<style>
@layer tokens, base, components;

@layer tokens {
  :root {
    --background: #ffffff;        --foreground: #333333;
    --primary: #2b7bff;           --primary-foreground: #ffffff;
    --secondary: #f4f4f5;         --secondary-foreground: #606266;
    --muted: #f5f7fa;             --muted-foreground: #999999;
    --accent: #ecf5ff;            --accent-foreground: #2b7bff;
    --destructive: #f56c6c;       --destructive-foreground: #ffffff;
    --border: #ebeef5;            --input: #dcdfe6;            --ring: #2b7bff;
    --radius-sm: 0.125rem; --radius-md: 0.25rem; --radius-lg: 0.5rem;
    --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgb(0 0 0 / .05);
  }
}

@layer base {
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #f0f3fa; color: var(--foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
}

@layer components {
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    white-space: nowrap; font-size: 0.875rem; font-weight: 500; font-family: var(--font-sans);
    line-height: 1; border-radius: var(--radius-md); border: 1px solid transparent;
    cursor: pointer; text-decoration: none; transition: all 150ms ease; outline: none;
    flex-shrink: 0; height: 2.25rem; padding: 0 1rem;
    background-color: var(--primary); color: var(--primary-foreground);
    & svg { pointer-events: none; flex-shrink: 0; &:not([class*="size-"]) { width: 1rem; height: 1rem; } }
    &:disabled, &[aria-disabled="true"] { pointer-events: none; opacity: 0.5; }
    &[data-variant="default"] { &:hover { opacity: 0.9; } }
    &[data-variant="secondary"] { background-color: var(--secondary); color: var(--secondary-foreground); &:hover { opacity: 0.8; } }
    &[data-variant="outline"] { background-color: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: var(--shadow-xs); &:hover { background-color: var(--accent); color: var(--accent-foreground); } }
    &[data-size="sm"] { height: 2rem; padding: 0 0.75rem; font-size: 0.8125rem; }
    &[data-size="xs"] { height: 1.75rem; padding: 0 0.5rem; font-size: 0.75rem; border-radius: var(--radius-sm); }
  }
  .badge {
    display: inline-flex; align-items: center; border-radius: 9999px;
    padding: 0.125rem 0.625rem; font-size: 0.6875rem; font-weight: 500; line-height: 1.5rem;
    &[data-variant="secondary"] { background: var(--secondary); color: var(--secondary-foreground); }
  }
  .input {
    height: 2.5rem; width: 100%; border: 1px solid var(--input); border-radius: var(--radius-md);
    background: var(--background); padding: 0 0.75rem; font-size: 0.875rem; font-family: var(--font-sans);
    color: var(--foreground); outline: none; box-shadow: var(--shadow-xs);
    &::placeholder { color: var(--muted-foreground); }
  }
}

/* ============ 通用外框（用户中心 sidebar-07，内联无外链） ============ */
:root {
  --sidebar: #fafafa; --sidebar-foreground: #333333;
  --sidebar-accent: #f0f0f0; --sidebar-accent-foreground: #202020;
  --sidebar-border: #e5e5e5;
  --sidebar-width: 16rem; --sidebar-width-icon: 3rem;
  --radius: 8px;
}
html, body { height: 100%; }
body { overflow: hidden; }
.app-shell { display: flex; height: 100vh; }
.sidebar {
  position: relative; width: var(--sidebar-width); min-width: var(--sidebar-width);
  background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column; transition: width .2s ease, min-width .2s ease;
}
.sidebar[data-state="collapsed"] { width: var(--sidebar-width-icon); min-width: var(--sidebar-width-icon); }
.sidebar-header { display: flex; align-items: center; padding: 0.5rem; border-bottom: 1px solid var(--sidebar-border); }
.sidebar-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0.5rem; scrollbar-width: thin; }
.sidebar-content::-webkit-scrollbar { width: 6px; }
.sidebar-content::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 3px; }
.sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
.sidebar-menu-button {
  display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 32px; padding: 0.5rem 0.75rem;
  border: none; border-radius: var(--radius); background: transparent; color: var(--sidebar-foreground);
  font-size: 14px; font-weight: 500; font-family: inherit; text-align: left; cursor: pointer; white-space: nowrap;
  transition: background .15s ease, color .15s ease;
}
.sidebar-menu-button:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.sidebar-menu-button.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 600; }
.sidebar-menu-button svg { width: 16px; height: 16px; flex-shrink: 0; }
.sidebar-menu-button-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sidebar-menu-button-chevron { margin-left: auto; width: 16px; height: 16px; flex-shrink: 0; color: #999999; transition: transform .2s ease; }
.sidebar-group-item[data-state="open"] > .sidebar-menu-button > .sidebar-menu-button-chevron { transform: rotate(90deg); }
.sidebar-menu-sub { display: none; flex-direction: column; gap: 1px; padding-left: 3rem; margin: 1px 0 3px; }
.sidebar-group-item[data-state="open"] > .sidebar-menu-sub { display: flex; }
.sidebar-menu-sub-item {
  display: flex; align-items: center; gap: 0.5rem; min-height: 30px; padding: 0 0.5rem; border-radius: var(--radius);
  color: var(--sidebar-foreground); font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background .15s ease, color .15s ease;
}
.sidebar-menu-sub-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.sidebar-menu-sub-item.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 600; }
.sidebar-footer { padding: 0.5rem; border-top: 1px solid var(--sidebar-border); }
.sidebar-footer .sidebar-menu-button { background: var(--sidebar-accent); border-radius: var(--radius); gap: 0.625rem; }
.sidebar-menu-button-avatar {
  width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius); background: #10b981; color: #ffffff; font-size: 13px; font-weight: 600;
}
.sidebar-menu-button-avatar svg { width: 16px; height: 16px; }
.sidebar-menu-button-avatar.user-avatar { border-radius: 50%; background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.sidebar-menu-button-text { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; line-height: 1.25; }
.sidebar-menu-button-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-menu-button-sub { font-size: 11.5px; color: #999999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-menu-button-chevrons { margin-left: auto; width: 16px; height: 16px; flex-shrink: 0; color: #999999; }
.sidebar-rail { position: absolute; top: 0; bottom: 0; left: 100%; width: 1px; margin-left: -1px; background: var(--sidebar-border); cursor: pointer; z-index: 10; transition: width .2s ease; }
.sidebar-rail:hover { width: 8px; }
.sidebar[data-state="collapsed"] .sidebar-header { padding: 0.5rem 0.25rem; }
.sidebar[data-state="collapsed"] .sidebar-menu-button { justify-content: center; padding: 0.5rem; }
.sidebar[data-state="collapsed"] .sidebar-menu-button-label,
.sidebar[data-state="collapsed"] .sidebar-menu-button-text,
.sidebar[data-state="collapsed"] .sidebar-menu-button-chevrons,
.sidebar[data-state="collapsed"] .sidebar-menu-button-chevron,
.sidebar[data-state="collapsed"] .sidebar-menu-sub { display: none; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main-header { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem; background: #ffffff; border-bottom: 1px solid var(--border); }
.sidebar-trigger { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: var(--radius); background: transparent; color: #999999; cursor: pointer; }
.sidebar-trigger:hover { background: var(--accent); color: var(--accent-foreground); }
.sidebar-trigger svg { width: 16px; height: 16px; }
.header-separator { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
.breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; color: #999999; }
.breadcrumb-separator { color: #999999; }
.breadcrumb-current { color: #333333; font-weight: 500; }
.content { flex: 1; display: flex; flex-direction: column; padding: 20px 24px; min-height: 0; }
.content-scroll { flex: 1; min-height: 0; overflow-y: auto; background: #f0f3fa; }
.placeholder-view { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; color: #999999; text-align: center; }
.placeholder-view svg { width: 56px; height: 56px; stroke-width: 1.2; color: #dcdfe6; }
.placeholder-view h3 { font-size: 17px; font-weight: 600; color: #333333; margin: 0; }
.placeholder-view p { font-size: 13px; margin: 0; }

/* ============ page ============ */
.page { max-width: 1400px; margin: 0 auto; padding-top: 12px; }
.crumb { padding: 10px 4px; font-size: 13px; color: #909399; }
.crumb b { color: #2b7bff; font-weight: 500; }
.crumb .sep { margin: 0 6px; color: #c0c4cc; }

.channel-bar { background: #e4edfb; display: flex; gap: 4px; overflow: hidden; }
.channel-tab {
  width: 132px; height: 46px; display: flex; align-items: center; justify-content: center;
  transform: skewX(-18deg); cursor: pointer; border: none; font-family: var(--font-sans);
  font-size: 16px; font-weight: 500; background: #d5e5fb; color: #2b7bff;
}
.channel-tab > span { transform: skewX(18deg); }
.channel-tab.active { background: linear-gradient(180deg, #6ba1f5 0%, #4d8bf0 100%); color: #ffffff; }

.card { background: #ffffff; border: 1px solid #ebeef5; border-top: none; }

.co-head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 32px 18px; }
.co-icon { width: 52px; height: 52px; border-radius: 6px; background: #d8e6fd; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.co-name { font-size: 22px; font-weight: 600; color: #333333; margin: 2px 0 0; }
.co-tags { margin-top: 10px; }
.badge[data-variant="tag-blue"] { background: #e8f1ff; color: #409eff; border-radius: 2px; padding: 0 8px; font-size: 12px; line-height: 20px; font-weight: 400; }
.co-actions { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.co-btns { display: flex; gap: 12px; }
.btn-orange { background: linear-gradient(90deg, #ff8f3c 0%, #ff5000 100%); color: #fff; }
.btn-orange:hover { opacity: 0.92; }
.btn-monitor { background: #d6e4ff; color: #2b7bff; }
.co-update { display: inline-flex; align-items: center; gap: 5px; color: #999999; font-size: 12px; }

.base-panel { margin: 0 32px; background: #f4f6fb; border-radius: 4px; padding: 20px 28px; position: relative; }
.base-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 60px; font-size: 14px; }
.base-item .k { color: #999999; }
.base-item .v { color: #333333; margin-left: 6px; }
.base-item .v a { color: #2b7bff; text-decoration: none; margin-left: 10px; font-size: 13px; }
.base-tools { position: absolute; top: 16px; right: 24px; display: flex; align-items: center; gap: 14px; }
.copy-link { color: #2b7bff; font-size: 13px; text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); }
.follow-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; color: #666666; font-size: 14px; font-family: var(--font-sans); cursor: pointer; }
.follow-btn.on { color: #2b7bff; }
.follow-btn.on svg { fill: currentColor; }

.main-nav { display: flex; gap: 64px; padding: 0 32px; margin-top: 22px; border-bottom: 1px solid #ebeef5; }
.main-nav a { position: relative; display: inline-flex; align-items: center; height: 54px; color: #333333; font-size: 16px; font-weight: 600; text-decoration: none; }
.main-nav a.active { color: #2b7bff; }
.main-nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #2b7bff; }
.nav-badge { position: absolute; top: 6px; right: -34px; background: #f5484d; color: #ffffff; font-size: 10px; font-weight: 400; line-height: 16px; padding: 0 6px; border-radius: 3px; white-space: nowrap; }

/* filter row */
.filter-row { display: flex; gap: 12px; padding: 18px 32px 0; }
.kw-box { position: relative; width: 220px; }
.kw-box .input { height: 34px; font-size: 13px; padding-right: 30px; }
.kw-box svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #c0c4cc; }
.range-box {
  display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
  border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; font-size: 13px; color: #606266; cursor: pointer;
}
.range-box .lab { color: #333333; }

/* stats band */
.stats-band {
  margin: 16px 32px 0; background: #e8f1fd; border-radius: 6px;
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 26px 8px 22px;
}
.stat { text-align: center; }
.stat .num { font-size: 30px; font-weight: 700; color: #333333; line-height: 1; }
.stat .unit { font-size: 13px; font-weight: 500; color: #333333; margin-left: 2px; }
.stat .lab { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #606266; }
.stat .ico { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.help { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #c0c4cc; color: #909399; font-size: 10px; cursor: help; flex-shrink: 0; }

/* charts */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 32px 32px; }
.chart-card { border: 1px solid #ebeef5; border-radius: 8px; background: #fff; padding: 16px 18px 14px; position: relative; }
.chart-head { display: flex; align-items: center; gap: 8px; }
.chart-title { font-size: 15px; font-weight: 600; color: #333333; }
.chart-title .q { color: #f5484d; }
.chart-tools { margin-left: auto; display: flex; gap: 8px; }
.tool-btn {
  height: 28px; padding: 0 14px; border-radius: 4px; border: 1px solid #dcdfe6; background: #f4f4f5;
  color: #606266; font-size: 12px; font-family: var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.tool-btn.active { background: #2b7bff; border-color: #2b7bff; color: #fff; }
.tool-btn.plain { background: #fff; }
.tool-btn:hover { color: #2b7bff; border-color: #2b7bff; }
.tool-btn.active:hover { color: #fff; }
.chart-body { margin-top: 10px; }
.chart-body svg { width: 100%; height: auto; display: block; }
.zoom-bar { height: 12px; border-radius: 6px; background: #dce8fb; margin: 8px 4px 2px; position: relative; }
.zoom-bar::after { content: ""; position: absolute; left: 46%; top: 3px; width: 10px; height: 6px; border-radius: 2px; background: #b9cdf2; }
.map-legend { position: absolute; left: 26px; bottom: 40px; font-size: 11px; color: #606266; }
.map-legend .bar { width: 10px; height: 90px; margin: 6px auto; border-radius: 2px; background: linear-gradient(180deg, #2b6de8 0%, #dfe9fb 100%); }
.map-legend .t { text-align: center; }

/* tooltip */
.tip {
  position: fixed; z-index: 60; pointer-events: none; background: #ffffff; border: 1px solid #ebeef5;
  box-shadow: 0 4px 16px rgba(31, 45, 61, 0.15); border-radius: 4px; padding: 8px 14px;
  font-size: 13px; color: #606266; opacity: 0; transition: opacity .12s;
}
.tip.show { opacity: 1; }
.tip .t1 { color: #333333; font-weight: 600; margin-bottom: 4px; }
.tip .t2 b { color: #2b7bff; font-weight: 600; }

.back-top {
  position: fixed; right: 60px; bottom: 100px; width: 56px; height: 56px; border-radius: 50%;
  background: #ffffff; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(31, 45, 61, 0.15);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; z-index: 50;
}
.back-top.show { opacity: 1; visibility: visible; }

/* 版本徽标 */
.version-badge { position: fixed; right: 16px; bottom: 14px; z-index: 40; font-size: 11px; color: #999; background: rgba(255,255,255,.8); border: 1px solid #ebeef5; border-radius: 999px; padding: 2px 10px; letter-spacing: .5px; user-select: none; }
</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ Sidebar（sidebar-07，内联通用外框） ============ -->
  <aside class="sidebar" id="sidebar" data-state="collapsed">
    <div class="sidebar-header">
      <div class="sidebar-menu-button">
        <span class="sidebar-menu-button-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/><path d="M3 21h18"/></svg>
        </span>
        <span class="sidebar-menu-button-text">
          <span class="sidebar-menu-button-name">采招网</span>
          <span class="sidebar-menu-button-sub">www.bidcenter.com.cn</span>
        </span>
      </div>
    </div>

    <div class="sidebar-content">
      <div class="sidebar-menu">

        <!-- 企情分析（当前页所在组） -->
        <div class="sidebar-group-item" data-state="open">
          <button class="sidebar-menu-button" data-view="placeholder" data-title="企情分析" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
            <span class="sidebar-menu-button-label">企情分析</span>
            <svg class="sidebar-menu-button-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
          <div class="sidebar-menu-sub">
            <a class="sidebar-menu-sub-item active" href="#" data-view="analysis" data-title="中标分析">中标分析</a>
            <a class="sidebar-menu-sub-item" href="#" data-view="placeholder" data-title="企业概览">企业概览</a>
          </div>
        </div>

        <!-- 工作台 -->
        <button class="sidebar-menu-button" data-view="placeholder" data-title="工作台" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="sidebar-menu-button-label">工作台</span>
        </button>

        <!-- 订阅中心 -->
        <div class="sidebar-group-item" data-state="open">
          <button class="sidebar-menu-button" data-view="placeholder" data-title="订阅中心" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
            <span class="sidebar-menu-button-label">订阅中心</span>
            <svg class="sidebar-menu-button-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
          <div class="sidebar-menu-sub">
            <a class="sidebar-menu-sub-item" href="#" data-view="placeholder" data-title="订阅信息">订阅信息</a>
            <a class="sidebar-menu-sub-item" href="#" data-view="placeholder" data-title="订阅管理">订阅管理</a>
          </div>
        </div>

        <!-- 收藏中心 -->
        <div class="sidebar-group-item" data-state="open">
          <button class="sidebar-menu-button" data-view="placeholder" data-title="收藏中心" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="sidebar-menu-button-label">收藏中心</span>
            <svg class="sidebar-menu-button-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
          <div class="sidebar-menu-sub">
            <a class="sidebar-menu-sub-item" href="#" data-view="placeholder" data-title="商机收藏">商机收藏</a>
          </div>
        </div>

        <!-- 追踪与监控 -->
        <div class="sidebar-group-item" data-state="open">
          <button class="sidebar-menu-button" data-view="placeholder" data-title="追踪与监控" type="button">

<script>
(function () {
  'use strict';

  var D = JSON.parse(document.getElementById('analysis-data').textContent);
  var BLUE = '#3d7ef0';

  function esc(s) { return String(s == null ? '--' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  /* ---------- header ---------- */
  document.getElementById('co-name').textContent = D.company.name;
  document.getElementById('co-status').textContent = D.company.status;
  document.getElementById('co-update').textContent = D.company.update + '更新';
  document.getElementById('base-grid').innerHTML = [

  ].map(function (it) {
    return '<div class="base-item"><span class="k">' + it[0] + '：</span><span class="v">' + it[1] + '</span></div>';
  }).join('');

  /* ---------- stats ---------- */
  document.getElementById('stats-band').innerHTML = D.stats.map(function (s) {
    return '<div class="stat"><div><span class="num">' + s.num + '</span><span class="unit">' + s.unit + '</span></div>' +
      '<span class="lab"><span class="ico" style="background:' + s.color + '">' + s.glyph + '</span>' + s.label + '<span class="help">?</span></span></div>';
  }).join('');

  /* ---------- tooltip ---------- */
  var tip = document.getElementById('tip');
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.classList.add('show');
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(x + 14, window.innerWidth - w - 8);
    var top = Math.max(8, y - h - 12);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }
  function bindTips(root) {
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) { showTip(el.dataset.tip, e.clientX, e.clientY); });
      el.addEventListener('mouseleave', hideTip);
    });
  }
  function tipHTML(lines) {
    return '<div class="t1">' + lines[0] + '</div>' + lines.slice(1).map(function (l) { return '<div class="t2">' + l + '</div>'; }).join('');
  }

  /* ---------- state ---------- */
  var state = { map: 'count', top10: 'count', line: 'month', bar: 'month' };

  function fmtAmount(v) { return v >= 10000 ? (v / 10000).toFixed(2) + '亿元' : v + '万元'; }

  /* ---------- china outline (lon/lat) ---------- */
  var OUTLINE = [
    [73.5,39.5],[75,40.5],[76,41.5],[80,42.5],[80.5,45],[82.5,45.5],[83,47],[85.5,47],[87,49],[90,48.5],

    [115.5,48.5],[117,49.5],[120,50],[122,51.5],[125,53],[127,50.5],[130,48.5],[134,48],[131,45],[131,42.5],
    [128,41.5],[124.5,40],[121.5,39.5],[121,37.5],[119,37],[120,36],[122,37],[121.5,34.5],[120,33.5],[122,31],
    [121,29.5],[120,27.5],[119,25.5],[116,23],[113,22],[110,21.5],[108,21.5],[106,22.5],[103,22.5],[101,21.5],
    [99,22.5],[97.5,24],[98,25.5],[97.5,27.5],[96,29],[92,27.5],[89,28],[85,28.5],[81,30],[79,31.5],[78,34],
    [76,36],[73.5,39.5]
  ];
  var MW = 640, MH = 430;
  function px(lon) { return (lon - 73) * (MW / 62); }
  function py(lat) { return (53.5 - lat) * (MH / 36); }

  function colorScale(t) {
    /* #dfe9fb -> #2b6de8 */
    var a = [223, 233, 251], b = [43, 109, 232];
    var c = a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); });
    return 'rgb(' + c.join(',') + ')';
  }

  /* ---------- map ---------- */
  function renderMap() {
    var mode = state.map;
    var vals = D.provinces.map(function (p) { return mode === 'count' ? p.count : p.amount; });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    var path = OUTLINE.map(function (pt, i) { return (i ? 'L' : 'M') + px(pt[0]).toFixed(1) + ' ' + py(pt[1]).toFixed(1); }).join(' ') + ' Z';
    var svg = '<svg viewBox="0 0 ' + MW + ' ' + MH + '" role="img" aria-label="中标地区分布图">';
    svg += '<path d="' + path + '" fill="#eef3fc" stroke="#c9d8f2" stroke-width="1"/>';
    svg += '<ellipse cx="' + px(121.0).toFixed(1) + '" cy="' + py(23.8).toFixed(1) + '" rx="7" ry="12" fill="#eef3fc" stroke="#c9d8f2" transform="rotate(18 ' + px(121.0).toFixed(1) + ' ' + py(23.8).toFixed(1) + ')"/>';
    D.provinces.forEach(function (p) {
      var v = mode === 'count' ? p.count : p.amount;
      var t = max === min ? 1 : (v - min) / (max - min);
      var r = 5 + Math.sqrt(v / max) * 16;
      var unit = mode === 'count' ? '次' : '万元';
      var tip = tipHTML([p.name, (mode === 'count' ? '中标次数： <b>' + v + '次</b>' : '中标金额： <b>' + fmtAmount(v) + '</b>')]);
      svg += '<circle cx="' + px(p.lon).toFixed(1) + '" cy="' + py(p.lat).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + colorScale(0.15 + t * 0.85) + '" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" data-tip="' + escAttr(tip) + '"><title>' + esc(p.name) + '</title></circle>';
    });
    svg += '</svg>';
    var box = document.getElementById('map-body');
    box.innerHTML = svg;
    document.getElementById('map-legend').innerHTML =
      '<div class="t">数量（' + (mode === 'count' ? '次' : '万元') + '）</div><div class="t">' + max + '</div><div class="bar"></div><div class="t">' + min + '</div>';
    bindTips(box);
  }

  /* ---------- top10 bars ---------- */
  function renderTop10() {
    var mode = state.top10;
    document.getElementById('top10-metric').textContent = mode === 'count' ? '次数' : '金额';
    var rows = D.provinces.slice().sort(function (a, b) { return (mode === 'count' ? b.count - a.count : b.amount - a.amount); }).slice(0, 10);
    var vals = rows.map(function (p) { return mode === 'count' ? p.count : p.amount; });
    var max = Math.max.apply(null, vals);
    var step = mode === 'count' ? 10 : 10000;
    var top = Math.ceil(max / step) * step;
    var W = 640, H = 360, L = 56, R = 12, T = 30, Bm = 40;
    var iw = W - L - R, ih = H - T - Bm;
    var total = D.provinces.reduce(function (s, p) { return s + (mode === 'count' ? p.count : p.amount); }, 0);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="中标TOP10">';
    svg += '<text x="' + L + '" y="16" font-size="12" fill="#606266">' + (mode === 'count' ? '次数' : '金额（万元）') + '</text>';
    for (var v = 0; v <= top; v += step) {
      var y = T + ih - (v / top) * ih;
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#ebeef5"/>';
      svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#909399" text-anchor="end">' + v + '</text>';
    }
    var bw = iw / rows.length;
    rows.forEach(function (p, i) {
      var v = mode === 'count' ? p.count : p.amount;
      var h = (v / top) * ih;
      var x = L + i * bw + bw / 2 - 13;
      var share = (v / total * 100).toFixed(2) + '%';
      var tip = tipHTML([p.name, (mode === 'count' ? '中标次数： ' + v + '次' : '中标金额： ' + fmtAmount(v)), '占比： ' + share]);
      svg += '<rect x="' + x.toFixed(1) + '" y="' + (T + ih - h).toFixed(1) + '" width="26" height="' + h.toFixed(1) + '" fill="' + BLUE + '" data-tip="' + escAttr(tip) + '"><title>' + esc(p.name) + '</title></rect>';
      svg += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 16) + '" font-size="12" fill="#606266" text-anchor="middle">' + p.name + '</text>';
    });
    svg += '</svg>';
    var box = document.getElementById('top10-body');
    box.innerHTML = svg;
    bindTips(box);
  }

  /* ---------- quarter aggregate ---------- */
  function quarters() {
    var q = [{ label: '2025-Q4', c: 0, a: 0 }, { label: '2026-Q1', c: 0, a: 0 }, { label: '2026-Q2', c: 0, a: 0 }, { label: '2026-Q3', c: 0, a: 0 }, { label: '2026-Q4', c: 0, a: 0 }];
    D.months.forEach(function (m, i) {
      var idx = m === '2025-11' || m === '2025-12' ? 0 : m <= '2026-03' ? 1 : m <= '2026-06' ? 2 : m <= '2026-09' ? 3 : 4;
      q[idx].c += D.monthCount[i];
      q[idx].a += D.monthAmount[i];
    });
    return q;
  }

  /* ---------- line chart ---------- */
  function renderLine() {
    var mode = state.line;
    var labels, vals;
    if (mode === 'month') { labels = D.months; vals = D.monthCount; }
    else { var q = quarters(); labels = q.map(function (x) { return x.label; }); vals = q.map(function (x) { return x.c; }); }
    var W = 640, H = 340, L = 52, R = 16, T = 30, Bm = 36;
    var iw = W - L - R, ih = H - T - Bm;
    var max = Math.max.apply(null, vals);
    var top = Math.ceil(max / 20) * 20 || 20;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="中标项目分布">';
    svg += '<text x="' + L + '" y="16" font-size="12" fill="#606266">数量（条）</text>';
    for (var v = 0; v <= top; v += 20) {
      var y = T + ih - (v / top) * ih;
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#ebeef5"/>';
      svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#909399" text-anchor="end">' + v + '</text>';
    }
    var pts = vals.map(function (v, i) {
      var x = L + (vals.length === 1 ? iw / 2 : i * (iw / (vals.length - 1)));
      var y = T + ih - (v / top) * ih;
      return [x, y];
    });
    svg += '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="' + BLUE + '" stroke-width="2.5"/>';
    var every = mode === 'month' ? 2 : 1;
    pts.forEach(function (p, i) {
      var tip = tipHTML([labels[i], '中标次数： ' + vals[i] + '条']);
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="#ffffff" stroke="' + BLUE + '" stroke-width="2" data-tip="' + escAttr(tip) + '"><title>' + esc(labels[i]) + '</title></circle>';
      if (i % every === 0) svg += '<text x="' + p[0].toFixed(1) + '" y="' + (H - 12) + '" font-size="11" fill="#606266" text-anchor="middle">' + labels[i] + '</text>';
    });
    svg += '</svg>';
    var box = document.getElementById('line-body');
    box.innerHTML = svg;
    bindTips(box);
  }

  /* ---------- amount bars ---------- */
  function renderBar() {
    var mode = state.bar;
    var labels, vals;
    if (mode === 'month') { labels = D.months; vals = D.monthAmount; }
    else { var q = quarters(); labels = q.map(function (x) { return x.label; }); vals = q.map(function (x) { return x.a; }); }
    var W = 640, H = 340, L = 60, R = 16, T = 30, Bm = 36;
    var iw = W - L - R, ih = H - T - Bm;
    var max = Math.max.apply(null, vals);
    var step = 10000;
    var top = Math.max(step, Math.ceil(max / step) * step);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="中标金额分布">';
    svg += '<text x="' + L + '" y="16" font-size="12" fill="#606266">金额（万元）</text>';
    for (var v = 0; v <= top; v += step) {
      var y = T + ih - (v / top) * ih;
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#ebeef5"/>';
      svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#909399" text-anchor="end">' + v + '</text>';
    }
    var bw = iw / vals.length;
    vals.forEach(function (v, i) {
      var h = (v / top) * ih;
      var x = L + i * bw + bw / 2 - 11;
      var tip = tipHTML([labels[i], '中标金额： ' + fmtAmount(v)]);
      if (h > 0) svg += '<rect x="' + x.toFixed(1) + '" y="' + (T + ih - h).toFixed(1) + '" width="22" height="' + h.toFixed(1) + '" fill="' + BLUE + '" data-tip="' + escAttr(tip) + '"><title>' + esc(labels[i]) + '</title></rect>';
      var every = mode === 'month' ? 2 : 1;
      if (i % every === 0) svg += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 12) + '" font-size="11" fill="#606266" text-anchor="middle">' + labels[i] + '</text>';
    });
    svg += '</svg>';
    var box = document.getElementById('bar-body');
    box.innerHTML = svg;
    bindTips(box);
  }

  function renderAll() { renderMap(); renderTop10(); renderLine(); renderBar(); }
  renderAll();

  /* ---------- toggles ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.tool-btn[data-chart]');
    if (b) {
      var chart = b.dataset.chart;
      state[chart] = b.dataset.mode;
      b.parentElement.querySelectorAll('.tool-btn[data-chart]').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      renderAll();
      return;
    }
    var dl = e.target.closest('.tool-btn[data-dl]');
    if (dl) {
      var kind = dl.dataset.dl;
      var rows = [];
      if (kind === 'map' || kind === 'top10') {
        rows.push(['地区', '中标次数', '中标金额(万元)']);
        D.provinces.forEach(function (p) { rows.push([p.name, p.count, p.amount]); });
      } else if (kind === 'line') {
        rows.push(['月份', '中标次数']);
        D.months.forEach(function (m, i) { rows.push([m, D.monthCount[i]]); });
      } else {
        rows.push(['月份', '中标金额(万元)']);
        D.months.forEach(function (m, i) { rows.push([m, D.monthAmount[i]]); });
      }
      var csv = '\ufeff' + rows.map(function (r) { return r.join(','); }).join('\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = '中标分析-' + kind + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  });

  /* ---------- misc ---------- */
  document.getElementById('follow-btn').addEventListener('click', function () {
    this.classList.toggle('on');
    this.querySelector('span').textContent = this.classList.contains('on') ? '已关注' : '关注';
  });
  document.getElementById('copy-btn').addEventListener('click', function () {
    var c = D.company;
    var txt = ['公司名称：' + c.name, '法人：' + c.legal, '注册资本：' + c.capital, '联系电话：' + c.phone, '地址：' + c.address].join('\n');
    var done = function () { alert('企业信息已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
    else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
  });

  var backTop = document.getElementById('back-top');
  var scroller = document.getElementById('contentScroll');
  scroller.addEventListener('scroll', function () { backTop.classList.toggle('show', scroller.scrollTop > 300); }, { passive: true });
  backTop.addEventListener('click', function () { scroller.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>

<!-- 通用外框交互：侧边栏折叠 / 菜单切换视图 -->
<script>
(function () {
  var sidebar = document.getElementById('sidebar');
  function toggleSidebar() {
    var c = sidebar.getAttribute('data-state') === 'collapsed';
    sidebar.setAttribute('data-state', c ? 'expanded' : 'collapsed');
  }
  document.getElementById('sidebarRail').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarTrigger').addEventListener('click', toggleSidebar);

  var viewA = document.getElementById('viewAnalysis');
  var viewP = document.getElementById('placeholderView');
  var bc = document.getElementById('breadcrumbCurrent');

  function nav(el) {
    document.querySelectorAll('.sidebar-menu-button.active, .sidebar-menu-sub-item.active').forEach(function (n) { n.classList.remove('active'); });
    el.classList.add('active');
    if (el.classList.contains('sidebar-menu-sub-item')) {
      var w = el.closest('.sidebar-group-item');
      if (w) { var pb = w.querySelector(':scope > .sidebar-menu-button'); if (pb) pb.classList.add('active'); }
    }
    bc.textContent = el.getAttribute('data-title') || el.textContent.trim();
    var v = el.getAttribute('data-view');
    viewA.style.display = (v === 'analysis') ? '' : 'none';
    viewP.style.display = (v === 'analysis') ? 'none' : 'flex';
    document.getElementById('contentScroll').scrollTop = 0;
  }

  document.querySelectorAll('.sidebar-menu button.sidebar-menu-button').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      var w = item.closest('.sidebar-group-item');
      if (w && sidebar.getAttribute('data-state') !== 'collapsed') {
        w.setAttribute('data-state', w.getAttribute('data-state') === 'open' ? 'closed' : 'open');
      }
      nav(item);
    });
  });
  document.querySelectorAll('.sidebar-menu-sub-item').forEach(function (leaf) {
    leaf.addEventListener('click', function (e) { e.preventDefault(); nav(leaf); });
  });
})();
</script>
