<style>
@layer tokens, base, components;

@layer tokens {
  :root {
    --background: #ffffff;        --foreground: #333333;
    --card: #ffffff;              --card-foreground: #333333;
    --popover: #ffffff;           --popover-foreground: #333333;
    --primary: #2b7bff;           --primary-foreground: #ffffff;
    --secondary: #f4f4f5;         --secondary-foreground: #606266;
    --muted: #f5f7fa;             --muted-foreground: #999999;
    --accent: #ecf5ff;            --accent-foreground: #2b7bff;
    --destructive: #f56c6c;       --destructive-foreground: #ffffff;
    --border: #ebeef5;            --input: #dcdfe6;            --ring: #2b7bff;
    --radius-sm: 0.125rem; --radius-md: 0.25rem; --radius-lg: 0.5rem; --radius-xl: 0.75rem;
    --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgb(0 0 0 / .05);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1);
  }
}

@layer base {
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f0f3fa;
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
}

/* ==== library component CSS: button ==== */
@layer components {
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    white-space: nowrap; font-size: 0.875rem; font-weight: 500; font-family: var(--font-sans);
    line-height: 1; border-radius: var(--radius-md); border: 1px solid transparent;
    cursor: pointer; text-decoration: none; transition: all 150ms ease; outline: none;
    flex-shrink: 0; height: 2.25rem; padding: 0 1rem;
    background-color: var(--primary); color: var(--primary-foreground);
    & svg { pointer-events: none; flex-shrink: 0; &:not([class*="size-"]) { width: 1rem; height: 1rem; } }
    &:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    &:disabled, &[aria-disabled="true"] { pointer-events: none; opacity: 0.5; }
    &[data-variant="default"] { background-color: var(--primary); color: var(--primary-foreground); &:hover { opacity: 0.9; } }
    &[data-variant="secondary"] { background-color: var(--secondary); color: var(--secondary-foreground); &:hover { opacity: 0.8; } }
    &[data-variant="outline"] { background-color: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: var(--shadow-xs); &:hover { background-color: var(--accent); color: var(--accent-foreground); } }
    &[data-variant="ghost"] { background-color: transparent; color: var(--foreground); border-color: transparent; &:hover { background-color: var(--accent); color: var(--accent-foreground); } }
    &[data-variant="link"] { background-color: transparent; color: var(--primary); height: auto; padding: 0; text-underline-offset: 4px; &:hover { text-decoration: underline; } }
    &[data-size="xs"] { height: 1.75rem; padding: 0 0.5rem; font-size: 0.75rem; border-radius: var(--radius-sm); }
    &[data-size="sm"] { height: 2rem; padding: 0 0.75rem; font-size: 0.8125rem; }
    &[data-size="lg"] { height: 2.75rem; padding: 0 2rem; font-size: 1rem; }
    &[data-size="icon"] { height: 2.25rem; width: 2.25rem; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
}

/* ==== library component CSS: badge ==== */
@layer components {
  .badge {
    display: inline-flex; align-items: center; border-radius: 9999px;
    padding: 0.125rem 0.625rem; font-size: 0.6875rem; font-weight: 500;
    letter-spacing: 0.01em; line-height: 1.5rem;
    &[data-variant="outline"] { border: 1px solid var(--border); color: var(--muted-foreground); }
    &[data-variant="secondary"] { background: var(--secondary); color: var(--secondary-foreground); }
    &[data-variant="default"] { background: var(--primary); color: var(--primary-foreground); }
  }
}

/* ==== library component CSS: input ==== */
@layer components {
  .input {
    height: 2.5rem; width: 100%; border: 1px solid var(--input); border-radius: var(--radius-md);
    background: var(--background); padding: 0 0.75rem; font-size: 0.875rem; font-family: var(--font-sans);
    color: var(--foreground); outline: none; box-shadow: var(--shadow-xs);
    transition: border-color 150ms, box-shadow 150ms;
    &:focus { border-color: var(--ring); box-shadow: 0 0 0 2px oklch(from var(--ring) l c h / 0.2); }
    &::placeholder { color: var(--muted-foreground); }
    &:disabled { opacity: 0.5; cursor: not-allowed; }
  }
}

/* ============ page-level (unlayered) ============ */
.page { max-width: 1600px; margin: 0 auto; padding: 20px; }

/* top channel tabs (skewed) */
.channel-bar { background: #e4edfb; display: flex; gap: 0; padding: 0 20px 0 15px; overflow: visible; border-radius: 7px 7px 0 0; }
.channel-tab {
  width: 132px; height: 46px; display: flex; align-items: center; justify-content: center;
  transform: skewX(-18deg); cursor: pointer; border: none; font-family: var(--font-sans);
  font-size: 16px; font-weight: 500; background: #d5e5fb; color: #2b7bff; box-shadow: 3px 0 0 0 #e4edfb;
}
.channel-tab > span { transform: skewX(18deg); }
.channel-tab.active { background: linear-gradient(180deg, #6ba1f5 0%, #4d8bf0 100%); color: #ffffff; }

.card { background: #ffffff; border: 1px solid #ebeef5; border-radius: 8px; }

/* company header */
.co-head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 32px 18px; position: relative; }
.co-icon {
  width: 52px; height: 52px; border-radius: 6px; background: #d8e6fd; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.co-name { font-size: 22px; font-weight: 600; color: #333333; margin: 2px 0 0; }
.co-tags { margin-top: 10px; }
.badge[data-variant="tag-blue"] { background: #e8f1ff; color: #409eff; border-radius: 2px; padding: 0 8px; font-size: 12px; line-height: 20px; font-weight: 400; }
.co-actions { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.co-btns { display: flex; gap: 12px; }
.btn-orange { background: linear-gradient(90deg, #ff8f3c 0%, #ff5000 100%); color: #fff; }
.btn-orange:hover { opacity: 0.92; }
.btn-monitor { background: #d6e4ff; color: #2b7bff; }
.btn-monitor:hover { opacity: 0.88; }
.co-update { display: inline-flex; align-items: center; gap: 5px; color: #999999; font-size: 12px; }

/* base info panel */
.base-panel { margin: 0 32px; background: #f4f6fb; border-radius: 4px; padding: 20px 28px; position: relative; }
.base-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 60px; font-size: 14px; }
.base-item .k { color: #999999; }
.base-item .v { color: #333333; margin-left: 6px; }
.base-item .v a { color: #2b7bff; text-decoration: none; margin-left: 10px; font-size: 13px; }
.base-item .v a:hover { text-decoration: underline; }
.base-tools { position: absolute; top: 16px; right: 24px; display: flex; align-items: center; gap: 14px; }
.copy-link { color: #2b7bff; font-size: 13px; text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); }
.copy-link:hover { text-decoration: underline; }
.follow-btn {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0;
  color: #666666; font-size: 14px; font-family: var(--font-sans); cursor: pointer;
}
.follow-btn:hover { color: #2b7bff; }
.follow-btn.on { color: #2b7bff; }
.follow-btn.on svg { fill: currentColor; }

/* main nav tabs */
.main-nav { display: flex; gap: 64px; padding: 0 32px; margin-top: 22px; border-bottom: 1px solid #ebeef5; }
.main-nav a { position: relative; display: inline-flex; align-items: center; height: 54px; color: #333; font: 600 16px var(--font-sans); text-decoration: none; }
.main-nav a.active { color: #0063FF; }
.main-nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #0063FF; }
.nav-badge { position: absolute; top: 6px; right: -34px; background: #f5484d; color: #fff; font: 400 10px/16px var(--font-sans); padding: 0 6px; border-radius: 3px; }

/* sub pills */
.pill-bar { display: flex; flex-wrap: wrap; gap: 12px; padding: 18px 32px; background: #ffffff; }
.pill {
  height: 32px; padding: 0 16px; border-radius: 4px; border: 1px solid #dcdfe6; background: #ffffff;
  color: #606266; font-size: 13px; font-family: var(--font-sans); cursor: pointer;
}
.pill:hover { color: #2b7bff; border-color: #2b7bff; }
.pill.active { background: #2b7bff; border-color: #2b7bff; color: #ffffff; }
.pill.disabled { background: #f4f4f5; border-color: #f4f4f5; color: #c0c4cc; cursor: not-allowed; }
.pill.disabled:hover { color: #c0c4cc; border-color: #f4f4f5; }

/* sections */
.section { padding: 6px 32px 26px; background: #ffffff; }
.sec-title {
  font-size: 14px; font-weight: 600; color: #333333; margin: 0 0 14px;
  padding-left: 8px; border-left: 3px solid #2b7bff; line-height: 16px;
}
.sec-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.sec-head .sec-title { margin: 0; }
.ad-banner { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; }
.ad-banner .ad-logo { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: #333333; font-size: 15px; }
.ad-banner a { color: #2b7bff; text-decoration: none; }
.ad-banner a:hover { text-decoration: underline; }
.cert-search { position: relative; width: 200px; flex-shrink: 0; }
.cert-search .input { height: 32px; font-size: 12px; padding-right: 28px; }
.cert-search svg { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #c0c4cc; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.tbl th, .tbl td { border: 1px solid #ebeef5; padding: 10px 12px; text-align: center; color: #606266; word-break: break-all; }
.tbl th { background: #f4f6fb; color: #333333; font-weight: 500; }
.tbl tbody tr:hover td { background: #e8f1fd; }
.tbl td.left { text-align: left; }
.tbl-kv th { width: 12.5%; }
.tbl-kv td { text-align: left; color: #606266; }
.tbl .empty-row td { text-align: center; color: #999999; padding: 30px 0; }
.tbl .empty-row:hover td { background: transparent; }
.detail-btn {
  background: #d6e4ff; color: #2b7bff; border: none; border-radius: 3px;
  font-size: 12px; line-height: 24px; padding: 0 14px; cursor: pointer; font-family: var(--font-sans);
}
.detail-btn:hover { background: #c3d9ff; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 14px; }
.pager-total { font-size: 13px; color: #666666; }
.pagination { display: flex; justify-content: flex-end; }
.pagination-list { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; }
.pagination-list a {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 32px; height: 32px; padding: 0 8px;
  border: 1px solid #dcdfe6; border-radius: 4px; background: #ffffff;
  color: #606266; font-size: 13px; text-decoration: none;
}
.pagination-list a:hover { border-color: #2b7bff; color: #2b7bff; }
.pagination-list a.pag-text { background: #f4f4f5; border-color: #f4f4f5; padding: 0 12px; }
.pagination-list a.pag-text:hover { color: #2b7bff; }
.pagination-list a.pagination-active { border-color: #2b7bff; color: #2b7bff; font-weight: 500; }
.pagination-list a[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
.pagination-ellipsis { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: #909399; }
.link-cell { color: #2b7bff; text-decoration: none; }

/* 次数解锁弹窗（白底蓝按钮，照原站截图；遮罩只盖锁定内容区域，不遮盖整个页面） */
.lock-area { position: relative; min-height: 460px; }
.lock-overlay {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .32);
  display: flex; align-items: center; justify-content: center;
}
.lock-overlay[hidden] { display: none; }
.lock-gate {
  position: relative; width: 400px; margin: 0; padding: 26px 28px 24px; text-align: center;
  background: linear-gradient(180deg, #eef4ff 0%, #ffffff 55%);
  border: 2px solid #a9c4ff; border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0, 99, 255, 0.16);
}
.lock-gate h3 { margin: 0; font-size: 16px; color: #333333; display: flex; align-items: center; justify-content: center; gap: 8px; }
.lock-sub { margin: 12px 0 0; font-size: 13px; color: #666666; }
.lock-digits { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; }
.lock-digits .d { min-width: 34px; padding: 5px 0; border: 2px dashed #c0c8d6; border-radius: 6px; background: #ffffff; font-size: 22px; font-weight: 800; color: #333333; }
.lock-digits .u { font-size: 13px; color: #666666; }
.lock-note { margin: 12px 0 0; font-size: 12px; color: #999999; }
.btn-unlock {
  margin-top: 16px; height: 44px; padding: 0 40px; border: none; border-radius: 8px;
  background: #0063FF; color: #ffffff;
  font-size: 16px; font-weight: 600; font-family: var(--font-sans); cursor: pointer;
  animation: unlock-pulse 1.6s infinite;
}
.btn-unlock:hover { opacity: 0.92; }
@keyframes unlock-pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 99, 255, 0.4); }
  70% { box-shadow: 0 0 0 18px rgba(0, 99, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 99, 255, 0); }
}
.unlock-badge { background: #e9f7ea; color: #67c23a; border-radius: 2px; padding: 0 8px; font-size: 12px; line-height: 20px; font-weight: 400; margin-left: 8px; }
.toast {
  position: fixed; left: 50%; top: 24px; transform: translate(-50%, -16px); z-index: 99;
  background: #333333; color: #ffffff; font-size: 14px; padding: 10px 22px; border-radius: 6px;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* back to top */
.back-top {
  position: fixed; right: 60px; bottom: 100px; width: 56px; height: 56px; border-radius: 50%;
  background: #ffffff; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(31, 45, 61, 0.15);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; z-index: 50;
}
.back-top.show { opacity: 1; visibility: visible; }

/* 版本徽标 */
.version-badge { position: fixed; right: 16px; bottom: 14px; z-index: 40; font-size: 11px; color: #999; background: rgba(255,255,255,.8); border: 1px solid #ebeef5; border-radius: 999px; padding: 2px 10px; letter-spacing: .5px; user-select: none; }
</style>

  /* 分页器：与列表页同款窗口算法（10 个页码 + 省略号 + 末页） */
  function pagHTML(sec, cur, total) {
    var h = '';
    h += '<li><a class="pagination-link pag-text" href="#" data-sec="' + sec + '" data-page="prev"' + (cur === 1 ? ' aria-disabled="true"' : '') + '>上一页</a></li>';
    var s = total <= 10 ? 1 : Math.max(1, Math.min(cur - 4, total - 9));
    var e = Math.min(total, s + 9);
    if (s > 1) {
      h += '<li><a class="pagination-link" href="#" data-sec="' + sec + '" data-page="1">1</a></li>';
      h += '<li><span class="pagination-ellipsis" aria-hidden="true">&hellip;</span></li>';
    }
    for (var p = s; p <= e; p++) {
      h += '<li><a class="pagination-link' + (p === cur ? ' pagination-active" aria-current="page' : '') + '" href="#" data-sec="' + sec + '" data-page="' + p + '">' + p + '</a></li>';
    }
    if (e < total) {
      h += '<li><span class="pagination-ellipsis" aria-hidden="true">&hellip;</span></li>';
      h += '<li><a class="pagination-link" href="#" data-sec="' + sec + '" data-page="' + total + '">' + total + '</a></li>';
    }
    h += '<li><a class="pagination-link pag-text" href="#" data-sec="' + sec + '" data-page="next"' + (cur === total ? ' aria-disabled="true"' : '') + '>下一页</a></li>';
    return h;
  }

  var PER = 10;               /* 每种信息单页最多 10 条 */

    var total = s.rows.length;
    var pages = Math.max(1, Math.ceil(total / PER));
    if (page > pages) page = pages;
    secPages[s.id] = page;
    var html = tableHTML(s, s.rows.slice((page - 1) * PER, page * PER));
    if (total > PER) {
      html += '<div class="pager"><span class="pager-total">共 ' + total + ' 条</span>' +
        '<nav class="pagination" aria-label="Pagination"><ul class="pagination-list">' + pagHTML(s.id, page, pages) + '</ul></nav></div>';
    }
    return html;
  }

    if (p === 'prev') cur = Math.max(1, cur - 1);

      while (next.length < ds.length) next = '0' + next;
      Array.prototype.forEach.call(ds, function (d, i) { d.textContent = next[i]; });

    if (!a) return;
    e.preventDefault();
    alert('联系邮箱：' + a.dataset.mail);
  });

  var backTop = document.getElementById('back-top');
  window.addEventListener('scroll', function () {
    backTop.classList.toggle('show', window.scrollY > 300);
  }, { passive: true });
  backTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>
