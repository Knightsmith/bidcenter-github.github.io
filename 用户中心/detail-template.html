  function sectionVisible(s) {

  function tableHTML(s, rows) {
    var head = s.cols.map(function (c) { return '<th>' + c + '</th>'; }).join('');
    var body;
    if (!rows.length) {
      body = '<tr class="empty-row"><td colspan="' + s.cols.length + '">暂无数据</td></tr>';
    } else {
      body = rows.map(function (r) {
        var cells = r.map(function (c, ci) {
          var v = esc(c);
          if (s.cols[ci] === '操作') v = '<button class="detail-btn">查看</button>';
          var cls = (ci === 1 || String(c).length > 24) ? ' class="left"' : '';
          return '<td' + cls + '>' + v + '</td>';
        }).join('');
        return '<tr>' + cells + '</tr>';
      }).join('');
    }
    return '<table class="tbl"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
  }

  /* 分页器：与列表页同款窗口算法（10 个页码 + 省略号 + 末页） */
  function pagHTML(sec, cur, total) {
    var h = '';
    h += '<li><a class="pagination-link pag-text" href="#" data-sec="' + sec + '" data-page="prev"' + (cur === 1 ? ' aria-disabled="true"' : '') + '>上一页</a></li>';
    var s = total <= 10 ? 1 : Math.max(1, Math.min(cur - 4, total - 9));
    var e = Math.min(total, s + 9);
    if (s > 1) {
      h += '<li><a class="pagination-link" href="#" data-sec="' + sec + '" data-page="1">1</a></li>';
      h += '<li><span class="pagination-ellipsis" aria-hidden="true">&hellip;</span></li>';
    }
    for (var p = s; p <= e; p++) {
      h += '<li><a class="pagination-link' + (p === cur ? ' pagination-active" aria-current="page' : '') + '" href="#" data-sec="' + sec + '" data-page="' + p + '">' + p + '</a></li>';
    }
    if (e < total) {
      h += '<li><span class="pagination-ellipsis" aria-hidden="true">&hellip;</span></li>';
      h += '<li><a class="pagination-link" href="#" data-sec="' + sec + '" data-page="' + total + '">' + total + '</a></li>';
    }
    h += '<li><a class="pagination-link pag-text" href="#" data-sec="' + sec + '" data-page="next"' + (cur === total ? ' aria-disabled="true"' : '') + '>下一页</a></li>';
    return h;
  }

  var PER = 10;               /* 每种信息单页最多 10 条 */
  var secPages = {};
  var secBox = document.getElementById('sections');

  function bodyHTML(s, page) {
    if (s.kv) return kvTable();
    var total = s.rows.length;
    var pages = Math.max(1, Math.ceil(total / PER));
    if (page > pages) page = pages;
    secPages[s.id] = page;
    var html = tableHTML(s, s.rows.slice((page - 1) * PER, page * PER));
    if (total > PER) {
      html += '<div class="pager"><span class="pager-total">共 ' + total + ' 条</span>' +
        '<nav class="pagination" aria-label="Pagination"><ul class="pagination-list">' + pagHTML(s.id, page, pages) + '</ul></nav></div>';
    }
    return html;
  }

  secBox.innerHTML = sections.filter(sectionVisible).map(function (s) {
    return '<section class="section" id="sec-' + s.id + '" data-rows="' + (s.rows ? s.rows.length : 0) + '">' +

      '<div class="sec-body">' + bodyHTML(s, 1) + '</div></section>';
  }).join('');

  /* 分页切换：只重渲染对应区块 */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.pagination a[data-sec]');
    if (!a || a.getAttribute('aria-disabled') === 'true') return;
    e.preventDefault();
    var sec = a.dataset.sec;
    var s = sections.filter(function (x) { return x.id === sec; })[0];
    if (!s) return;
    var pages = Math.max(1, Math.ceil(s.rows.length / PER));
    var cur = secPages[sec] || 1;
    var p = a.dataset.page;
    if (p === 'prev') cur = Math.max(1, cur - 1);
    else if (p === 'next') cur = Math.min(pages, cur + 1);
    else cur = parseInt(p, 10);
    if (cur === (secPages[sec] || 1)) return;
    var box = document.querySelector('#sec-' + sec + ' .sec-body');
    if (box) box.innerHTML = bodyHTML(s, cur);
  });

      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });

  });

    else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
  });

  document.getElementById('base-grid').addEventListener('click', function (e) {
    var a = e.target.closest('#more-contact');

    backTop.classList.toggle('show', window.scrollY > 300);
  }, { passive: true });
  backTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
