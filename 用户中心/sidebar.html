<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 - 采招网</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #333333;
    --border: #e5e5e5;
    --muted-foreground: #999999;
    --accent: #f5f5f5;
    --accent-foreground: #333333;
    --primary: #0063FF;
    --radius: 8px;

    --sidebar: #ffffff;
    --sidebar-foreground: #333333;
    --sidebar-accent: #f0f0f0;
    --sidebar-accent-foreground: #202020;
    --sidebar-border: #e5e5e5;
    --sidebar-active: #e8f0ff;
    --sidebar-width: 16rem;
    --sidebar-width-icon: 3rem;

    --topbar-h: 56px;
    --topbar-blue: #0063FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--background);
    color: var(--foreground);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  a { text-decoration: none; color: inherit; cursor: pointer; }
  button { font-family: inherit; }
  svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ============ 顶部蓝色通栏 ============ */
  .topbar {
    height: var(--topbar-h);
    background: var(--topbar-blue);
    display: flex;
    align-items: center;
    gap: 24px;
    padding-right: 20px;
    color: #ffffff;
  }
  .topbar-logo {
    position: relative;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 16px;
    transition: width .2s ease, min-width .2s ease;
    flex-shrink: 0;
  }
  /* 左上角 logo 区不随侧边栏收起：固定宽度、始终显示完整文字 */
  .logo-text {
    display: flex; flex-direction: column; line-height: 1.15;
    white-space: nowrap; overflow: visible; flex-shrink: 0;
  }
  .logo-text .name { font-size: 19px; font-weight: 700; letter-spacing: 2px; }
  .logo-text .url { font-size: 10px; opacity: .85; }

  .topbar-search {
    flex: 0 1 480px;
    margin-left: auto;
    display: flex;
    align-items: center;
    height: 36px;
    background: rgba(255, 255, 255, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 4px;
    padding: 0 4px 0 12px;
  }
  .topbar-search input {
    flex: 1; border: none; outline: none; background: transparent;
    color: #ffffff; font-size: 13px; font-family: inherit;
  }
  .topbar-search input::placeholder { color: rgba(255, 255, 255, 0.75); }
  .topbar-search button {
    width: 30px; height: 28px; border: none; border-radius: 3px; background: transparent;
    color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .topbar-search button:hover { background: rgba(255, 255, 255, 0.18); }
  .topbar-search button svg { width: 16px; height: 16px; }

  .topbar-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .topbar-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #ffffff; font-size: 13px; cursor: pointer; background: none; border: none;
  }
  .topbar-link svg { width: 15px; height: 15px; }
  .topbar-link:hover { opacity: .85; }
  .topbar-vip {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, #ffd75e 0%, #f6b52a 100%);
    color: #6b4300; font-size: 13px; font-weight: 600;
    height: 30px; padding: 0 14px; border: none; border-radius: 4px; cursor: pointer;
  }
  .topbar-vip svg { width: 14px; height: 14px; }
  .topbar-icons { display: flex; align-items: center; gap: 16px; }
  .topbar-icons button { background: none; border: none; color: #ffffff; cursor: pointer; display: flex; }
  .topbar-icons button:hover { opacity: .85; }
  .topbar-icons svg { width: 18px; height: 18px; }
  .topbar-user {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: none; color: #ffffff; font-size: 13px; cursor: pointer;
  }
  .topbar-user .ava {
    position: relative;
    overflow: hidden;
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #ffd75e 0%, #ff8f3c 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #ffffff;
  }
  .topbar-user .ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .topbar-user svg { width: 12px; height: 12px; }

  /* ============ Shell ============ */
  .app-shell { display: flex; height: calc(100vh - var(--topbar-h)); }

  /* ============ Sidebar ============ */
  .sidebar {
    position: relative;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    transition: width 0.2s ease, min-width 0.2s ease;
  }
  .sidebar[data-state="collapsed"] { width: var(--sidebar-width-icon); min-width: var(--sidebar-width-icon); }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.5rem;
    scrollbar-width: thin;
    scrollbar-color: var(--sidebar-border) transparent;
  }
  .sidebar-content::-webkit-scrollbar { width: 6px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 3px; }

  .sidebar-menu { display: flex; flex-direction: column; gap: 4px; }

  .sidebar-menu-button {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 40px;
    padding: 0.5rem 0.75rem;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--sidebar-foreground);
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-menu-button:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-button.active { background: var(--sidebar-accent); color: var(--primary); font-weight: 600; }
  .sidebar-menu-button svg { width: 17px; height: 17px; flex-shrink: 0; }

  .sidebar-menu-button-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-menu-button-chevron {
    margin-left: auto;
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--muted-foreground);
    transition: transform 0.2s ease;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-button > .sidebar-menu-button-chevron { transform: rotate(180deg); }

  .sidebar-menu-sub {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 2.6rem;
    margin: 2px 0 6px;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-sub { display: flex; }

  .sidebar-menu-sub-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 36px;
    padding: 0 0.75rem;
    border-radius: var(--radius);
    color: #606266;
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-menu-sub-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-sub-item.active {
    background: var(--sidebar-active);
    color: var(--primary);
    font-weight: 600;
  }
  .sidebar-menu-sub-item.active::before {
    content: "";
    position: absolute;
    left: -2.6rem;
    top: 4px;
    bottom: 4px;
    width: 3px;
    border-radius: 2px;
    background: var(--primary);
  }

  /* 折叠态：只留图标 */
  .sidebar[data-state="collapsed"] .sidebar-menu-button { justify-content: center; padding: 0.5rem; }
  .sidebar[data-state="collapsed"] .sidebar-menu-button-label,
  .sidebar[data-state="collapsed"] .sidebar-menu-button-chevron,
  .sidebar[data-state="collapsed"] .sidebar-menu-sub { display: none; }

  /* ============ Main ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background); }

  .main-header {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0 1rem;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .sidebar-trigger {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius);
    background: transparent; color: var(--muted-foreground); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-trigger:hover { background: var(--accent); color: var(--accent-foreground); }
  .sidebar-trigger svg { width: 16px; height: 16px; }
  .header-separator { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
  .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; color: var(--muted-foreground); }
  .breadcrumb-separator { color: var(--muted-foreground); }
  .breadcrumb-current { color: var(--foreground); font-weight: 500; }

  .content { flex: 1; display: flex; flex-direction: column; padding: 16px; min-height: 0; }
  .content-body {
    flex: 1; min-height: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #ffffff;
    overflow: hidden;
    position: relative;
  }
  .content-frame { width: 100%; height: 100%; border: none; display: block; background: #ffffff; }
  .placeholder-view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #ffffff; color: var(--muted-foreground); text-align: center;
  }
  .placeholder-view svg { width: 56px; height: 56px; stroke-width: 1.2; color: var(--border); }
  .placeholder-view h3 { font-size: 17px; font-weight: 600; color: var(--foreground); }
  .placeholder-view p { font-size: 13px; }

/* 版本徽标 */
.version-badge { position: fixed; right: 16px; bottom: 14px; z-index: 40; font-size: 11px; color: #999; background: rgba(255,255,255,.8); border: 1px solid #ebeef5; border-radius: 999px; padding: 2px 10px; letter-spacing: .5px; user-select: none; }
</style>
</head>

<script>
  var iframe = document.getElementById('contentFrame');
  var placeholderView = document.getElementById('placeholderView');
  var breadcrumbCurrent = document.getElementById('breadcrumbCurrent');

  // 根据当前加载的页面同步菜单：展开对应一级菜单并选中对应二级菜单
  function syncMenuToPage(src, expandSidebar) {
    var el = document.querySelector('.sidebar-menu [data-page="' + src + '"]');
    if (!el) return null;
    setActive(el);
    var wrapper = el.closest('.sidebar-group-item');
    if (wrapper) {
      wrapper.setAttribute('data-state', 'open');
      if (expandSidebar) sidebarEl.setAttribute('data-state', 'expanded');
    }
    return el;
  }

  function showIframe(src) {
    iframe.removeAttribute('srcdoc');
    iframe.src = src;
    iframe.style.display = 'block';
    placeholderView.style.display = 'none';
    syncMenuToPage(src, true);
  }

  function showPlaceholder() {
    iframe.style.display = 'none';
    placeholderView.style.display = 'flex';
  }

  function setActive(el) {
    document.querySelectorAll('.sidebar-menu-button.active, .sidebar-menu-sub-item.active').forEach(function (n) { n.classList.remove('active'); });
    el.classList.add('active');
    if (el.classList.contains('sidebar-menu-sub-item')) {
      var wrapper = el.closest('.sidebar-group-item');
      if (wrapper) {
        var parentBtn = wrapper.querySelector(':scope > .sidebar-menu-button');
        if (parentBtn) parentBtn.classList.add('active');
      }
    }
  }

  function handleNavClick(el) {
    var page = el.getAttribute('data-page');
    var title = el.getAttribute('data-title') || el.textContent.trim();
    setActive(el);
    breadcrumbCurrent.textContent = title;
    if (page && page !== 'placeholder') {
      showIframe(page);
    } else {
      showPlaceholder();
    }
  }

  // 一级菜单：点击同时展开/收起折叠组并联动内容区
  document.querySelectorAll('.sidebar-menu button.sidebar-menu-button').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      var wrapper = item.closest('.sidebar-group-item');
      var sidebarEl = document.getElementById('sidebar');
      var collapsed = sidebarEl.getAttribute('data-state') === 'collapsed';
      if (wrapper && !collapsed) {
        var isOpen = wrapper.getAttribute('data-state') === 'open';
        wrapper.setAttribute('data-state', isOpen ? 'closed' : 'open');
      }
      handleNavClick(item);
    });
  });

  // 二级菜单
  document.querySelectorAll('.sidebar-menu-sub-item').forEach(function (leaf) {
    leaf.addEventListener('click', function (e) {
      e.preventDefault();
      handleNavClick(leaf);
    });
  });

  // 顶栏折叠按钮（左下角收起已移除）
  var sidebarEl = document.getElementById('sidebar');
  document.getElementById('sidebarTrigger').addEventListener('click', function () {
    var collapsed = sidebarEl.getAttribute('data-state') === 'collapsed';
    sidebarEl.setAttribute('data-state', collapsed ? 'expanded' : 'collapsed');
  });

  // 初始页面：支持 ?page=xxx 指定；默认工作台（侧边栏默认收起，命中二级菜单时自动展开并选中）
  var initialPage = new URLSearchParams(location.search).get('page') || 'workbench.html';
  var matched = document.querySelector('.sidebar-menu [data-page="' + initialPage + '"]');
  if (matched) {
    showIframe(initialPage);
    breadcrumbCurrent.textContent = matched.getAttribute('data-title') || '工作台';
  } else {
    setActive(document.querySelector('.sidebar-menu > .sidebar-menu-button[data-page="workbench.html"]'));
    breadcrumbCurrent.textContent = '工作台';
    showPlaceholder();
  }
</script>
