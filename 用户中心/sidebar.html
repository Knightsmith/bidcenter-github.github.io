<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 - 采招网</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%237c3aed'/%3E%3Ctext%20x='32'%20y='45'%20text-anchor='middle'%20font-size='40'%20font-weight='700'%20fill='%23ffffff'%20font-family='Microsoft%20YaHei,sans-serif'%3E%E5%B1%BF%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background: #ffffff;
    --foreground: #333333;
    --border: #e5e5e5;
    --muted-foreground: #999999;
    --accent: #f5f5f5;
    --accent-foreground: #333333;
    --primary: #0063FF;
    --radius: 8px;

    --sidebar: #ffffff;
    --sidebar-foreground: #333333;
    --sidebar-accent: #f0f0f0;
    --sidebar-accent-foreground: #202020;
    --sidebar-border: #e5e5e5;
    --sidebar-active: #e8f0ff;
    --sidebar-width: 16rem;
    --sidebar-width-icon: 3rem;

    --topbar-h: 56px;
    --topbar-blue: #0063FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--background);
    color: var(--foreground);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  a { text-decoration: none; color: inherit; cursor: pointer; }
  button { font-family: inherit; }
  svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ============ 顶部蓝色通栏 ============ */
  .topbar {
    height: var(--topbar-h);
    background: var(--topbar-blue);
    display: flex;
    align-items: center;
    gap: 24px;
    padding-right: 20px;
    color: #ffffff;
  }
  .topbar-logo {
    position: relative;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 16px;
    transition: width .2s ease, min-width .2s ease;
    flex-shrink: 0;
  }
  /* 左上角 logo 区不随侧边栏收起：固定宽度、始终显示完整文字 */
  .logo-text {
    display: flex; flex-direction: column; line-height: 1.15;
    white-space: nowrap; overflow: visible; flex-shrink: 0;
  }
  .logo-text .name { font-size: 19px; font-weight: 700; letter-spacing: 2px; }
  .logo-text .url { font-size: 10px; opacity: .85; }

  .topbar-search {
    flex: 0 1 480px;
    margin-left: auto;
    display: flex;
    align-items: center;
    height: 36px;
    background: rgba(255, 255, 255, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 4px;
    padding: 0 4px 0 12px;
  }
  .topbar-search input {
    flex: 1; border: none; outline: none; background: transparent;
    color: #ffffff; font-size: 13px; font-family: inherit;
  }
  .topbar-search input::placeholder { color: rgba(255, 255, 255, 0.75); }
  .topbar-search button {
    width: 30px; height: 28px; border: none; border-radius: 3px; background: transparent;
    color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .topbar-search button:hover { background: rgba(255, 255, 255, 0.18); }
  .topbar-search button svg { width: 16px; height: 16px; }

  .topbar-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .topbar-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #ffffff; font-size: 13px; cursor: pointer; background: none; border: none;
  }
  .topbar-link svg { width: 15px; height: 15px; }
  .topbar-link:hover { opacity: .85; }
  .topbar-vip {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, #ffd75e 0%, #f6b52a 100%);
    color: #6b4300; font-size: 13px; font-weight: 600;
    height: 30px; padding: 0 14px; border: none; border-radius: 4px; cursor: pointer;
  }
  .topbar-vip svg { width: 14px; height: 14px; }
  .topbar-icons { display: flex; align-items: center; gap: 16px; }
  .topbar-icons button { background: none; border: none; color: #ffffff; cursor: pointer; display: flex; }
  .topbar-icons button:hover { opacity: .85; }
  .topbar-icons svg { width: 18px; height: 18px; }
  .topbar-user {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: none; color: #ffffff; font-size: 13px; cursor: pointer;
  }
  .topbar-user .ava {
    position: relative;
    overflow: hidden;
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #ffd75e 0%, #ff8f3c 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #ffffff;
  }
  .topbar-user .ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .topbar-user svg { width: 12px; height: 12px; }

  /* ============ 右上角版本切换（企业详情族） ============ */
  .topbar-versions { display: inline-flex; align-items: center; gap: 6px; margin-right: 2px; }
  .topbar-versions[data-show="false"] { display: none; }
  .topbar-versions button {
    height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    font-size: 12px; line-height: 1; color: #ffffff;
    background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .38);
  }
  .topbar-versions button:hover { background: rgba(255, 255, 255, .28); }
  .topbar-versions button.active {
    background: #ffffff; color: #1f6fd0; border-color: #ffffff; font-weight: 600;
  }
  .topbar-versions .vt-short { display: none; }

  /* 窄屏收紧：按钮文案缩短、间距压缩，避免顶栏横向溢出 */
  @media (max-width: 1680px) {
    .topbar-right { gap: 12px; }
    .topbar-versions { gap: 4px; margin-right: 0; }
    .topbar-versions button { padding: 0 8px; font-size: 11px; height: 24px; }
    .topbar-versions .vt-full { display: none; }
    .topbar-versions .vt-short { display: inline; }
  }
  @media (max-width: 1400px) {
    .topbar-icons { gap: 10px; }
    .topbar-user { gap: 6px; }
    .topbar-vip { padding: 0 10px; }
  }

  /* 轻提示 */
  .nav-toast {
    position: fixed; left: 50%; top: 72px; transform: translate(-50%, -8px);
    background: rgba(0, 0, 0, .78); color: #fff; font-size: 13px; line-height: 1.4;
    padding: 9px 16px; border-radius: 6px; max-width: 70vw;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 9999;
  }
  .nav-toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============ Shell ============ */
  .app-shell { display: flex; height: calc(100vh - var(--topbar-h)); }

  /* ============ Sidebar ============ */
  .sidebar {
    position: relative;
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    transition: width 0.2s ease, min-width 0.2s ease;
  }
  .sidebar[data-state="collapsed"] { width: var(--sidebar-width-icon); min-width: var(--sidebar-width-icon); }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.5rem;
    scrollbar-width: thin;
    scrollbar-color: var(--sidebar-border) transparent;
  }
  .sidebar-content::-webkit-scrollbar { width: 6px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 3px; }

  .sidebar-menu { display: flex; flex-direction: column; gap: 4px; }

  .sidebar-menu-button {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 40px;
    padding: 0.5rem 0.75rem;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--sidebar-foreground);
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-menu-button:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-button.active { background: var(--sidebar-accent); color: var(--primary); font-weight: 600; }
  .sidebar-menu-button svg { width: 17px; height: 17px; flex-shrink: 0; }

  .sidebar-menu-button-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-menu-button-chevron {
    margin-left: auto;
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--muted-foreground);
    transition: transform 0.2s ease;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-button > .sidebar-menu-button-chevron { transform: rotate(180deg); }

  .sidebar-menu-sub {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 2.6rem;
    margin: 2px 0 6px;
  }
  .sidebar-group-item[data-state="open"] > .sidebar-menu-sub { display: flex; }

  .sidebar-menu-sub-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 36px;
    padding: 0 0.75rem;
    border-radius: var(--radius);
    color: #606266;
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-menu-sub-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-menu-sub-item.active {
    background: var(--sidebar-active);
    color: var(--primary);
    font-weight: 600;
  }
  .sidebar-menu-sub-item.active::before {
    content: "";
    position: absolute;
    left: -2.6rem;
    top: 4px;
    bottom: 4px;
    width: 3px;
    border-radius: 2px;
    background: var(--primary);
  }

  /* 折叠态：只留图标 */
  .sidebar[data-state="collapsed"] .sidebar-menu-button { justify-content: center; padding: 0.5rem; }
  .sidebar[data-state="collapsed"] .sidebar-menu-button-label,
  .sidebar[data-state="collapsed"] .sidebar-menu-button-chevron,
  .sidebar[data-state="collapsed"] .sidebar-menu-sub { display: none; }

  /* ============ Main ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background); }

  .main-header {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0 1rem;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .sidebar-trigger {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius);
    background: transparent; color: var(--muted-foreground); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-trigger:hover { background: var(--accent); color: var(--accent-foreground); }
  .sidebar-trigger svg { width: 16px; height: 16px; }
  .header-separator { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
  .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; color: var(--muted-foreground); }
  .breadcrumb-separator { color: var(--muted-foreground); }
  .breadcrumb-current { color: var(--foreground); font-weight: 500; }

  /* ============ 面包屑栏右侧版本切换（企业详情族） ============ */
  .main-header .topbar-versions { margin-left: auto; margin-right: 0; flex-shrink: 0; }
  .main-header .breadcrumb { min-width: 0; overflow: hidden; white-space: nowrap; }
  .main-header .topbar-versions button {
    background: #ffffff; color: #374151; border: 1px solid #d8dce3; font-weight: 500;
  }
  .main-header .topbar-versions button:hover { background: #f2f5f9; color: #1f2937; }
  .main-header .topbar-versions button.active {
    background: #2b7bff; color: #ffffff; border-color: #2b7bff; font-weight: 600;
  }

  .content { flex: 1; display: flex; flex-direction: column; padding: 20px; min-height: 0; }
  .content-body {
    flex: 1; min-height: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #ffffff;
    overflow: hidden;
    position: relative;
  }
  .content-frame { width: 100%; height: 100%; border: none; display: block; background: #ffffff; }
  .placeholder-view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #ffffff; color: var(--muted-foreground); text-align: center;
  }
  .placeholder-view svg { width: 56px; height: 56px; stroke-width: 1.2; color: var(--border); }
  .placeholder-view h3 { font-size: 17px; font-weight: 600; color: var(--foreground); }
  .placeholder-view p { font-size: 13px; }

/* 版本徽标 */
.version-badge { position: fixed; right: 16px; bottom: 14px; z-index: 40; font-size: 11px; color: #999; background: rgba(255,255,255,.8); border: 1px solid #ebeef5; border-radius: 999px; padding: 2px 10px; letter-spacing: .5px; user-select: none; }
</style>
</head>

</div>

<div class="app-shell">

  <!-- ============ Sidebar ============ -->

    <div class="sidebar-content">
      <div class="sidebar-menu">

  <!-- ============ 主区域 ============ -->
  <main class="main">
    <div class="content">
      <header class="main-header">
        <button class="sidebar-trigger" id="sidebarTrigger" type="button" aria-label="切换侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div class="header-separator"></div>
        <nav class="breadcrumb" aria-label="面包屑">
          <span class="breadcrumb-item">用户中心</span>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-item breadcrumb-current" id="breadcrumbCurrent">工作台</span>
        </nav>

        <!-- 企业详情族页面：面包屑栏右侧版本切换（仅当前页属于企业详情族时显示） -->
        <div class="topbar-versions" id="versionSwitch" data-show="true">
          <button type="button" data-ver="free"><span class="vt-full">已解锁版本</span><span class="vt-short">已解锁</span></button>
          <button type="button" data-ver="vip"><span class="vt-full">未开通会员版本</span><span class="vt-short">会员</span></button>
          <button type="button" data-ver="points"><span class="vt-full">积分解锁版本</span><span class="vt-short">积分</span></button>
          <button type="button" data-ver="count"><span class="vt-full">次数解锁</span><span class="vt-short">次数</span></button>
        </div>
      </header>
      <div class="content-body">
        <iframe id="contentFrame" class="content-frame" title="内容区"></iframe>
        <div class="placeholder-view" id="placeholderView" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>页面尚未生成</h3>
          <p>该功能页面正在建设中，敬请期待</p>
        </div>
      </div>
    </div>

<script>
  var iframe = document.getElementById('contentFrame');
  var lastPage = ''; // sidebar 侧记录的当前内容区页面（file:// 下无法读 contentWindow 时兜底）
  var placeholderView = document.getElementById('placeholderView');
  var breadcrumbCurrent = document.getElementById('breadcrumbCurrent');

  // 根据当前加载的页面同步菜单：展开对应一级菜单并选中对应二级菜单
  function syncMenuToPage(src, expandSidebar) {
    var el = document.querySelector('.sidebar-menu [data-page="' + src + '"]');
    if (!el) return null;
    setActive(el);
    var wrapper = el.closest('.sidebar-group-item');
    if (wrapper) {
      wrapper.setAttribute('data-state', 'open');
      if (expandSidebar) sidebarEl.setAttribute('data-state', 'expanded');
    }
    return el;
  }

  function showIframe(src) {
    var p = String(src).split('?')[0];
    lastPage = p.substring(p.lastIndexOf('/') + 1);
    iframe.removeAttribute('srcdoc');
    iframe.src = src;
    iframe.style.display = 'block';
    placeholderView.style.display = 'none';
    syncMenuToPage(src, !narrowOnLoad);
    syncUrlParam(src);
    refreshVersionSwitch();
  }

  // 地址栏 ?page= 与内容区保持同步：刷新、复制链接后仍停在原页
  function syncUrlParam(src) {
    try {
      var page = String(src).split('?')[0];
      if (!page) return;
      var u = new URL(location.href);
      if (u.searchParams.get('page') === page) return;
      u.searchParams.set('page', page);
      history.replaceState(null, '', u.toString());
    } catch (err) { /* file:// 或历史接口受限时忽略 */ }
  }

  function showPlaceholder() {
    iframe.style.display = 'none';
    placeholderView.style.display = 'flex';
  }

  function setActive(el) {
    document.querySelectorAll('.sidebar-menu-button.active, .sidebar-menu-sub-item.active').forEach(function (n) { n.classList.remove('active'); });
    el.classList.add('active');
    if (el.classList.contains('sidebar-menu-sub-item')) {
      var wrapper = el.closest('.sidebar-group-item');
      if (wrapper) {
        var parentBtn = wrapper.querySelector(':scope > .sidebar-menu-button');
        if (parentBtn) parentBtn.classList.add('active');
      }
    }
  }

  function handleNavClick(el) {
    var page = el.getAttribute('data-page');
    var title = el.getAttribute('data-title') || el.textContent.trim();
    setActive(el);
    breadcrumbCurrent.textContent = title;
    if (page && page !== 'placeholder') {
      showIframe(page);
    } else {
      showPlaceholder();
    }
  }

  // 一级菜单：点击同时展开/收起折叠组并联动内容区
  document.querySelectorAll('.sidebar-menu button.sidebar-menu-button').forEach(function (item) {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      var wrapper = item.closest('.sidebar-group-item');
      var sidebarEl = document.getElementById('sidebar');
      var collapsed = sidebarEl.getAttribute('data-state') === 'collapsed';
      if (wrapper && !collapsed) {
        var isOpen = wrapper.getAttribute('data-state') === 'open';
        wrapper.setAttribute('data-state', isOpen ? 'closed' : 'open');
      }
      handleNavClick(item);
    });
  });

  // 二级菜单
  document.querySelectorAll('.sidebar-menu-sub-item').forEach(function (leaf) {
    leaf.addEventListener('click', function (e) {
      e.preventDefault();
      handleNavClick(leaf);
    });
  });

  // ====== 打开时一次性判断：页面宽度 < 1600px 则侧边栏初始收起（不锁定，可手动展开） ======
  var sidebarEl = document.getElementById('sidebar');
  var narrowOnLoad = window.innerWidth < 1600;
  if (narrowOnLoad) sidebarEl.setAttribute('data-state', 'collapsed');

  // 顶栏折叠按钮（左下角收起已移除）
  document.getElementById('sidebarTrigger').addEventListener('click', function () {
    var collapsed = sidebarEl.getAttribute('data-state') === 'collapsed';
    sidebarEl.setAttribute('data-state', collapsed ? 'expanded' : 'collapsed');
  });

  // ====== 企业详情族：右上角版本切换（已解锁 / 未开通会员 / 积分解锁 / 次数解锁） ======
  var VERSION_PAGES = {
    'enterprise-detail.html': {
      free: 'enterprise-detail.html',
      vip: 'enterprise-detail-locked-vip.html',
      points: 'enterprise-detail-locked.html',
      count: 'enterprise-detail-locked-count.html'
    },
    'contact.html': {
      free: 'contact.html',
      vip: 'contact-locked-vip.html',
      points: 'contact-locked.html',
      count: 'contact-locked-count.html'
    },
    'bid-analysis.html': {
      free: 'bid-analysis.html',
      vip: 'bid-analysis-locked-vip.html'
    },
    'bid-performance.html': {
      free: 'bid-performance.html'
    },
    'business-network.html': {
      free: 'business-network.html',
      vip: 'business-network-locked-vip.html',
      points: 'business-network-locked.html',
      count: 'business-network-locked-count.html'
    }
  };
  var VERSION_LABEL = { vip: '未开通会员版本', points: '积分解锁版本', count: '次数解锁版本' };
  var BASE_TITLE = {
    'enterprise-detail.html': '查企业',
    'contact.html': '找人脉',
    'bid-analysis.html': '中标分析',
    'bid-performance.html': '中标业绩',
    'business-network.html': '商机脉络'
  };
  console.log('[sidebar] build 2026-11-09t1 已加载');
  var verSwitch = document.getElementById('versionSwitch');
  var verBase = '';

  // 解析文件名 -> { base, ver }
  function parseVerPage(name) {
    if (!name) return null;
    var m = /^(.+?)(-locked(-vip|-count)?)?\.html$/.exec(name);
    if (!m) return null;
    var base = m[1] + '.html';
    if (!VERSION_PAGES[base]) return null;
    var ver = 'free';
    if (m[2]) ver = (m[3] === '-vip') ? 'vip' : ((m[3] === '-count') ? 'count' : 'points');
    return { base: base, ver: ver };
  }

  // 取 iframe 里当前真实页面文件名（iframe 内二次跳转时 src 属性不会变，优先读 contentWindow）
  function currentFrameName() {
    try {
      var path = iframe.contentWindow.location.pathname;
      var n = path.substring(path.lastIndexOf('/') + 1);
      if (n) return decodeURIComponent(n);
    } catch (err) { /* file:// 无同源授权时 contentWindow 不可读，走 lastPage */ }
    if (lastPage) return lastPage;
    var src = iframe.getAttribute('src') || '';
    src = src.split('?')[0];
    return src.substring(src.lastIndexOf('/') + 1);
  }

  function refreshVersionSwitch() {
    var info = parseVerPage(currentFrameName());
    if (!info) {
      verBase = '';
      verSwitch.setAttribute('data-show', 'false');
      Array.prototype.forEach.call(verSwitch.querySelectorAll('button[data-ver]'), function (b) {
        b.classList.remove('active');
      });
      return;
    }
    verBase = info.base;
    verSwitch.setAttribute('data-show', 'true');
    Array.prototype.forEach.call(verSwitch.querySelectorAll('button[data-ver]'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-ver') === info.ver);
    });
  }

  // 轻提示
  var navToast = document.createElement('div');
  navToast.className = 'nav-toast';
  document.body.appendChild(navToast);
  var navToastTimer;
  function showToast(msg) {
    navToast.textContent = msg;
    navToast.classList.add('show');
    clearTimeout(navToastTimer);
    navToastTimer = setTimeout(function () { navToast.classList.remove('show'); }, 2200);
  }

  verSwitch.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-ver]');
    if (!btn || !verBase) return;
    var map = VERSION_PAGES[verBase];
    if (!map) return;
    var ver = btn.getAttribute('data-ver');
    var target = map[ver];
    if (!target) {
      showToast('该页面暂无' + VERSION_LABEL[ver] + '，请切换其他版本查看');
      return;
    }
    if (currentFrameName() === target) return;
    showIframe(target);
    refreshVersionSwitch();
  });

  iframe.addEventListener('load', refreshVersionSwitch);

  // 子页面（如企情分析 search.html）请求切换内容区页面
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'bidcenter-nav' || !d.page) return;
    if (!/^[A-Za-z0-9_\-\/]+\.html(\?[^"']*)?$/.test(d.page)) return;
    breadcrumbCurrent.textContent = d.title || '企业详情';
    showIframe(d.page);
  });

  // 初始页面：支持 ?page=xxx 指定；默认工作台（侧边栏默认收起，命中二级菜单时自动展开并选中）
  var initialPage = new URLSearchParams(location.search).get('page') || 'workbench.html';
  var matched = document.querySelector('.sidebar-menu [data-page="' + initialPage + '"]');
  if (matched) {
    showIframe(initialPage);
    breadcrumbCurrent.textContent = matched.getAttribute('data-title') || '工作台';
  } else if (/^[A-Za-z0-9_\-]+\.html$/.test(initialPage)) {
    // 未挂菜单的独立页面（如 *-locked*.html、detail-template.html）：直接 iframe 托管，避免落到空白占位
    showIframe(initialPage);
    breadcrumbCurrent.textContent = BASE_TITLE[initialPage.replace(/-locked(-vip|-count)?\.html$/, '.html')] || '页面预览';
  } else {
    setActive(document.querySelector('.sidebar-menu > .sidebar-menu-button[data-page="workbench.html"]'));
    breadcrumbCurrent.textContent = '工作台';
    showPlaceholder();
  }
</script>

</body>
