<style>
@layer tokens, base, components;
@layer tokens {
  :root {
    --primary: #0063FF; --border: #ebeef5;
    --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --radius-md: 0.25rem; --ring: #0063FF;
  }
}
@layer base {
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body { background: #f0f3fa; color: #333; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
}
@layer components {
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    height: 2.25rem; padding: 0 1rem; border: none; border-radius: var(--radius-md);
    font: 500 .875rem var(--font-sans); cursor: pointer; background: var(--primary); color: #fff;
  }
  .btn[data-size="sm"] { height: 2rem; padding: 0 .75rem; font-size: .8125rem; }
  .btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; border-radius: 9999px; padding: .125rem .625rem; font: 500 .6875rem var(--font-sans); }
}

/* ===== 页面 ===== */
.page { max-width: 1600px; margin: 0 auto; padding: 20px; }

/* 斜切页签：外层留出血，防止平行四边形缺角 */
.channel-bar-wrap { padding: 0; }
.channel-bar { background: #e4edfb; display: flex; gap: 0; padding: 0 20px 0 15px; overflow: visible; border-radius: 7px 7px 0 0; }
.channel-tab {
  width: 132px; height: 46px; display: flex; align-items: center; justify-content: center;
  transform: skewX(-18deg); cursor: pointer; border: none; font-family: var(--font-sans); font-size: 16px; font-weight: 500;
  background: #d5e5fb; color: #2b7bff;
}
.channel-tab > span { transform: skewX(18deg); }
.channel-tab.active { background: linear-gradient(180deg, #6ba1f5 0%, #4d8bf0 100%); color: #fff; }

.card { background: #ffffff; border: 1px solid #ebeef5; border-radius: 8px; }

/* 公司抬头 */
.co-head { display: flex; gap: 14px; padding: 22px 32px 18px; }
.co-icon { width: 52px; height: 52px; border-radius: 6px; background: #d8e6fd; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.co-name { font-size: 22px; font-weight: 600; margin: 2px 0 0; }
.co-tags { margin-top: 10px; }
.tag-blue { background: #e8f1ff; color: #409eff; border-radius: 2px; padding: 0 8px; font: 400 12px/20px var(--font-sans); }
.co-actions { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.co-btns { display: flex; gap: 12px; }
.btn-orange { background: linear-gradient(90deg,#ff8f3c,#ff5000); }
.btn-monitor { background: #d6e4ff; color: var(--primary); }
.co-update { display: inline-flex; gap: 5px; color: #999; font-size: 12px; align-items: center; }

.base-panel { margin: 0 32px; background: #f4f6fb; border-radius: 4px; padding: 20px 28px; position: relative; }
.base-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 60px; font-size: 14px; }
.base-item .k { color: #999; }
.base-item .v { color: #333; margin-left: 6px; }
.base-tools { position: absolute; top: 16px; right: 24px; display: flex; gap: 14px; }
.copy-link { color: #2b7bff; font: 400 13px var(--font-sans); background: none; border: none; cursor: pointer; }
.follow-btn { display: inline-flex; gap: 6px; background: none; border: none; color: #666; font: 400 14px var(--font-sans); cursor: pointer; }
.follow-btn.on { color: var(--primary); }

.main-nav { display: flex; gap: 64px; padding: 0 32px; margin-top: 22px; border-bottom: 1px solid #ebeef5; }
.main-nav a { position: relative; display: inline-flex; align-items: center; height: 54px; color: #333; font: 600 16px var(--font-sans); text-decoration: none; }
.main-nav a.active { color: #0063FF; }
.main-nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #0063FF; }
.nav-badge { position: absolute; top: 6px; right: -34px; background: #f5484d; color: #fff; font: 400 10px/16px var(--font-sans); padding: 0 6px; border-radius: 3px; }


.section { padding: 6px 32px 26px; scroll-margin-top: 20px; }
.sec-title { font: 600 14px var(--font-sans); color: #333; margin: 0 0 14px; padding-left: 8px; border-left: 3px solid var(--primary); line-height: 16px; }

.tbl { width: 100%; border-collapse: collapse; font: 400 13px var(--font-sans); table-layout: fixed; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 12px; text-align: center; color: #606266; word-break: break-all; }
.tbl th { background: #f4f6fb; color: #333; font-weight: 500; }
.tbl tbody tr:hover td { background: #e8f1fd; }
.phone-cell { display: inline-flex; align-items: center; gap: 6px; color: #333; }
.phone-cell svg { color: var(--primary); }
.phone-cell .masked { color: #c0c4cc; letter-spacing: 2px; }
.link-cell { color: var(--primary); text-decoration: none; }
.add-btn { background: #d6e4ff; color: var(--primary); border: none; border-radius: 3px; font: 400 12px/24px var(--font-sans); padding: 0 14px; cursor: pointer; }
.add-btn.done { background: #f4f4f5; color: #999; cursor: default; }

.pager { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.pager-total { font-size: 13px; color: #666; }
.pagination-list { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
.pagination-list a { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid #dcdfe6; border-radius: 4px; color: #606266; font-size: 13px; text-decoration: none; }
.pagination-list a:hover { border-color: var(--primary); color: var(--primary); }
.pagination-list a.pag-text { background: #f4f4f5; border-color: #f4f4f5; padding: 0 12px; }
.pagination-list a.pagination-active { border-color: var(--primary); color: var(--primary); font-weight: 500; }
.pagination-list a[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.pagination-ellipsis { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: #909399; }

/* 会员开通解锁弹窗（白底 + 红色提示/按钮；遮罩只盖表格区域，不遮盖整个页面） */
.lock-area { position: relative; min-height: 420px; }
.lock-area > .section:first-of-type { padding-top: 22px; }
.lock-overlay {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .32);
  display: flex; align-items: center; justify-content: center;
}
.lock-overlay[hidden] { display: none; }
.lock-gate {
  position: relative; width: 460px; margin: 0; padding: 26px 28px 24px; text-align: center;
  background: linear-gradient(180deg, #fdefee 0%, #ffffff 55%);
  border: 2px solid #f5b0aa; border-radius: 12px;
  box-shadow: 0 12px 40px rgba(225, 37, 27, 0.16);
}
.lock-gate h3 { margin: 0; font-size: 16px; font-weight: 700; color: #E1251B; display: flex; align-items: center; justify-content: center; gap: 8px; }
.lock-sub { margin: 10px 0 0; font-size: 13px; color: #666666; white-space: nowrap; }
.lock-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
.lock-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; background: #fdece8; border: 1px solid #f5b8b2; color: #c9302c; font-size: 13px; font-weight: 500; }
.lock-icon { display: block; flex: none; }
.lock-digits { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; }
.lock-digits .d { min-width: 34px; padding: 5px 0; border: 2px dashed #ffb35c; border-radius: 6px; background: #ffffff; font-size: 22px; font-weight: 800; color: #ff5000; }
.lock-digits .u { font-size: 13px; color: #666666; }
.lock-note { margin: 12px 0 0; font-size: 12px; color: #999999; }
.btn-unlock {
  margin-top: 16px; height: 44px; padding: 0 40px; border: none; border-radius: 8px;
  background: #E1251B; color: #ffffff;
  font-size: 16px; font-weight: 600; font-family: var(--font-sans); cursor: pointer;
  animation: unlock-pulse 1.6s infinite;
}
.btn-unlock:hover { opacity: 0.92; }
@keyframes unlock-pulse {
  0% { box-shadow: 0 0 0 0 rgba(225, 37, 27, 0.4); }
  70% { box-shadow: 0 0 0 18px rgba(225, 37, 27, 0); }
  100% { box-shadow: 0 0 0 0 rgba(225, 37, 27, 0); }
}
.unlock-badge { background: #e9f7ea; color: #67c23a; border-radius: 2px; padding: 0 8px; font-size: 12px; line-height: 20px; font-weight: 400; margin-left: 8px; }
.toast {
  position: fixed; left: 50%; top: 24px; transform: translate(-50%, -16px); z-index: 99;
  background: #333333; color: #ffffff; font-size: 14px; padding: 10px 22px; border-radius: 6px;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 版本徽标 */
.version-badge { position: fixed; right: 16px; bottom: 14px; z-index: 40; font-size: 11px; color: #999; background: rgba(255,255,255,.8); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; letter-spacing: .5px; user-select: none; }
</style>

<script>
(function () {
  'use strict';
  var PER = 10;
  var LOCKED = true;   /* 会员开通解锁版版：默认联系电话以 **** 遮罩，需开通会员解锁 */
  /* 假数据：中标联系人（联系人/电话/来源/相关项目数/更新时间）；工商联系人（联系人/电话/更新时间） */
  var BID = [
    ['经理','57646169','中标信息',0,'2017-03-09'],
    ['张伟','0755-28780808','中标信息',12,'2026-09-14'],
    ['李娜','13800138001','中标信息',8,'2026-08-02'],
    ['王强','0755-28782888','中标信息',5,'2026-07-21'],
    ['陈静','13900139002','中标信息',3,'2026-06-18'],
    ['刘洋','0755-28783888','中标信息',2,'2026-05-09'],
    ['赵磊','13700137003','中标信息',1,'2026-04-25'],
    ['孙丽','13600136004','中标信息',0,'2026-03-30'],
    ['周涛','0755-28784888','中标信息',6,'2026-02-16'],
    ['吴敏','13500135005','中标信息',4,'2026-01-08'],
    ['郑华','0755-28785888','中标信息',2,'2025-12-11'],
    ['冯杰','13400134006','中标信息',9,'2025-11-27']
  ];
  var BIZ = [
    ['何晓敏','0755-28780808','2026-10-16'],
    ['何晓敏','0755-28782888','2026-10-16'],
    ['谢思远','13800138002','2026-08-30'],
    ['陈立','0755-28783888','2026-08-30']
  ];
  function esc(s){ return String(s==null?'--':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var PHONE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  var pages = { bid: 1, biz: 1 };
  function phoneHTML(num) {
    if (LOCKED) return '<span class="phone-cell">' + PHONE + '<span class="masked">****</span></span>';
    return '<span class="phone-cell">' + PHONE + esc(num) + '</span>';
  }
  function pag(type, cur, total) {
    var h = '<li><a class="pag-text" href="#" data-type="'+type+'" data-page="prev"'+(cur===1?' aria-disabled="true"':'')+'>上一页</a></li>';
    var s = total<=10?1:Math.max(1,Math.min(cur-4,total-9)), e = Math.min(total,s+9);
    if (s>1) h += '<li><a href="#" data-type="'+type+'" data-page="1">1</a></li><li><span class="pagination-ellipsis">…</span></li>';
    for (var p=s;p<=e;p++) h += '<li><a'+(p===cur?' class="pagination-active" aria-current="page"':'')+' href="#" data-type="'+type+'" data-page="'+p+'">'+p+'</a></li>';
    if (e<total) h += '<li><span class="pagination-ellipsis">…</span></li><li><a href="#" data-type="'+type+'" data-page="'+total+'">'+total+'</a></li>';
    h += '<li><a class="pag-text" href="#" data-type="'+type+'" data-page="next"'+(cur===total?' aria-disabled="true"':'')+'>下一页</a></li>';
    return h;
  }
  function render(type) {
    var data = type==='bid'?BID:BIZ;
    var total = data.length, tp = Math.max(1, Math.ceil(total/PER));
    var cur = Math.min(pages[type], tp); pages[type] = cur;
    var rows = data.slice((cur-1)*PER, cur*PER);
    var head, body;
    if (type==='bid') {
      head = '<tr><th>联系人</th><th>联系电话</th><th>电话来源</th><th>相关项目</th><th>更新时间</th><th>操作</th></tr>';
      body = rows.map(function(r){
        return '<tr><td>'+esc(r[0])+'</td><td>'+phoneHTML(r[1])+'</td><td>'+esc(r[2])+'</td><td><a class="link-cell" href="#" onclick="return false;">'+r[3]+'</a></td><td>'+esc(r[4])+'</td><td><button class="add-btn" type="button">添加通讯录</button></td></tr>';
      }).join('');
    } else {
      head = '<tr><th>联系人</th><th>联系电话</th><th>电话来源</th><th>更新时间</th><th>操作</th></tr>';
      body = rows.map(function(r){
        return '<tr><td>'+esc(r[0])+'</td><td>'+phoneHTML(r[1])+'</td><td>工商信息</td><td>'+esc(r[2])+'</td><td><button class="add-btn" type="button">添加通讯录</button></td></tr>';
      }).join('');
    }
    var html = '<table class="tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
    if (total>PER) html += '<div class="pager"><span class="pager-total">共 '+total+' 条</span><ul class="pagination-list">'+pag(type,cur,tp)+'</ul></div>';
    document.getElementById('tbl-'+type).innerHTML = html;
  }
  /* 锁定态渲染表格（电话 **** 遮罩）在遮罩后展示，解锁后重渲染真实电话 */
  render('bid'); render('biz');

  document.addEventListener('click', function (e) {
    var a = e.target.closest('.pager a[data-type]');
    if (!a || a.getAttribute('aria-disabled')==='true') return;
    e.preventDefault();
    var type = a.dataset.type, data = type==='bid'?BID:BIZ;
    var tp = Math.max(1, Math.ceil(data.length/PER)), cur = pages[type], p = a.dataset.page;
    if (p==='prev') cur = Math.max(1,cur-1);
    else if (p==='next') cur = Math.min(tp,cur+1);
    else cur = parseInt(p,10);
    if (cur===pages[type]) return;
    pages[type] = cur; render(type);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.add-btn');
    if (!b || b.classList.contains('done')) return;
    b.classList.add('done'); b.textContent = '已添加';
  });
  /* 会员开通为纯演示：点击不做业务处理 */
  document.getElementById('follow-btn').addEventListener('click', function () {
    this.classList.toggle('on');
    this.querySelector('span').textContent = this.classList.contains('on')?'已关注':'关注';
  });
  document.getElementById('copy-btn').addEventListener('click', function () {
    var t = '公司名称：华为技术有限公司\n联系电话：0755-28780808\n地址：深圳市龙岗区坂田华为总部办公楼';
    var done = function(){ alert('企业信息已复制'); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done,done);
    else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
  });
})();
</script>
<script data-frame-report>
(function () {
  try {
    if (window.parent === window) return;
    var p = decodeURIComponent((location.pathname.split('/').pop() || ''));
    if (!/\.html$/i.test(p)) return;
    parent.postMessage({ type: 'bidcenter-location', page: p, title: document.title || '' }, '*');
  } catch (e) {}
})();
</script>
