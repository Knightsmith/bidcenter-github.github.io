<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; padding: 32px; }
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 28px; color: #2d3436; }
    .header p { color: #636e72; margin-top: 4px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { color: #636e72; font-size: 13px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #2d3436; margin-top: 8px; }
    .stat-card .change { font-size: 13px; margin-top: 4px; }
    .up { color: #00b894; }
    .down { color: #d63031; }
    .chart-placeholder { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; color: #b2bec3; height: 300px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 数据看板</h1>
    <p>今日概览</p>
  </div>
  <div class="cards">
    <div class="stat-card"><div class="label">活跃用户</div><div class="value">1,284</div><div class="change up">↑ 12.5%</div></div>
    <div class="stat-card"><div class="label">订单量</div><div class="value">356</div><div class="change up">↑ 8.3%</div></div>
    <div class="stat-card"><div class="label">转化率</div><div class="value">3.2%</div><div class="change down">↓ 0.5%</div></div>
    <div class="stat-card"><div class="label">总收入</div><div class="value">¥82,560</div><div class="change up">↑ 15.7%</div></div>
  </div>
  <div class="chart-placeholder">📈 图表区域（集成真实数据后显示）</div>
</body>
</html>
