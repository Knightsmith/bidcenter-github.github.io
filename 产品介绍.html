<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品介绍</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #333; }
    .hero { text-align: center; padding: 80px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .hero h1 { font-size: 48px; margin-bottom: 16px; }
    .hero p { font-size: 18px; opacity: 0.9; max-width: 600px; margin: 0 auto; }
    .features { max-width: 1000px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .feature { text-align: center; }
    .feature .icon { font-size: 40px; margin-bottom: 16px; }
    .feature h3 { margin-bottom: 8px; }
    .feature p { color: #666; font-size: 14px; line-height: 1.6; }
    @media (max-width: 768px) { .features { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🚀 智能产品平台</h1>
    <p>基于 AI 驱动的下一代解决方案，帮助企业实现数字化转型</p>
  </div>
  <div class="features">
    <div class="feature"><div class="icon">⚡</div><h3>极速部署</h3><p>AI 生成的页面一键部署，分钟级上线</p></div>
    <div class="feature"><div class="icon">🎨</div><h3>智能设计</h3><p>自动生成美观的 UI 界面，无需设计师介入</p></div>
    <div class="feature"><div class="icon">📊</div><h3>数据驱动</h3><p>内置数据分析能力，实时掌握业务动态</p></div>
  </div>
</body>
</html>
