<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #2d3436; }
    .btn-add { padding: 10px 20px; background: #0984e3; color: white; border: none; border-radius: 8px; cursor: pointer; }
    table { width: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { background: #f8f9fa; color: #636e72; font-weight: 600; font-size: 13px; }
    td { font-size: 14px; color: #2d3436; }
    .status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .status.active { background: #dfe6e9; color: #00b894; }
    .status.inactive { background: #dfe6e9; color: #d63031; }
    .action-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>👥 用户管理</h1>
    <button class="btn-add">+ 添加用户</button>
  </div>
  <table>
    <thead><tr><th>姓名</th><th>邮箱</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
      <tr><td>张三</td><td>zhangsan@example.com</td><td>管理员</td><td><span class="status active">正常</span></td><td><button class="action-btn">编辑</button></td></tr>
      <tr><td>李四</td><td>lisi@example.com</td><td>编辑</td><td><span class="status active">正常</span></td><td><button class="action-btn">编辑</button></td></tr>
      <tr><td>王五</td><td>wangwu@example.com</td><td>用户</td><td><span class="status inactive">停用</span></td><td><button class="action-btn">编辑</button></td></tr>
    </tbody>
  </table>
</body>
</html>
