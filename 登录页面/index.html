<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-card {
      background: white; border-radius: 16px; padding: 40px; width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .login-card h2 { text-align: center; margin-bottom: 28px; color: #333; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 15px; transition: border-color 0.2s; outline: none;
    }
    .form-group input:focus { border-color: #667eea; }
    .btn-login {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 8px; font-size: 16px;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn-login:hover { transform: translateY(-1px); }
    .links { text-align: center; margin-top: 20px; font-size: 14px; }
    .links a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>欢迎回来</h2>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" placeholder="请输入密码">
    </div>
    <button class="btn-login">登 录</button>
    <div class="links">
      <a href="#">忘记密码？</a> · <a href="#">注册账号</a>
    </div>
  </div>
</body>
</html>
